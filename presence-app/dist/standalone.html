<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Green Room</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A personal executive presence and articulation coach: practice reps, AI feedback, sparring and progress tracking.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600;6..96,700&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-column app shell (max 760px) with a sticky top bar, a bottom tab bar on phones
   (top tabs on wide screens), and full-screen sheets for focused practice flows.
   Identity: banker's-lamp green and brass; a VU-meter dial is the signature element. */
:root {
  --bg: #F1F4F1;
  --surface: #FFFFFF;
  --surface-2: #E8EDE9;
  --ink: #14211B;
  --muted: #56645D;
  --line: #D5DED8;
  --deep: #163D2D;
  --deep-2: #1F4D3A;
  --on-deep: #EAF2EC;
  --on-deep-muted: #A9C2B4;
  --brass: #86621F;
  --brass-bright: #C79A3C;
  --brass-soft: #F2E8D3;
  --on-brass: #FFFFFF;
  --good: #2C7A4B;
  --warn: #A85507;
  --bad: #B42318;
  --good-soft: rgba(44, 122, 75, 0.14);
  --warn-soft: rgba(168, 85, 7, 0.15);
  --bad-soft: rgba(180, 35, 24, 0.13);
  --shadow: 0 1px 2px rgba(20, 33, 27, 0.05), 0 6px 20px rgba(20, 33, 27, 0.06);
  --scrim: rgba(12, 22, 17, 0.45);
  --font-display: "Bodoni Moda", "Bodoni 72", Didot, "Big Caslon", Georgia, serif;
  --font-body: "Instrument Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 16px;
  --r-sm: 10px;
  --tabbar-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B120F; --surface: #121C17; --surface-2: #1A2720; --ink: #E5EDE8; --muted: #97A79E; --line: #25352D;
    --deep: #0F2A1F; --deep-2: #163829; --on-deep: #E5EFE8; --on-deep-muted: #8FB09E;
    --brass: #DDB868; --brass-bright: #E9C77A; --brass-soft: #3A3020; --on-brass: #1B1406;
    --good: #5FC28C; --warn: #F0A64A; --bad: #FF8B7B;
    --good-soft: rgba(95, 194, 140, 0.16); --warn-soft: rgba(240, 166, 74, 0.16); --bad-soft: rgba(255, 139, 123, 0.15);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.25); --scrim: rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B120F; --surface: #121C17; --surface-2: #1A2720; --ink: #E5EDE8; --muted: #97A79E; --line: #25352D;
  --deep: #0F2A1F; --deep-2: #163829; --on-deep: #E5EFE8; --on-deep-muted: #8FB09E;
  --brass: #DDB868; --brass-bright: #E9C77A; --brass-soft: #3A3020; --on-brass: #1B1406;
  --good: #5FC28C; --warn: #F0A64A; --bad: #FF8B7B;
  --good-soft: rgba(95, 194, 140, 0.16); --warn-soft: rgba(240, 166, 74, 0.16); --bad-soft: rgba(255, 139, 123, 0.15);
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.25); --scrim: rgba(0, 0, 0, 0.6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--brass); }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Shell ---------- */
.wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid transparent; }
.topbar.scrolled { border-bottom-color: var(--line); }
.topbar .wrap { display: flex; align-items: center; gap: 12px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 9px; font-family: var(--font-display); font-weight: 700; font-size: 21px; letter-spacing: -0.01em; color: var(--ink); background: none; border: 0; padding: 0; }
.brand svg { width: 26px; height: 26px; }
.topbar .spacer { flex: 1; }
.status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); display: inline-block; }
.status-dot.cloud { background: var(--good); }
.status-dot.syncing { background: var(--warn); }
.chip-streak { display: inline-flex; align-items: center; gap: 5px; height: 32px; padding: 0 11px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); font-family: var(--font-mono); font-size: 13px; font-weight: 500; }
.chip-streak svg { width: 15px; height: 15px; color: var(--brass); }
.avatar { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--deep); color: var(--on-deep); font-weight: 600; font-size: 14px; display: grid; place-items: center; }
.tabs-top { display: none; }
main#view { padding-bottom: calc(var(--tabbar-h) + 28px + env(safe-area-inset-bottom, 0px)); }
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
  background: color-mix(in srgb, var(--surface) 94%, transparent);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
}
.tabbar .inner { max-width: 760px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); height: var(--tabbar-h); }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; background: none; border: 0; color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: 0.02em; }
.tab svg { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--ink); }
.tab[aria-current="page"] svg { color: var(--brass); }
@media (min-width: 900px) {
  .tabbar { display: none; }
  .tabs-top { display: flex; gap: 4px; }
  .tabs-top .tab { flex-direction: row; gap: 7px; font-size: 14px; padding: 7px 12px; border-radius: 99px; }
  .tabs-top .tab svg { width: 18px; height: 18px; }
  .tabs-top .tab[aria-current="page"] { background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
  main#view { padding-bottom: 48px; }
}

/* ---------- Type ---------- */
.eyebrow { font-size: 11.5px; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }
.h1 { font-family: var(--font-display); font-weight: 600; font-size: clamp(27px, 7vw, 34px); line-height: 1.12; letter-spacing: -0.01em; }
.h2 { font-family: var(--font-display); font-weight: 600; font-size: 22px; line-height: 1.2; }
.h3 { font-size: 16px; font-weight: 600; line-height: 1.3; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.num { font-variant-numeric: tabular-nums; }
.prose p + p { margin-top: 10px; }
.prose { max-width: 62ch; }

/* ---------- Sections & cards ---------- */
.page { display: flex; flex-direction: column; gap: 22px; padding-top: 6px; }
.section { display: flex; flex-direction: column; gap: 12px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.card.pad-lg { padding: 20px; }
.card.flat { box-shadow: none; }
.card.raised { box-shadow: var(--shadow); }
.stack { display: flex; flex-direction: column; gap: 10px; }
.stack-lg { display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.row.nowrap { flex-wrap: nowrap; }
.row.between { justify-content: space-between; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 420px) { .grid3.collapse { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.divider { height: 1px; background: var(--line); border: 0; margin: 4px 0; }

/* Hero band (Today) */
.hero { background: var(--deep); color: var(--on-deep); border-radius: 22px; padding: 18px 18px 16px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; position: relative; overflow: hidden; }
.hero .greet { font-family: var(--font-display); font-size: 25px; font-weight: 600; line-height: 1.15; }
.hero .sub { color: var(--on-deep-muted); font-size: 13.5px; }
.hero-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 6px; }
.hero-stat { border-top: 1px solid color-mix(in srgb, var(--on-deep) 18%, transparent); padding-top: 8px; }
.hero-stat .v { font-family: var(--font-display); font-size: 24px; font-weight: 600; line-height: 1.1; font-variant-numeric: lining-nums tabular-nums; }
.hero-stat .k { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--on-deep-muted); font-weight: 600; }
.hero .gauge-wrap { display: flex; justify-content: center; margin: 2px auto 0; width: 100%; max-width: 330px; }

/* VU gauge */
.gauge { width: 100%; height: auto; display: block; }
.gauge .face { fill: var(--surface-2); }
.gauge .tick { stroke: var(--muted); }
.gauge .tick.major { stroke: var(--ink); }
.gauge .lbl { fill: var(--muted); font-family: var(--font-mono); font-size: 9px; }
.gauge .arc { fill: none; stroke: var(--line); stroke-width: 2; }
.gauge .zone-good { fill: none; stroke: var(--brass-bright); stroke-width: 5; }
.gauge .zone-mid { fill: none; stroke: var(--muted); stroke-width: 5; opacity: 0.35; }
.gauge .needle { stroke: var(--bad); stroke-width: 2.2; stroke-linecap: round; }
.gauge .pivot { fill: var(--ink); }
.gauge .score { fill: var(--ink); font-family: var(--font-display); font-weight: 700; font-size: 38px; }
.gauge .score.empty { font-family: var(--font-body); font-size: 15px; font-weight: 600; }
.gauge .cap { fill: var(--muted); font-family: var(--font-body); font-size: 9.5px; letter-spacing: 0.14em; font-weight: 600; }
.gauge.on-deep .face { fill: color-mix(in srgb, var(--on-deep) 7%, transparent); }
.gauge.on-deep .tick, .gauge.on-deep .lbl { stroke: var(--on-deep-muted); fill: var(--on-deep-muted); }
.gauge.on-deep .tick.major { stroke: var(--on-deep); }
.gauge.on-deep .lbl { stroke: none; }
.gauge.on-deep .arc { stroke: color-mix(in srgb, var(--on-deep) 25%, transparent); }
.gauge.on-deep .zone-mid { stroke: var(--on-deep-muted); }
.gauge.on-deep .needle { stroke: var(--brass-bright); }
.gauge.on-deep .pivot, .gauge.on-deep .score { fill: var(--on-deep); }
.gauge.on-deep .cap { fill: var(--on-deep-muted); }
.gauge .needle-g { transition: transform 1s cubic-bezier(.2, .9, .25, 1.15); }
@media (prefers-reduced-motion: reduce) { .gauge .needle-g { transition: none; } }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 12px; border: 1px solid transparent; font-weight: 600; font-size: 15px; background: var(--brass); color: var(--on-brass); text-decoration: none; white-space: nowrap; }
.btn svg { width: 18px; height: 18px; }
.btn:disabled { opacity: 0.5; cursor: default; }
.btn.secondary { background: var(--surface); color: var(--ink); border-color: var(--line); }
.btn.ghost { background: transparent; color: var(--ink); border-color: transparent; padding: 0 10px; }
.btn.deep { background: var(--deep); color: var(--on-deep); }
.btn.danger { background: var(--surface); color: var(--bad); border-color: var(--line); }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: 14px; border-radius: 10px; }
.btn.block { width: 100%; }
.btn.on-deep { background: var(--brass-bright); color: #1B1406; }
.icon-btn { width: 40px; height: 40px; display: inline-grid; place-items: center; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); flex: none; }
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn.plain { border-color: transparent; background: transparent; }
.link { background: none; border: 0; padding: 0; color: var(--brass); font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 5px; }
.link svg { width: 15px; height: 15px; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.actions > .btn { flex: 1 1 140px; }

/* Plan items / list rows */
.plan { display: flex; flex-direction: column; gap: 10px; }
.plan-item { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 12px 12px 12px; text-align: left; width: 100%; }
.plan-item .ic { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--surface-2); color: var(--deep); }
.plan-item .ic svg { width: 22px; height: 22px; }
:root[data-theme="dark"] .plan-item .ic { color: var(--brass); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .plan-item .ic { color: var(--brass); } }
.plan-item .t { font-weight: 600; line-height: 1.3; }
.plan-item .d { color: var(--muted); font-size: 13px; line-height: 1.35; margin-top: 2px; }
.plan-item .meta { font-family: var(--font-mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
.plan-item.done .ic { background: var(--good-soft); color: var(--good); }
.plan-item.done .t { color: var(--muted); }
.list { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.list-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 13px 14px; background: none; border: 0; border-top: 1px solid var(--line); text-align: left; width: 100%; color: inherit; }
.list-row:first-child { border-top: 0; }
.list-row .t { font-weight: 600; line-height: 1.3; }
.list-row .d { color: var(--muted); font-size: 13px; line-height: 1.35; margin-top: 1px; }
.list-row .chev { color: var(--muted); width: 18px; height: 18px; }
.list-row.has-ic { grid-template-columns: 36px minmax(0, 1fr) auto; }
.list-row .ic { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--surface-2); color: var(--brass); }
.list-row .ic svg { width: 19px; height: 19px; }

/* Chips & pills */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); font-size: 13.5px; font-weight: 500; color: var(--ink); }
.chip.on { background: var(--deep); color: var(--on-deep); border-color: var(--deep); }
.chip .x { opacity: 0.7; }
button.chip { cursor: pointer; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 99px; font-size: 12px; font-weight: 600; font-family: var(--font-mono); white-space: nowrap; background: var(--surface-2); color: var(--ink); }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.brass { background: var(--brass-soft); color: var(--brass); }

/* Segmented control */
.seg { display: inline-flex; background: var(--surface-2); border-radius: 12px; padding: 3px; gap: 2px; max-width: 100%; overflow-x: auto; }
.seg button { border: 0; background: transparent; padding: 7px 12px; border-radius: 9px; font-size: 13.5px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08); }
.seg.full { display: flex; }
.seg.full button { flex: 1; }

/* Forms */
label.field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
.input, textarea.input, select.input { width: 100%; min-height: 44px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 16px; font-weight: 400; line-height: 1.45; }
textarea.input { resize: vertical; min-height: 110px; }
textarea.input.tall { min-height: 200px; }
.input:focus { outline: 2px solid var(--brass); outline-offset: 0; border-color: transparent; }
.check { display: flex; align-items: center; gap: 10px; font-size: 15px; }
.check input { width: 20px; height: 20px; accent-color: var(--brass); }
.range-row { display: grid; grid-template-columns: minmax(0, 1fr) 120px; align-items: center; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); }
.range-row:first-child { border-top: 0; }
.range-row input[type="range"] { width: 100%; accent-color: var(--brass); }
.dots5 { display: flex; gap: 4px; justify-content: flex-end; }
.dots5 button { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface); padding: 0; }
.dots5 button.on { background: var(--brass); border-color: var(--brass); }

/* Metrics */
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 11px; min-width: 0; }
.kpi .k { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi .v { font-family: var(--font-mono); font-size: 20px; font-weight: 500; font-variant-numeric: tabular-nums; line-height: 1.25; margin-top: 2px; }
.kpi .s { font-size: 11.5px; color: var(--muted); line-height: 1.3; }
.kpi.good .v { color: var(--good); } .kpi.warn .v { color: var(--warn); } .kpi.bad .v { color: var(--bad); }
.bars { display: flex; flex-direction: column; gap: 10px; }
.bar { display: grid; grid-template-columns: 118px minmax(0, 1fr) 34px; align-items: center; gap: 10px; font-size: 13.5px; }
.bar .track { display: block; height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; position: relative; }
.bar .fill { display: block; height: 100%; border-radius: 99px; background: var(--brass); transition: width 0.8s ease; }
.bar .fill.good { background: var(--good); } .bar .fill.warn { background: var(--warn); } .bar .fill.bad { background: var(--bad); }
.bar .val { font-family: var(--font-mono); font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; }
.delta { font-family: var(--font-mono); font-size: 12px; font-weight: 600; }
.delta.up { color: var(--good); } .delta.down { color: var(--bad); }

/* Transcript highlights */
.transcript { font-size: 15.5px; line-height: 1.7; white-space: pre-wrap; overflow-wrap: anywhere; }
mark.hl { color: inherit; border-radius: 4px; padding: 0 2px; }
mark.hl-filler { background: var(--bad-soft); box-shadow: inset 0 -2px 0 var(--bad); }
mark.hl-hedge { background: var(--warn-soft); box-shadow: inset 0 -2px 0 var(--warn); }
mark.hl-power { background: var(--good-soft); box-shadow: inset 0 -2px 0 var(--good); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

/* Coach card */
.coach { border-color: color-mix(in srgb, var(--brass) 45%, var(--line)); }
.coach-head { display: flex; align-items: center; gap: 10px; }
.coach-head .badge { width: 34px; height: 34px; border-radius: 10px; background: var(--brass-soft); color: var(--brass); display: grid; place-items: center; flex: none; }
.coach-head .badge svg { width: 18px; height: 18px; }
.coach .headline { font-family: var(--font-display); font-size: 20px; font-weight: 600; line-height: 1.25; }
.fix { border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 6px; }
.fix .issue { font-weight: 600; }
.quote { font-style: italic; color: var(--muted); border-left: 3px solid var(--bad); padding-left: 10px; overflow-wrap: anywhere; }

const A = {};

A.round = (v, d = 0) => { const m = Math.pow(10, d); return Math.round(v * m) / m; };
const mean = (a) => (a.length ? a.reduce((s, x) => s + x, 0) / a.length : 0);
const pct = (sorted, p) => { if (!sorted.length) return 0; const i = A.clamp(Math.floor(p * (sorted.length - 1)), 0, sorted.length - 1); return sorted[i]; };
const median = (a) => { if (!a.length) return 0; const s = [...a].sort((x, y) => x - y); return pct(s, 0.5); };
const std = (a) => { if (a.length < 2) return 0; const m = mean(a); return Math.sqrt(mean(a.map((x) => (x - m) * (x - m)))); };

A.normalize = (t) => String(t || '')

function compile(list) { return list.map(([src, label]) => ({ re: new RegExp(src, 'gim'), label })); }
const RX = { fillers: compile(FILLERS), hedges: compile(HEDGES), power: compile(POWER) };

A.setCustomFillers = function (words) {
  const extra = (words || []).map((w) => String(w).trim()).filter(Boolean).slice(0, 20)
    .map((w) => [`\\b${w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\\b`, w.toLowerCase()]);
  RX.fillers = compile(FILLERS.concat(extra));
};

function findAll(text, list, kind) {
  const hits = [];
  for (const { re, label } of list) {
    re.lastIndex = 0;
    let m;
    while ((m = re.exec(text))) {
      let start = m.index, str = m[0];
      // trim leading punctuation/space from sentence-opener matches
      const lead = str.match(/^[.!?\s]+/);
      if (lead) { start += lead[0].length; str = str.slice(lead[0].length); }
      if (str.length) hits.push({ start, end: start + str.length, kind, label, text: str });
      if (m[0].length === 0) re.lastIndex++;
    }
  }
  return hits;
}

function countBy(hits) {
  const map = {};
  for (const h of hits) map[h.label] = (map[h.label] || 0) + 1;
  return Object.entries(map).sort((a, b) => b[1] - a[1]).map(([label, n]) => ({ label, n }));
}

function syllables(word) {
  const w = word.toLowerCase().replace(/[^a-z]/g, '');
  if (!w) return 0;
  if (w.length <= 3) return 1;
  const s = w.replace(/(?:[^laeiouy]es|ed|[^laeiouy]e)$/, '').replace(/^y/, '');
  const m = s.match(/[aeiouy]{1,2}/g);
  return Math.max(1, m ? m.length : 1);
}

A.sentences = function (text) {
  const parts = text.replace(/([.!?]+)(\s+|$)/g, '$1\n').split('\n').map((s) => s.trim()).filter((s) => /[A-Za-z0-9]/.test(s));
  return parts;
};

/**
 * Analyze a transcript.
 * opts: { durationSec, source: 'mic'|'dictation'|'typed'|'upload', timeLimit, paceLo, paceHi }
 */
A.analyzeText = function (raw, opts = {}) {
  const text = A.normalize(raw);
  const words = A.wordList(text);
  const n = words.length;
  const spoken = opts.source && opts.source !== 'typed';
  const durationSec = spoken && opts.durationSec ? opts.durationSec : null;
  const minutes = durationSec ? durationSec / 60 : null;

  const fillerHits = findAll(text, RX.fillers, 'filler');
  const hedgeHits = findAll(text, RX.hedges, 'hedge');
  const powerHits = findAll(text, RX.power, 'power');
  // Repeated word restarts ("the the", "I I")
  const repRe = /\b([A-Za-z']+)\s+\1\b/gi; let rm;
  while ((rm = repRe.exec(text))) {
    if (!/^(?:that|had|is|very|bye|no|yes|so)$/i.test(rm[1])) fillerHits.push({ start: rm.index, end: rm.index + rm[0].length, kind: 'filler', label: 'restart', text: rm[0] });
  }

  let sentences = A.sentences(text);
  const punctuated = /[.!?]/.test(text);
  if (!punctuated && n > 25) {
    sentences = [];
    for (let i = 0; i < n; i += 16) sentences.push(words.slice(i, i + 16).join(' '));
  }
  const sentLens = sentences.map((s) => A.wordList(s).length).filter((x) => x > 0);
  const avgSentence = sentLens.length ? mean(sentLens) : n;
  const longSentences = sentLens.filter((x) => x > 30).length;

  const first = sentences[0] ? A.wordList(sentences[0]).slice(0, 30).join(' ') : words.slice(0, 30).join(' ');
  let bluf = 'unclear';
  if (n >= 8) {
    if (BLUF_NEG.test(first)) bluf = false;
    else if (BLUF_POS.test(first)) bluf = true;
    else if (/^(?:so|well|um|uh|okay|ok)\b/i.test(first) || A.wordList(sentences[0] || '').length > 35) bluf = false;
  }
  const signposts = (text.match(SIGNPOSTS) || []).length;
  const impactWords = (text.match(IMPACT) || []).length;
  const numbers = (text.match(NUMBERS) || []).filter((x) => /\d|percent|million|billion|thousand|times|basis/i.test(x)).length;
  const lastSentence = sentences[sentences.length - 1] || '';
  const weakEnd = n >= 15 && WEAK_END.test(lastSentence.trim()) ? (lastSentence.match(WEAK_END) || [''])[0].replace(/\W+$/, '').trim() : null;
  const asks = powerHits.filter((h) => h.label === 'ask' || h.label === 'recommend' || h.label === 'propose').length;
  const apologies = hedgeHits.filter((h) => h.label === 'sorry').length;
  const iCount = (text.match(/\bI\b|\bI'm\b|\bI've\b|\bI'll\b|\bmy\b/g) || []).length;
  const weCount = (text.match(/\bwe\b|\bwe're\b|\bwe've\b|\bwe'll\b|\bour\b/gi) || []).length;

  const lower = words.map((w) => w.toLowerCase().replace(/[^a-z0-9']/g, '')).filter(Boolean);
  const uniq = new Set(lower).size;
  const tri = {};
  for (let i = 0; i + 2 < lower.length; i++) {
    const k = lower.slice(i, i + 3).join(' ');
    if (/^(?:um|uh|you know|i mean)/.test(k)) continue;
    tri[k] = (tri[k] || 0) + 1;
  }
  const repeats = Object.entries(tri).filter(([, c]) => c >= 3).map(([k, c]) => ({ phrase: k, n: c })).slice(0, 5);
  const syl = words.reduce((s, w) => s + syllables(w), 0);
  const flesch = n ? A.round(206.835 - 1.015 * (n / Math.max(1, sentLens.length)) - 84.6 * (syl / n)) : null;

  const wpm = minutes && durationSec >= 8 ? A.round(n / minutes) : null;
  return {
    text, words: n, durationSec, wpm, spoken, source: opts.source || 'typed',
    fillers: { total: fillerHits.length, byType: countBy(fillerHits), perMin: minutes ? A.round(fillerHits.length / minutes, 1) : null, per100: n ? A.round((fillerHits.length / n) * 100, 1) : 0 },
    hedges: { total: hedgeHits.length, byType: countBy(hedgeHits), per100: n ? A.round((hedgeHits.length / n) * 100, 1) : 0 },
    power: { total: powerHits.length, byType: countBy(powerHits) },
    sentences: sentLens.length, avgSentence: A.round(avgSentence, 1), longSentences, punctuated,
    bluf, firstSentence: sentences[0] || '', signposts, impactWords, numbers, weakEnd, asks, apologies,
    iCount, weCount, vocab: n ? A.round(uniq / n, 2) : 0, repeats, flesch,
    hits: fillerHits.concat(hedgeHits, powerHits),
  };
};

/** Turn transcript + hits into highlighted HTML. */
A.highlight = function (ta) {
  const text = ta.text;
  const prio = { filler: 3, hedge: 2, power: 1 };
  const hits = [...ta.hits].sort((a, b) => a.start - b.start || prio[b.kind] - prio[a.kind]);
  const kept = [];
  let lastEnd = -1;
  for (const h of hits) {
    if (h.start >= lastEnd) { kept.push(h); lastEnd = h.end; }
    else if (kept.length && prio[h.kind] > prio[kept[kept.length - 1].kind] && h.start === kept[kept.length - 1].start) { kept[kept.length - 1] = h; lastEnd = h.end; }
  }
  let out = '', pos = 0;
  for (const h of kept) {
    out += esc(text.slice(pos, h.start));
    out += `<mark class="hl hl-${h.kind}" title="${esc(h.label)}">${esc(text.slice(h.start, h.end))}</mark>`;
    pos = h.end;
  }
  out += esc(text.slice(pos));
  return out;
};

/**
 * Score a rep. ta = text analysis (may be null), au = audio analysis (may be null).
 * opts: { paceLo, paceHi, timeLimit }
 */
A.score = function (ta, au, opts = {}) {
  const lo = opts.paceLo || 130, hi = opts.paceHi || 160;
  const s = {};
  const notes = [];
  const n = ta ? ta.words : 0;

  // Delivery
  const del = [];
  let wpm = ta && ta.wpm;
  if (!wpm && au && au.estWpm) wpm = au.estWpm;
  if (wpm) {
    const d = wpm < lo ? lo - wpm : wpm > hi ? wpm - hi : 0;
    del.push([A.clamp(100 - d * 1.6, 30, 100), 0.3]);
  }
  if (ta && n >= 10) {
    const perMin = ta.fillers.perMin != null ? ta.fillers.perMin : ta.fillers.per100 * 1.45;
    del.push([A.clamp(100 - Math.max(0, perMin - 1) * 14, 20, 100), 0.35]);
  }
  if (au && au.ok) {
    const dp = au.pauses.deliberatePerMin;
    const pauseScore = dp < 3 ? 100 - (3 - dp) * 15 : dp > 14 ? 100 - (dp - 14) * 6 : 100;
    const range = au.pitch.rangeSt;
    const pitchScore = range == null ? null : range >= 6 ? 100 : range >= 3 ? 60 + (range - 3) * 13 : 40 + range * 7;
    const up = au.upspeak.pct;
    const upScore = up == null ? null : up <= 15 ? 100 : A.clamp(100 - (up - 15) * 1.6, 40, 100);
    del.push([A.clamp(pauseScore, 40, 100), 0.12]);
    if (pitchScore != null) del.push([pitchScore, 0.13]);
    if (upScore != null) del.push([upScore, 0.1]);
  }
  if (del.length) { const w = del.reduce((a, [, x]) => a + x, 0); s.delivery = Math.round(del.reduce((a, [v, x]) => a + v * x, 0) / w); }

  if (ta && n >= 10) {
    // Confidence
    let conf = 100 - ta.hedges.per100 * 9 - ta.apologies * 8 - (ta.weakEnd ? 10 : 0) + Math.min(10, ta.power.total * 3);
    s.confidence = Math.round(A.clamp(conf, 20, 100));
    // Clarity
    let cl = 58 + (ta.bluf === true ? 24 : ta.bluf === 'unclear' ? 6 : -12) + Math.min(12, ta.signposts * 6);
    cl += ta.avgSentence <= 18 ? 6 : ta.avgSentence <= 24 ? 2 : ta.avgSentence > 30 ? -10 : -4;
    s.clarity = Math.round(A.clamp(cl, 20, 100));
    // Concision
    let co = 100 - Math.max(0, ta.avgSentence - 18) * 2.5 - ta.longSentences * 4 - ta.repeats.length * 4
      - ((ta.fillers.total + ta.hedges.total) / Math.max(1, n)) * 100 * 1.5;
    if (opts.timeLimit && ta.durationSec && ta.durationSec > opts.timeLimit * 1.15) co -= ((ta.durationSec / opts.timeLimit) - 1) * 40;
    s.concision = Math.round(A.clamp(co, 20, 100));
    // Executive impact
    let im = 45 + Math.min(24, ta.numbers * 8) + Math.min(15, ta.impactWords * 3) + (ta.asks ? 10 : 0) + (ta.bluf === true ? 6 : 0);
    s.impact = Math.round(A.clamp(im, 20, 100));
  }
  const vals = ['clarity', 'concision', 'confidence', 'delivery', 'impact'].map((k) => s[k]).filter((v) => v != null);
  s.overall = vals.length ? Math.round(mean(vals)) : null;

  // Coaching notes (rule-based), most important first
  if (ta && n >= 10) {
    if (ta.bluf === false) notes.push({ w: 9, dim: 'clarity', text: 'You opened with set-up. Put the answer, recommendation or ask in your first sentence.' });
    if (ta.fillers.total >= 3) {
      const top = ta.fillers.byType.slice(0, 2).map((x) => `"${x.label}" ×${x.n}`).join(', ');
      notes.push({ w: 7 + Math.min(3, ta.fillers.total / 4), dim: 'delivery', text: `${ta.fillers.total} fillers (${top}). Swap each one for a silent beat.` });
    }
    if (ta.hedges.total >= 2) {
      const top = ta.hedges.byType.slice(0, 3).map((x) => `"${x.label}"`).join(', ');
      notes.push({ w: 7 + Math.min(3, ta.hedges.total / 3), dim: 'confidence', text: `${ta.hedges.total} hedges (${top}). Cut them, or replace them with one precise statement of what you don't know.` });
    }
    if (ta.avgSentence > 24 && ta.punctuated) notes.push({ w: 6, dim: 'concision', text: `Your sentences average ${Math.round(ta.avgSentence)} words. Aim for under 20; break at every "and".` });
    if (ta.numbers === 0 && n > 50) notes.push({ w: 5, dim: 'impact', text: 'No numbers. One specific figure makes the point concrete and credible.' });
    if (ta.weakEnd) notes.push({ w: 6, dim: 'confidence', text: `You ended on "${ta.weakEnd}". End on your recommendation, then stop.` });
    if (!ta.asks && n > 60) notes.push({ w: 3, dim: 'impact', text: 'No explicit ask. Say what you want them to decide or do.' });
    if (ta.repeats.length) notes.push({ w: 3, dim: 'concision', text: `Repeated phrase: "${ta.repeats[0].phrase}". Say it once.` });
  }
  if (wpm) {
    if (wpm > hi + 5) notes.push({ w: 6 + Math.min(3, (wpm - hi) / 15), dim: 'delivery', text: `${Math.round(wpm)} words a minute is above your ${lo}–${hi} band. Slow down most on numbers and your key sentence.` });
    else if (wpm < lo - 15) notes.push({ w: 4, dim: 'delivery', text: `${Math.round(wpm)} words a minute is on the slow side. Move faster through context; slow down only for the point.` });
  }
  if (au && au.ok) {
    if (au.upspeak.pct != null && au.upspeak.pct > 25 && au.upspeak.segments >= 4) notes.push({ w: 6, dim: 'delivery', text: `About ${Math.round(au.upspeak.pct)}% of your phrases ended on a rising pitch. Land statements down.` });
    if (au.pitch.rangeSt != null && au.pitch.rangeSt < 4) notes.push({ w: 5, dim: 'delivery', text: `Your pitch range was narrow (${au.pitch.rangeSt} semitones). Lift for contrast, drop for conclusions.` });
    if (au.pauses.deliberatePerMin < 2 && au.activeSpan > 30) notes.push({ w: 4, dim: 'delivery', text: 'Few deliberate pauses. Pause before your key sentence and after it.' });
    if (au.pauses.long >= 2) notes.push({ w: 3, dim: 'delivery', text: `${au.pauses.long} gaps longer than two seconds. Plan your next point before you need it.` });
    if (au.volume.trailOffPct > 30 && au.upspeak.segments >= 4) notes.push({ w: 4, dim: 'delivery', text: 'Your volume often drops at the end of phrases. Keep energy through the last word.' });
  }
  if (opts.timeLimit && ta && ta.durationSec && ta.durationSec > opts.timeLimit * 1.15) {
    notes.push({ w: 6, dim: 'concision', text: `You ran ${Math.round(ta.durationSec - opts.timeLimit)}s over the ${opts.timeLimit}s limit.` });
  }
  notes.sort((a, b) => b.w - a.w);
  if (!notes.length && n >= 20) notes.push({ w: 1, dim: 'clarity', text: 'Clean rep. Now say it 20% shorter with the same punch.' });
  s.notes = notes.slice(0, 4).map((x) => ({ dim: x.dim, text: x.text }));
  s.wpm = wpm ? Math.round(wpm) : null;
  return s;
};

/* ------------------------------------------------------------
   Audio
   ------------------------------------------------------------ */
A.decodeFile = async function (fileOrBlob) {
  const buf = await fileOrBlob.arrayBuffer();
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) throw new Error('This browser can\'t decode audio.');
  const ctx = new AC();
  try {
    const audio = await new Promise((resolve, reject) => {
      const p = ctx.decodeAudioData(buf, resolve, reject);
      if (p && typeof p.then === 'function') p.then(resolve, reject);
    });
    return audio;
  } finally {
    try { const p = ctx.close && ctx.close(); if (p && p.catch) p.catch(() => {}); } catch (e) { /* ignore */ }
  }
};

A.toMono = function (audioBuffer, target = 16000, maxSec = 600) {
  const sr = audioBuffer.sampleRate;
  const ch = audioBuffer.numberOfChannels;
  const len = Math.min(audioBuffer.length, Math.floor(sr * maxSec));
  const ratio = sr / target;
  const outLen = Math.floor(len / ratio);
  const out = new Float32Array(outLen);
  const chans = [];
  for (let i = 0; i < ch; i++) chans.push(audioBuffer.getChannelData(i));
  for (let i = 0; i < outLen; i++) {
    const a = Math.floor(i * ratio), b = Math.min(len, Math.max(a + 1, Math.floor((i + 1) * ratio)));
    let sum = 0;
    for (let j = a; j < b; j++) for (let c = 0; c < ch; c++) sum += chans[c][j];
    out[i] = sum / ((b - a) * ch);
  }
  return { data: out, sr: target, duration: audioBuffer.duration };
};

const tick = () => new Promise((r) => setTimeout(r, 0));

/** Full acoustic analysis on mono 16 kHz samples. */
A.analyzeAudio = async function ({ data, sr, duration }, onProgress) {
  const hop = Math.round(sr * 0.01), win = Math.round(sr * 0.025);
  const nF = Math.max(0, Math.floor((data.length - win) / hop) + 1);
  if (nF < 50) return { ok: false, reason: 'Recording is too short to analyze.' };
  const db = new Float32Array(nF);
  for (let f = 0; f < nF; f++) {
    let s = 0; const o = f * hop;
    for (let j = 0; j < win; j++) { const v = data[o + j]; s += v * v; }
    db[f] = 10 * Math.log10(s / win + 1e-10);
  }
  const sorted = Array.from(db).sort((a, b) => a - b);
  const floor = pct(sorted, 0.1), peak = pct(sorted, 0.97);
  if (peak - floor < 10) return { ok: false, reason: 'Couldn\'t find clear speech in this recording. Try a quieter room or hold the phone closer.' };
  const thr = Math.max(floor + 8, floor + 0.32 * (peak - floor));
  let sp = new Uint8Array(nF);
  for (let f = 0; f < nF; f++) sp[f] = db[f] > thr ? 1 : 0;
  // close gaps < 200 ms (inside words), drop blips < 60 ms
  const fill = (arr, val, maxLen) => {
    let i = 0;
    while (i < nF) {
      if (arr[i] === val) { let j = i; while (j < nF && arr[j] === val) j++; if (i > 0 && j < nF && j - i < maxLen) for (let k = i; k < j; k++) arr[k] = 1 - val; i = j; } else i++;
    }
  };
  fill(sp, 0, 20); fill(sp, 1, 6);
  const segs = [];
  { let i = 0; while (i < nF) { if (sp[i]) { let j = i; while (j < nF && sp[j]) j++; segs.push([i, j]); i = j; } else i++; } }
  if (!segs.length) return { ok: false, reason: 'No speech detected.' };
  const fr = (x) => (x * hop) / sr;
  const activeStart = fr(segs[0][0]), activeEnd = fr(segs[segs.length - 1][1]);
  const activeSpan = Math.max(0.1, activeEnd - activeStart);
  const speakingTime = segs.reduce((s, [a, b]) => s + fr(b - a), 0);
  const gaps = [];
  for (let i = 1; i < segs.length; i++) gaps.push(fr(segs[i][0] - segs[i - 1][1]));
  const realPauses = gaps.filter((g) => g >= 0.3);
  const deliberate = gaps.filter((g) => g >= 0.6 && g < 2.0).length;
  const longGaps = gaps.filter((g) => g >= 2.0).length;
  onProgress && onProgress(0.25);
  await tick();

  // Syllable nuclei from the energy envelope (pace estimate)
  const env = new Float32Array(nF);
  for (let f = 0; f < nF; f++) { let s = 0, c = 0; for (let k = -2; k <= 2; k++) { const i = f + k; if (i >= 0 && i < nF) { s += db[i]; c++; } } env[f] = s / c; }
  let syl = 0, lastPeak = -100;
  for (let f = 3; f < nF - 3; f++) {
    if (!sp[f]) continue;
    if (env[f] >= env[f - 1] && env[f] > env[f + 1]) {
      let mn = env[f];
      for (let k = Math.max(0, f - 9); k <= Math.min(nF - 1, f + 9); k++) mn = Math.min(mn, env[k]);
      if (env[f] - mn >= 2.5 && f - lastPeak >= 10) { syl++; lastPeak = f; }
    }
  }
  const estWpm = A.round((syl / 1.45) / (activeSpan / 60));

  // Pitch: normalized autocorrelation at 8 kHz on voiced frames, 20 ms hop
  const dsr = 8000, step = sr / dsr;
  const dN = Math.floor(data.length / step);
  const d8 = new Float32Array(dN);
  for (let i = 0; i < dN; i++) { const a = Math.floor(i * step); d8[i] = (data[a] + (data[a + 1] || 0)) / 2; }
  const pwin = 320, phop = 160, minLag = 20, maxLag = 114;
  const nP = Math.max(0, Math.floor((dN - pwin - maxLag) / phop));
  const f0 = new Float32Array(nP);
  for (let p = 0; p < nP; p++) {
    if (p % 400 === 0) { onProgress && onProgress(0.25 + 0.65 * (p / Math.max(1, nP))); await tick(); }
    const tSec = (p * phop) / dsr;
    const fi = Math.min(nF - 1, Math.floor((tSec * sr) / hop) + 1);
    if (!sp[fi] || db[fi] < thr + 3) continue;
    const o = p * phop;
    let e0 = 0;
    for (let j = 0; j < pwin; j++) e0 += d8[o + j] * d8[o + j];
    if (e0 < 1e-6) continue;
    let best = 0, bestLag = 0;
    const r = new Float32Array(maxLag + 2);
    for (let lag = minLag; lag <= maxLag + 1; lag++) {
      let c = 0, e1 = 0;
      for (let j = 0; j < pwin; j++) { const b = d8[o + j + lag]; c += d8[o + j] * b; e1 += b * b; }
      const v = c / Math.sqrt(e0 * e1 + 1e-12);
      r[lag] = v;
      if (lag <= maxLag && v > best) { best = v; bestLag = lag; }
    }
    if (best > 0.55 && bestLag > minLag && bestLag < maxLag) {
      const a = r[bestLag - 1], b = r[bestLag], c = r[bestLag + 1];
      const den = a - 2 * b + c;
      const shift = den !== 0 ? 0.5 * (a - c) / den : 0;
      f0[p] = dsr / (bestLag + A.clamp(shift, -1, 1));
    }
  }
  // median-smooth and drop octave jumps
  const voiced = [];
  for (let p = 0; p < nP; p++) if (f0[p] > 0) voiced.push(f0[p]);
  const fMed = median(voiced);
  const st = new Float32Array(nP).fill(NaN);
  for (let p = 2; p < nP - 2; p++) {
    if (!(f0[p] > 0)) continue;
    const w = [f0[p - 2], f0[p - 1], f0[p], f0[p + 1], f0[p + 2]].filter((x) => x > 0);
    const m = median(w);
    if (fMed && (m > fMed * 1.85 || m < fMed / 1.85)) continue;
    st[p] = 12 * Math.log2(m / fMed);
  }
  const stVals = Array.from(st).filter((x) => !isNaN(x));
  const stSorted = [...stVals].sort((a, b) => a - b);
  const rangeSt = stVals.length >= 40 ? A.round(pct(stSorted, 0.9) - pct(stSorted, 0.1), 1) : null;

  // Rising endings and trail-off per phrase (segments separated by >= 350 ms)
  const phrases = [];
  { let cur = null;
    for (let i = 0; i < segs.length; i++) {
      if (!cur) cur = [segs[i][0], segs[i][1]];
      else if (fr(segs[i][0] - cur[1]) < 0.35) cur[1] = segs[i][1];
      else { phrases.push(cur); cur = [segs[i][0], segs[i][1]]; }
    }
    if (cur) phrases.push(cur); }
  let up = 0, judged = 0, trail = 0, trailJudged = 0;
  const phraseDb = [];
  for (const [a, b] of phrases) {
    const dur = fr(b - a);
    const dbs = Array.from(db.slice(a, b));
    phraseDb.push(mean(dbs));
    if (dur >= 0.8) {
      const cut = a + Math.floor((b - a) * 0.75);
      const head = mean(Array.from(db.slice(a, cut))), tail = mean(Array.from(db.slice(cut, b)));
      trailJudged++; if (head - tail > 6) trail++;
    }
    if (dur < 0.7) continue;
    const pa = Math.floor((fr(a) * dsr) / phop), pb = Math.floor((fr(b) * dsr) / phop);
    const pts = [];
    for (let p = pa; p < Math.min(pb, nP); p++) if (!isNaN(st[p])) pts.push([p, st[p]]);
    if (pts.length < 12) continue;
    const tailFrames = Math.round((0.3 * dsr) / phop);
    const tailPts = pts.filter(([p]) => p >= pb - tailFrames).map(([, v]) => v);
    const bodyPts = pts.filter(([p]) => p < pb - tailFrames).map(([, v]) => v);
    if (tailPts.length < 3 || bodyPts.length < 5) continue;
    judged++;
    if (median(tailPts) - median(bodyPts) > 2) up++;
  }
  onProgress && onProgress(1);

  // Waveform summary for drawing
  const bins = 160, per = Math.max(1, Math.floor(data.length / bins)), wave = [];
  for (let b = 0; b < bins; b++) { let m = 0; const o = b * per; for (let j = 0; j < per && o + j < data.length; j += 4) m = Math.max(m, Math.abs(data[o + j])); wave.push(m); }
  const wmax = Math.max(...wave, 1e-6);

  return {
    ok: true,
    duration: A.round(duration || data.length / sr, 1),
    activeSpan: A.round(activeSpan, 1),
    speakingTime: A.round(speakingTime, 1),
    speechRatio: A.round(speakingTime / activeSpan, 2),
    pauses: {
      count: realPauses.length,
      deliberate,
      deliberatePerMin: A.round(deliberate / (activeSpan / 60), 1),
      long: longGaps,
      avg: A.round(mean(realPauses), 2),
      longest: A.round(Math.max(0, ...gaps), 1),
    },
    estWpm: activeSpan > 8 ? estWpm : null,
    sylRate: A.round(syl / Math.max(0.1, speakingTime), 1),
    pitch: { medianHz: fMed ? Math.round(fMed) : null, rangeSt, stdSt: stVals.length ? A.round(std(stVals), 1) : null, monotone: rangeSt != null && rangeSt < 4 },
    upspeak: { segments: judged, rising: up, pct: judged >= 3 ? A.round((up / judged) * 100) : null },
    volume: { phraseVarDb: A.round(std(phraseDb), 1), trailOffPct: trailJudged ? A.round((trail / trailJudged) * 100) : 0 },
    wave: wave.map((v) => A.round(v / wmax, 3)),
  };
};

/** Pull a few still frames from a video file for the visual check. */
A.videoFrames = async function (file, count = 3) {
  const url = URL.createObjectURL(file);
  const v = document.createElement('video');
  v.muted = true; v.playsInline = true; v.setAttribute('playsinline', ''); v.preload = 'auto'; v.src = url;
  const once = (ev, ms = 8000) => new Promise((res, rej) => {
    const t = setTimeout(() => rej(new Error('The video took too long to load.')), ms);
    v.addEventListener(ev, () => { clearTimeout(t); res(); }, { once: true });
    v.addEventListener('error', () => { clearTimeout(t); rej(new Error('This video format can\'t be read here. Try a photo instead.')); }, { once: true });
  });
  try {
    await once('loadeddata');
    try { await v.play(); v.pause(); } catch (e) { /* autoplay blocked is fine */ }
    const dur = v.duration || 1;
    const marks = [0.2, 0.5, 0.8].slice(0, count);
    const frames = [];
    const scale = Math.min(1, 960 / (v.videoWidth || 960));
    const cw = Math.max(1, Math.round((v.videoWidth || 640) * scale)), ch = Math.max(1, Math.round((v.videoHeight || 480) * scale));
    const canvas = document.createElement('canvas'); canvas.width = cw; canvas.height = ch;
    const ctx = canvas.getContext('2d');
    for (const m of marks) {
      v.currentTime = Math.min(dur - 0.05, dur * m);
      await once('seeked');
      ctx.drawImage(v, 0, 0, cw, ch);
      const blob = await new Promise((r) => canvas.toBlob(r, 'image/jpeg', 0.82));
      if (blob) frames.push({ blob, url: URL.createObjectURL(blob) });
    }
    return { frames, duration: dur };
  } finally {
    URL.revokeObjectURL(url);
  }
};

/** Shrink a photo before sending it. */
A.shrinkImage = async function (file, max = 1280) {
  const url = URL.createObjectURL(file);
  try {
    const img = new Image();
    await new Promise((res, rej) => { img.onload = res; img.onerror = () => rej(new Error('That image couldn\'t be opened.')); img.src = url; });
    const sc = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth * sc); c.height = Math.round(img.naturalHeight * sc);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    const blob = await new Promise((r) => c.toBlob(r, 'image/jpeg', 0.85));
    return { blob, url: URL.createObjectURL(blob) };
  } finally { URL.revokeObjectURL(url); }
};

/* ============================================================
   Green Room — storage
   Saved to the artifact's private database when available (owner-only
   rules), mirrored in this browser for fast start, with device-only
   fallback when the database isn't reachable.
   ============================================================ */
const Store = (() => {
  const LS_KEY = 'greenroom.v1';
  const COLS = ['sessions', 'logs', 'preps', 'reviews'];
  const LIMIT = { sessions: 600, logs: 300, preps: 100, reviews: 60 };
  const st = { mode: 'local', status: 'starting', note: '', profile: null, sessions: [], logs: [], preps: [], reviews: [] };
  const subs = new Set();
  let db = null;
  let cloudSeen = { profile: false };
  const emit = (what) => subs.forEach((f) => { try { f(what); } catch (e) { console.error(e); } });

  function defaultProfile() {
    return {
      name: 'Muddassir',
      role: 'Healthcare corporate development & investing leader, CFA',
      audiences: 'Investment committees, boards, health system executives, physician leaders, LPs, hiring panels',
      goal: 'Show up as a senior investing executive: clear, concise and calm under pressure.',
      focus: [...C.STARTER_FOCUS],
      ratings: {},
      evaluation: null,
      onboarded: false,
      lessonsRead: [],
      settings: { paceLo: 130, paceHi: 160, autoCoach: true, voice: true, thinkTime: 10, customFillers: [], weeklyGoalMin: 60 },
      createdAt: Date.now(),
    };
  }
  function mergeProfile(p) {
    const d = defaultProfile();
    const out = Object.assign({}, d, p || {});
    out.settings = Object.assign({}, d.settings, (p && p.settings) || {});
    if (!Array.isArray(out.focus)) out.focus = d.focus;
    if (!Array.isArray(out.lessonsRead)) out.lessonsRead = [];
    if (!out.ratings || typeof out.ratings !== 'object') out.ratings = {};
    return out;
  }

  function loadLocal() {
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (!raw) return;
      const d = JSON.parse(raw);
      if (d.profile) st.profile = mergeProfile(d.profile);
      for (const c of COLS) if (Array.isArray(d[c])) st[c] = d[c];
    } catch (e) { /* storage blocked or corrupt: start clean */ }
  }
  let saveTimer = null;
  function saveLocal() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      try {
        localStorage.setItem(LS_KEY, JSON.stringify({
          profile: st.profile,
          sessions: st.sessions.slice(0, 300), logs: st.logs.slice(0, 200), preps: st.preps.slice(0, 60), reviews: st.reviews.slice(0, 30),
        }));
      } catch (e) {
        try { // quota: keep the newest items only
          localStorage.setItem(LS_KEY, JSON.stringify({ profile: st.profile, sessions: st.sessions.slice(0, 80), logs: st.logs.slice(0, 60), preps: st.preps.slice(0, 20), reviews: st.reviews.slice(0, 10) }));
        } catch (e2) { /* give up quietly */ }
      }
    }, 250);
  }

  const clean = (o) => JSON.parse(JSON.stringify(o, (k, v) => (k === '_local' ? undefined : v)));
  const body = (item) => { const b = clean(item); delete b.id; delete b._local; return b; };
  const newId = () => Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7);
  const sortDesc = (arr) => arr.sort((a, b) => (b.ts || 0) - (a.ts || 0));

  // One write at a time per document; later writes to the same doc coalesce.
  const queues = new Map();
  function enqueue(path, fn) {
    const q = queues.get(path) || { running: false, next: null };
    queues.set(path, q);
    q.next = fn;
    if (q.running) return;
    const run = async () => {
      q.running = true;
      while (q.next) {
        const f = q.next; q.next = null;
        try { await f(); } catch (e) { handleWriteError(e); }
      }
      q.running = false;
    };
    run();
  }

  function handleWriteError(e) {
    const code = e && e.code;
    if (code === 'quota_exceeded') { st.note = 'Your saved space is full. Delete old sessions in Progress → History.'; emit('mode'); return; }
    if (code === 'unavailable' || code === 'resource_exhausted') { st.note = 'Saving is slow right now. Your work is kept on this device and will retry.'; emit('mode'); return; }
    // not permitted / revoked / disabled: keep working on this device
    st.mode = 'local'; st.status = 'device';
    st.note = 'Saving on this device only.';
    emit('mode');
  }

  function cloudWrite(col, item) {
    item._local = true; // kept through snapshots until the database confirms it
    if (st.mode !== 'cloud' || !db) return;
    const path = col + '/' + item.id;
    enqueue(path, async () => {
      await db.collection(col).doc(item.id).set(body(item));
      delete item._local;
    });
  }

  async function init() {
    loadLocal();
    if (!st.profile) st.profile = defaultProfile();
    emit('all');
    let cap = null;
    try { if (window.claude && typeof window.claude.use === 'function') cap = await window.claude.use('db'); } catch (e) { cap = null; }
    if (!cap) { st.mode = 'local'; st.status = 'device'; emit('mode'); return; }
    db = cap; st.mode = 'cloud'; st.status = 'syncing'; emit('mode');
    const timer = setTimeout(() => { if (st.status === 'syncing') { st.note = 'Can\'t reach your saved data yet. Showing what\'s on this device.'; emit('mode'); } }, 10000);
    const settle = () => { clearTimeout(timer); if (st.status === 'syncing') { st.status = 'cloud'; st.note = ''; emit('mode'); } };

    db.doc('app/profile').onSnapshot((snap) => {
      if (snap.exists) {
        st.profile = mergeProfile(snap.data());
        saveLocal(); emit('profile');
      } else if (!snap.metadata.fromCache && !cloudSeen.profile) {
        // First run in the cloud: keep whatever this device already has
        enqueue('app/profile', () => db.doc('app/profile').set(clean(st.profile)));
      }
      if (!snap.metadata.fromCache) { cloudSeen.profile = true; settle(); }
    }, (e) => { clearTimeout(timer); handleWriteError(e); });

    for (const c of COLS) {
      let first = true;
      db.collection(c).orderBy('ts', 'desc').limit(LIMIT[c]).onSnapshot((snap) => {
        const cloud = snap.docs.map((d) => Object.assign({}, d.data(), { id: d.id }));
        const ids = new Set(cloud.map((x) => x.id));
        const localOnly = st[c].filter((x) => x._local && !ids.has(x.id));
        st[c] = sortDesc(cloud.concat(localOnly));
        if (first && !snap.metadata.fromCache) {
          first = false;
          for (const item of localOnly) cloudWrite(c, item); // push work done before the database answered
        }
        if (!snap.metadata.fromCache) settle();
        saveLocal(); emit(c);
      }, (e) => { clearTimeout(timer); handleWriteError(e); });
    }
  }

  function put(col, item) {
    if (!item.id) item.id = newId();
    if (!item.ts) item.ts = Date.now();
    const arr = st[col];
    const i = arr.findIndex((x) => x.id === item.id);
    if (i >= 0) arr[i] = item; else arr.push(item);
    sortDesc(arr);
    saveLocal(); emit(col);
    cloudWrite(col, item);
    return item;
  }
  function remove(col, id) {
    st[col] = st[col].filter((x) => x.id !== id);
    saveLocal(); emit(col);
    if (st.mode === 'cloud' && db) enqueue(col + '/' + id, () => db.collection(col).doc(id).delete());
  }
  function saveProfile(patch) {
    st.profile = mergeProfile(Object.assign({}, st.profile, patch, { updatedAt: Date.now() }));
    if (patch && patch.settings) A.setCustomFillers(st.profile.settings.customFillers);
    saveLocal(); emit('profile');
    if (st.mode === 'cloud' && db) { const snap = clean(st.profile); enqueue('app/profile', () => db.doc('app/profile').set(snap)); }
  }
  function exportAll() {
    return { app: 'Green Room', version: 1, exportedAt: new Date().toISOString(), profile: clean(st.profile), sessions: st.sessions.map(clean), logs: st.logs.map(clean), preps: st.preps.map(clean), reviews: st.reviews.map(clean) };
  }
  function importAll(d) {
    if (!d || typeof d !== 'object' || (d.app && d.app !== 'Green Room')) throw new Error('That file isn\'t a Green Room backup.');
    let n = 0;
    if (d.profile) saveProfile(d.profile);
    for (const c of COLS) if (Array.isArray(d[c])) for (const item of d[c]) { if (item && item.ts) { put(c, Object.assign({}, item, { id: item.id || newId() })); n++; } }
    return n;
  }
  function resetAll() {
    for (const c of COLS) for (const item of [...st[c]]) remove(c, item.id);
    saveProfile(defaultProfile());
  }

  return {
    get mode() { return st.mode; }, get status() { return st.status; }, get note() { return st.note; },
    get profile() { return st.profile; }, get sessions() { return st.sessions; }, get logs() { return st.logs; },
    get preps() { return st.preps; }, get reviews() { return st.reviews; },
    init, put, remove, saveProfile, exportAll, importAll, resetAll, newId,
    on: (f) => { subs.add(f); return () => subs.delete(f); },
  };
})();

/* ============================================================
   Green Room — AI coach (Claude via the artifact's sample capability)
   ============================================================ */
const AI = (() => {
  let fn = null;
  let state = 'starting'; // starting | ready | off
  let imagesOk = false;
  const subs = new Set();
  const emit = () => subs.forEach((f) => { try { f(); } catch (e) { console.error(e); } });
  const PERMANENT = ['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'];

  async function init() {
    try {
      if (window.claude && typeof window.claude.use === 'function') fn = await window.claude.use('sample');
    } catch (e) { fn = null; }
    state = fn ? 'ready' : 'off';
    if (fn) { try { const lim = await fn.limits(); imagesOk = !!(lim && lim.images); } catch (e) { imagesOk = false; } }
    emit();
  }

  function fail(e) {
    if (e && PERMANENT.includes(e.code)) { state = 'off'; emit(); }
    throw e;
  }
  async function json(prompt, opts = {}) {
    if (!fn) throw { code: 'unavailable', message: 'Claude is not available here.' };
    try { return await fn.json(prompt, opts); } catch (e) { return fail(e); }
  }
  async function text(input, opts = {}) {
    if (!fn) throw { code: 'unavailable', message: 'Claude is not available here.' };
    try { return await fn(input, opts); } catch (e) { return fail(e); }
  }
  function errorText(e) {
    const c = e && e.code;
    if (c === 'cancelled') return '';
    if (c === 'not_granted') return 'The coach needs permission to use Claude. You can allow it from this page\'s Permissions menu.';
    if (c === 'sampling_disabled' || c === 'unavailable' || c === 'not_declared' || c === 'capability_disabled' || c === 'capability_removed') return 'The AI coach isn\'t available in this view. Your scores and notes still work.';
    if (c === 'rate_limited') return 'You\'ve hit a usage limit for now. Try again in a little while.';
    if (c === 'session_expired') return 'Your Claude session expired. Sign in again, then retry.';
    if (c === 'invalid_json') return 'The coach\'s answer came back garbled. Tap retry.';
    if (c === 'refused') return 'The coach couldn\'t respond to that. Try rephrasing.';
    if (c === 'prompt_too_large') return 'That\'s too long for one review. Try a shorter excerpt.';
    if (c === 'image_rejected' || c === 'images_unavailable') return 'That image couldn\'t be used. Try a different photo.';
    return 'The coach didn\'t answer. Check your connection and retry.';
  }

  /* ---------------- Prompt building blocks ---------------- */
  function who(p) {
    const focus = (p.focus || []).map((id) => C.skill(id)).filter(Boolean)
      .map((s) => `- ${s.name}${p.ratings && p.ratings[s.id] ? ` (self-rated ${p.ratings[s.id]}/5)` : ''}: ${s.good}`).join('\n');
    let ev = '';
    if (p.evaluation && p.evaluation.summary) {
      ev = `\nFrom their executive presence evaluation: ${p.evaluation.summary}`;
      if (p.evaluation.areas && p.evaluation.areas.length) ev += '\nDevelopment areas named in it: ' + p.evaluation.areas.map((a) => `${(C.skill(a.skill) || {}).name || a.skill}${a.evidence ? ` ("${a.evidence}")` : ''}`).join('; ');
    }
    return `ABOUT THE PERSON YOU COACH
Name: ${p.name || 'the client'}. Role: ${p.role || 'senior leader'}.
Usual audiences: ${p.audiences || 'senior executives'}.
Their goal: ${p.goal || 'stronger executive presence'}.
Current development focus:
${focus || '- General executive presence'}${ev}`;
  }

  const COACH_VOICE = `You are an elite executive-presence and speech coach who has prepared CEOs for boards, investor days and hostile Q&A. You are direct, specific and warm. You quote the person's exact words when you point out an issue, and you always show the better version. One high-leverage fix beats five small ones. No filler, no generic advice, no praise that isn't earned.`;

  const SCALE = `Score calibration (0-100): 90+ would impress a Fortune 500 board; 80 is a strong VP; 70 is a solid senior manager; 60 is competent but forgettable; below 50 undermines credibility.`;

  function metricsBlock(m) {
    if (!m) return 'No measurements.';
    const L = [];
    L.push(`Words: ${m.words}${m.durationSec ? `; duration ${Math.round(m.durationSec)}s` : ''}${m.wpm ? `; pace ${m.wpm} wpm` : ''}`);
    L.push(`Fillers: ${m.fillers}${m.fillerTypes && m.fillerTypes.length ? ' (' + m.fillerTypes.map((x) => `${x.label} ×${x.n}`).join(', ') + ')' : ''}`);
    L.push(`Hedges: ${m.hedges}${m.hedgeTypes && m.hedgeTypes.length ? ' (' + m.hedgeTypes.map((x) => `${x.label} ×${x.n}`).join(', ') + ')' : ''}`);
    L.push(`Answer-first check on the opening sentence: ${m.bluf === true ? 'looks like it leads with the answer' : m.bluf === false ? 'opens with set-up rather than the answer' : 'unclear'}`);
    L.push(`Numbers used: ${m.numbers}; average sentence length: ${m.avgSentence} words${m.weakEnd ? `; weak ending: "${m.weakEnd}"` : ''}`);
    return L.join('\n');
  }
  function audioBlock(a) {
    if (!a || !a.ok) return '';
    return `Acoustic measurements from the recording:
- Speaking span ${a.activeSpan}s; estimated pace ${a.estWpm || 'n/a'} wpm
- Pauses: ${a.pauses.deliberate} deliberate (0.6–2s), ${a.pauses.long} long gaps (2s+), ${a.pauses.deliberatePerMin}/min
- Pitch range ${a.pitch.rangeSt ?? 'n/a'} semitones (under 4 sounds flat; 6+ is expressive)
- Rising endings on ${a.upspeak.pct ?? 'n/a'}% of phrases (upspeak; under 15% is good)
- Volume trails off at the end of ${a.volume.trailOffPct}% of phrases`;
  }
  function captureNote(source) {
    if (source === 'dictation') return 'Captured with phone dictation: dictation usually deletes "um" and "uh", so filler counts are a floor, not the truth. Pace is approximate.';
    if (source === 'typed') return 'This answer was typed, not spoken: do not judge vocal delivery. Set delivery to null.';
    if (source === 'mic') return 'Captured live from the microphone with speech recognition; the transcript may have small recognition errors and no punctuation. Don\'t penalize recognition mistakes.';
    if (source === 'upload') return 'Captured from an uploaded recording. The transcript (if any) was pasted by the user.';
    return '';
  }

  /* ---------------- Rep feedback ---------------- */
  function feedbackPrompt(p, spec, rec) {
    const skills = C.SKILLS.map((s) => s.id).join(', ');
    return `${COACH_VOICE}

${who(p)}

THE REP
Exercise: ${spec.title}
Audience: ${spec.audience || 'senior executives'}
Situation: ${spec.situation || '—'}
Task: ${spec.prompt}
Time limit: ${spec.time ? spec.time + ' seconds' : 'none'}
Success criteria:
${(spec.criteria || []).map((c) => '- ' + c).join('\n') || '- Clear, concise, confident'}
${rec.attempt > 1 ? `This is attempt ${rec.attempt}. Previous attempt scored ${rec.prevScore ?? 'n/a'}. Comment briefly on what improved or didn't.` : ''}

HOW IT WAS CAPTURED
${captureNote(rec.source)}

MEASUREMENTS
${metricsBlock(rec.metrics)}
${audioBlock(rec.audio)}
${rec.hasImages ? 'Also attached: still frames from their video. Include one note on body language, eye line, framing or setting in "fixes" or "strengths" if it matters.' : ''}

TRANSCRIPT
"""
${String(rec.transcript || '').slice(0, 12000)}
"""

${SCALE}

Reply with only a JSON object in exactly this shape:
{
  "headline": "one-sentence verdict, max 18 words",
  "scores": {"clarity": 0-100, "concision": 0-100, "confidence": 0-100, "delivery": 0-100 or null, "impact": 0-100, "composure": 0-100 or null},
  "criteria": [{"criterion": "copy each success criterion", "met": "yes" | "partly" | "no"}],
  "strengths": ["max 2 specific strengths, each max 20 words"],
  "fixes": [{"issue": "2-5 word label", "quote": "their exact words, or empty", "why": "max 20 words", "try": "the exact words or behavior to use instead"}],
  "rewrite": "an executive version of their answer: same facts (invent nothing beyond light placeholders like [X]), answer first, about 60% of the words, written to be spoken in their voice",
  "next_rep": "one specific instruction for the immediate retry, max 25 words",
  "skills": [{"id": "one of: ${skills}", "rating": 1-5}]
}
Rules: max 3 fixes, ordered by impact. Composure is null unless the task involves pressure, pushback or a hard question. "skills" lists only skills clearly shown in this rep (max 5).`;
  }

  /* ---------------- Sparring ---------------- */
  function sparRules(p, persona, ctx, difficulty, rounds) {
    return `ROLE-PLAY FOR SPEAKING PRACTICE. Stay in character for the whole conversation.

You are ${persona.name}, ${persona.role}. Style: ${persona.style}
The person you're speaking with: ${p.name || 'the candidate'}, ${p.role || 'a senior leader'}.
Scenario: ${ctx}
Difficulty: ${C.DIFFICULTY[difficulty] || C.DIFFICULTY.tough}

Rules:
- Speak as you would out loud in the room: one turn at a time, max 45 words, no stage directions, no lists, no markdown.
- Ask exactly one question per turn. React to their last answer first in a few words when it's natural ("That's a big claim." / "Fine." / "Let me stop you there.").
- If an answer is vague, long or dodges the question, press on it the way a real ${persona.role} would: ask for the number, the decision, or the risk.
- Build on what they actually said; don't run through a script.
- There will be ${rounds} questions in total. On the final turn, after their last answer, give a one-sentence in-character reaction and end with the exact token [END].
- Their answers are transcribed speech: ignore small transcription errors.`;
  }
  function sparTurns(rules, convo, isLast) {
    const turns = [{ role: 'user', content: rules + '\n\nBegin now with your opening line and first question.' }];
    for (const t of convo) turns.push({ role: t.role === 'me' ? 'user' : 'assistant', content: t.content || '…' });
    if (isLast) turns[turns.length - 1] = { role: 'user', content: turns[turns.length - 1].content + '\n\n(That was the final answer. React in character in one sentence, then end with [END].)' };
    return turns;
  }
  function debriefPrompt(p, persona, ctx, convo) {
    const transcript = convo.map((t) => `${t.role === 'me' ? (p.name || 'Candidate') : persona.name}: ${t.content}${t.role === 'me' && t.metrics ? `   [${t.metrics.secs ? t.metrics.secs + 's, ' : ''}${t.metrics.words} words, ${t.metrics.fillers} fillers, ${t.metrics.hedges} hedges]` : ''}`).join('\n');
    return `${COACH_VOICE}

${who(p)}

They just finished a role-play with "${persona.name}" (${persona.role}). Scenario: ${ctx}
Answers were spoken and transcribed (or typed); bracketed numbers are measurements of each answer.

CONVERSATION
${transcript.slice(0, 30000)}

${SCALE}

Debrief them. Reply with only a JSON object in exactly this shape:
{
  "headline": "one-sentence verdict, max 18 words",
  "scores": {"clarity": 0-100, "concision": 0-100, "confidence": 0-100, "delivery": 0-100 or null, "impact": 0-100, "composure": 0-100},
  "moments": [{"question": "the question, shortened", "verdict": "strong" | "ok" | "weak", "note": "max 20 words on what worked or didn't", "better": "for ok/weak answers: a stronger answer in max 45 words, in their voice; empty for strong"}],
  "strengths": ["max 2"],
  "patterns": ["max 2 patterns across answers, e.g. 'Buries the number at the end'"],
  "next_focus": "the one thing to practice next, max 25 words",
  "skills": [{"id": "skill id from: ${C.SKILLS.map((s) => s.id).join(', ')}", "rating": 1-5}]
}
One "moments" entry per question asked. Set delivery to null if the answers were typed.`;
  }

  /* ---------------- Evaluation import ---------------- */
  function evaluationPrompt(p, textIn) {
    return `You are an executive coach reading a client's executive presence evaluation (it may be a 360 report, a coach's assessment, performance review notes or self-reflection).

Client: ${p.name || 'the client'}, ${p.role || ''}.

Map what it says onto this skills framework (use these ids exactly):
${C.SKILLS.map((s) => `- ${s.id}: ${s.name} (${s.good})`).join('\n')}

EVALUATION TEXT
"""
${String(textIn).slice(0, 60000)}
"""

Reply with only a JSON object in exactly this shape:
{
  "summary": "two sentences: how they come across today and the single biggest unlock",
  "strengths": ["up to 5 strengths named or clearly implied, max 15 words each"],
  "areas": [{"skill": "skill id", "priority": 1 | 2 | 3, "evidence": "short quote or paraphrase from the evaluation", "target": "what good looks like for them, max 20 words"}],
  "ratings": {"skill id": 1-5},
  "behaviors": ["3 signature behaviors to adopt, each an observable habit, max 15 words"],
  "plan": [{"week": 1, "theme": "max 5 words", "commitments": ["3 specific practice commitments for that week"]}]
}
Rules: 3-6 areas, priority 1 = most important. Rate only skills the evaluation gives evidence for. Plan has exactly 4 weeks that build on each other. Use only what the text supports; don't invent feedback.`;
  }

  /* ---------------- Meeting prep ---------------- */
  function prepPrompt(p, f) {
    return `${COACH_VOICE}

/* ---------------- Gauge (VU meter) ---------------- */
function gauge(score, opts = {}) {
  const cx = 120, cy = 116, R = 96, a0 = -58, a1 = 58;
  const ang = (v) => a0 + ((a1 - a0) * A.clamp(v, 0, 100)) / 100;
  const pt = (deg, r) => [cx + r * Math.sin((deg * Math.PI) / 180), cy - r * Math.cos((deg * Math.PI) / 180)];
  const arc = (v0, v1, r) => { const [x0, y0] = pt(ang(v0), r), [x1, y1] = pt(ang(v1), r); return `M${x0.toFixed(1)} ${y0.toFixed(1)} A${r} ${r} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`; };
  let ticks = '';
  for (let v = 0; v <= 100; v += 5) {
    const major = v % 20 === 0;
    const [x0, y0] = pt(ang(v), R - (major ? 12 : 7)), [x1, y1] = pt(ang(v), R);
    ticks += `<line class="tick${major ? ' major' : ''}" x1="${x0.toFixed(1)}" y1="${y0.toFixed(1)}" x2="${x1.toFixed(1)}" y2="${y1.toFixed(1)}" stroke-width="${major ? 1.6 : 1}"/>`;
    if (major) { const [lx, ly] = pt(ang(v), R + 11); ticks += `<text class="lbl" x="${lx.toFixed(1)}" y="${(ly + 3).toFixed(1)}" text-anchor="middle">${v}</text>`; }
  }
  const has = score != null && !isNaN(score);
  const target = has ? ang(score) : a0;
  const start = opts.animate === false ? target : a0;
  const id = 'g' + Math.random().toString(36).slice(2, 8);
  return `<svg class="gauge ${opts.dark ? 'on-deep' : ''}" viewBox="0 0 240 178" role="img" aria-label="${esc(opts.label || 'Presence score')}: ${has ? Math.round(score) : 'no score yet'}">
    <path class="arc" d="${arc(0, 100, R)}"/>
    <path class="zone-mid" d="${arc(60, 80, R + 2.5)}"/>
    <path class="zone-good" d="${arc(80, 100, R + 2.5)}"/>
    ${ticks}
    <g class="needle-g" id="${id}" data-target="${target}" style="transform: rotate(${start}deg); transform-origin: ${cx}px ${cy}px;">
      <line class="needle" x1="${cx}" y1="${cy + 8}" x2="${cx}" y2="${cy - R + 4}"/>
    </g>
    <circle class="pivot" cx="${cx}" cy="${cy}" r="5"/>
    <text class="score${has ? '' : ' empty'}" x="${cx}" y="${cy + (has ? 44 : 36)}" text-anchor="middle">${has ? Math.round(score) : 'No score yet'}</text>
    <text class="cap" x="${cx}" y="${cy + 59}" text-anchor="middle">${esc((opts.label || 'PRESENCE SCORE').toUpperCase())}</text>
  </svg>`;
}
function animateGauges(root = document) {
  requestAnimationFrame(() => requestAnimationFrame(() => {
    $$('.needle-g[data-target]', root).forEach((g) => { g.style.transform = `rotate(${g.dataset.target}deg)`; g.removeAttribute('data-target'); });
  }));
}

/* ---------------- Charts ---------------- */
function lineChart(values, opts = {}) {
  const W = opts.w || 340, H = opts.h || 150, padL = 28, padR = 34, padT = 12, padB = 20;
  const vals = values.map((v) => (v == null ? null : Number(v)));
  const pts = vals.map((v, i) => [i, v]).filter(([, v]) => v != null);
  if (pts.length < 2) return '';
  let min = opts.min != null ? opts.min : Math.min(...pts.map((p) => p[1]));
  let max = opts.max != null ? opts.max : Math.max(...pts.map((p) => p[1]));
  if (opts.band) { min = Math.min(min, opts.band[0] - 10); max = Math.max(max, opts.band[1] + 10); }
  if (max - min < 1) { max += 1; min -= 1; }
  const n = vals.length;
  const x = (i) => padL + ((W - padL - padR) * i) / Math.max(1, n - 1);
  const y = (v) => padT + (H - padT - padB) * (1 - (v - min) / (max - min));
  const ticks = opts.ticks || [min, (min + max) / 2, max].map((t) => Math.round(t));
  let g = '<g class="grid">' + ticks.map((t) => `<line x1="${padL}" x2="${W - padR}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}"/>`).join('') + '</g>';
  g += ticks.map((t) => `<text class="axis" x="${padL - 6}" y="${(y(t) + 3).toFixed(1)}" text-anchor="end">${t}</text>`).join('');
  if (opts.band) g += `<rect class="band" x="${padL}" width="${W - padL - padR}" y="${y(opts.band[1]).toFixed(1)}" height="${(y(opts.band[0]) - y(opts.band[1])).toFixed(1)}"/>`;
  const d = pts.map(([i, v], k) => `${k ? 'L' : 'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');
  if (opts.area !== false) g += `<path class="area" d="${d} L${x(pts[pts.length - 1][0]).toFixed(1)} ${H - padB} L${x(pts[0][0]).toFixed(1)} ${H - padB} Z"/>`;
  g += `<path class="line" d="${d}"/>`;
  if (opts.avg && pts.length >= 4) {
    const k = opts.avg; const ma = [];
    for (let j = 0; j < pts.length; j++) { const w = pts.slice(Math.max(0, j - k + 1), j + 1).map((p) => p[1]); ma.push([pts[j][0], w.reduce((a, b) => a + b, 0) / w.length]); }
    g += `<path class="line avg" d="${ma.map(([i, v], j) => `${j ? 'L' : 'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ')}"/>`;
  }
  if (pts.length <= 40) g += pts.slice(0, -1).map(([i, v]) => `<circle class="dot" cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="2"/>`).join('');
  const [li, lv] = pts[pts.length - 1];
  g += `<circle class="dot end" cx="${x(li).toFixed(1)}" cy="${y(lv).toFixed(1)}" r="4.5"/>`;
  g += `<text class="endlbl" x="${(x(li) + 8).toFixed(1)}" y="${(y(lv) + 4).toFixed(1)}">${esc(opts.fmt ? opts.fmt(lv) : Math.round(lv))}</text>`;
  if (opts.xlabels) g += `<text class="axis" x="${padL}" y="${H - 4}">${esc(opts.xlabels[0])}</text><text class="axis" x="${W - padR}" y="${H - 4}" text-anchor="end">${esc(opts.xlabels[1])}</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label || 'Trend chart')}">${g}</svg>`;
}

function radarChart(now, then, dims) {
  const W = 320, H = 250, cx = 160, cy = 126, R = 82;
  const n = dims.length;
  const p = (i, r) => { const a = (-90 + (360 / n) * i) * Math.PI / 180; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; };
  let g = '';
  for (const lv of [0.25, 0.5, 0.75, 1]) g += `<polygon class="radar-grid" points="${dims.map((_, i) => p(i, R * lv).map((v) => v.toFixed(1)).join(',')).join(' ')}"/>`;
  dims.forEach((_, i) => { const [x, y] = p(i, R); g += `<line class="radar-grid" x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--line)"/>`; });
  const poly = (vals, cls) => `<polygon class="${cls}" points="${dims.map((dm, i) => p(i, R * A.clamp((vals[dm.id] || 0) / 100, 0, 1)).map((v) => v.toFixed(1)).join(',')).join(' ')}"/>`;
  if (then) g += poly(then, 'radar-then');
  g += poly(now, 'radar-now');
  dims.forEach((dm, i) => {
    const [x, y] = p(i, R + 20);
    const anchor = Math.abs(x - cx) < 10 ? 'middle' : x > cx ? 'start' : 'end';
    const yy = y < cy - R ? y - 2 : y;
    g += `<text class="radar-lbl" x="${x.toFixed(1)}" y="${yy.toFixed(1)}" text-anchor="${anchor}">${esc(dm.name.replace('Executive ', ''))}</text>`;
    g += `<text class="radar-val" x="${x.toFixed(1)}" y="${(yy + 12).toFixed(1)}" text-anchor="${anchor}">${now[dm.id] != null ? Math.round(now[dm.id]) : '—'}</text>`;
  });

function waveSvg(wave) {
