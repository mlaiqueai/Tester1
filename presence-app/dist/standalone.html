  }

  let sentences = A.sentences(text);
  const punctuated = /[.!?]/.test(text);
  if (!punctuated && n > 25) {
    sentences = [];
    for (let i = 0; i < n; i += 16) sentences.push(words.slice(i, i + 16).join(' '));
  }
  const sentLens = sentences.map((s) => A.wordList(s).length).filter((x) => x > 0);
  const avgSentence = sentLens.length ? mean(sentLens) : n;
  const longSentences = sentLens.filter((x) => x > 30).length;

  const first = sentences[0] ? A.wordList(sentences[0]).slice(0, 30).join(' ') : words.slice(0, 30).join(' ');
  let bluf = 'unclear';
  if (n >= 8) {
    if (BLUF_NEG.test(first)) bluf = false;
    else if (BLUF_POS.test(first)) bluf = true;
    else if (/^(?:so|well|um|uh|okay|ok)\b/i.test(first) || A.wordList(sentences[0] || '').length > 35) bluf = false;
  }
  const signposts = (text.match(SIGNPOSTS) || []).length;
  const impactWords = (text.match(IMPACT) || []).length;
  const numbers = (text.match(NUMBERS) || []).filter((x) => /\d|percent|million|billion|thousand|times|basis/i.test(x)).length;
  const lastSentence = sentences[sentences.length - 1] || '';
  const weakEnd = n >= 15 && WEAK_END.test(lastSentence.trim()) ? (lastSentence.match(WEAK_END) || [''])[0].replace(/\W+$/, '').trim() : null;
  const asks = powerHits.filter((h) => h.label === 'ask' || h.label === 'recommend' || h.label === 'propose').length;
  const apologies = hedgeHits.filter((h) => h.label === 'sorry').length;
  const iCount = (text.match(/\bI\b|\bI'm\b|\bI've\b|\bI'll\b|\bmy\b/g) || []).length;
  const weCount = (text.match(/\bwe\b|\bwe're\b|\bwe've\b|\bwe'll\b|\bour\b/gi) || []).length;

  const lower = words.map((w) => w.toLowerCase().replace(/[^a-z0-9']/g, '')).filter(Boolean);
  const uniq = new Set(lower).size;
  const tri = {};
  for (let i = 0; i + 2 < lower.length; i++) {
    const k = lower.slice(i, i + 3).join(' ');
    if (/^(?:um|uh|you know|i mean)/.test(k)) continue;
    tri[k] = (tri[k] || 0) + 1;
  }
  const repeats = Object.entries(tri).filter(([, c]) => c >= 3).map(([k, c]) => ({ phrase: k, n: c })).slice(0, 5);
  const syl = words.reduce((s, w) => s + syllables(w), 0);
  const flesch = n ? A.round(206.835 - 1.015 * (n / Math.max(1, sentLens.length)) - 84.6 * (syl / n)) : null;

  const wpm = minutes && durationSec >= 8 ? A.round(n / minutes) : null;
  const tail = sentences.length >= 3 ? sentences.slice(-2).join(' ') : words.slice(Math.floor(n * 0.55)).join(' ');
  const tooMany = MANY_POINTS.test(text);
  const execPhrases = (typeof C !== 'undefined' && C.EXEC_PHRASES ? C.EXEC_PHRASES : []).filter((p) => p.re.test(text)).map((p) => p.id);
  const weakPhrases = (typeof C !== 'undefined' && C.WEAK_PHRASES ? C.WEAK_PHRASES : []).filter((p) => p.re.test(text)).map((p) => p.say);
  const hsia = {
    headline: bluf === true,
    structure: !tooMany && (signposts >= 1 || execPhrases.includes('two')),
    implication: IMPLIC.test(text),
    action: n >= 8 && ACTION.test(tail),
  };
  return {
    v: 2, hsia, tooMany, execPhrases, weakPhrases,
    recommends: recommends(text), changeMind: CHANGE_MIND.test(text), tradeoff: TRADEOFF.test(text), ownership: OWNERSHIP.test(text), framingPhrase: FRAMING.test(text),
    text, words: n, durationSec, wpm, spoken, source: opts.source || 'typed',
    fillers: { total: fillerHits.length, byType: countBy(fillerHits), perMin: minutes ? A.round(fillerHits.length / minutes, 1) : null, per100: n ? A.round((fillerHits.length / n) * 100, 1) : 0 },
    hedges: { total: hedgeHits.length, byType: countBy(hedgeHits), per100: n ? A.round((hedgeHits.length / n) * 100, 1) : 0 },
    power: { total: powerHits.length, byType: countBy(powerHits) },
    sentences: sentLens.length, avgSentence: A.round(avgSentence, 1), longSentences, punctuated,
    bluf, firstSentence: sentences[0] || '', signposts, impactWords, numbers, weakEnd, asks, apologies,
    iCount, weCount, vocab: n ? A.round(uniq / n, 2) : 0, repeats, flesch,
    hits: fillerHits.concat(hedgeHits, powerHits),
  };
};

/** Turn transcript + hits into highlighted HTML. */
A.highlight = function (ta) {
  const text = ta.text;
  const prio = { filler: 3, hedge: 2, power: 1 };
  const hits = [...ta.hits].sort((a, b) => a.start - b.start || prio[b.kind] - prio[a.kind]);
  const kept = [];
  let lastEnd = -1;
  for (const h of hits) {
    if (h.start >= lastEnd) { kept.push(h); lastEnd = h.end; }
    else if (kept.length && prio[h.kind] > prio[kept[kept.length - 1].kind] && h.start === kept[kept.length - 1].start) { kept[kept.length - 1] = h; lastEnd = h.end; }
  }
  let out = '', pos = 0;
  for (const h of kept) {
    out += esc(text.slice(pos, h.start));
    out += `<mark class="hl hl-${h.kind}" title="${esc(h.label)}">${esc(text.slice(h.start, h.end))}</mark>`;
    pos = h.end;
  }
  out += esc(text.slice(pos));
  return out;
};

/**
 * Score a rep on the plan's dimensions (0-100 internally, shown /10).
 * ta = text analysis (may be null), au = audio analysis (may be null).
 * opts: { paceLo, paceHi, timeLimit }
 */
A.score = function (ta, au, opts = {}) {
  const lo = opts.paceLo || 130, hi = opts.paceHi || 160;
  const s = {};
  const notes = [];
  const n = ta ? ta.words : 0;
  const cl = (v) => Math.round(A.clamp(v, 20, 100));

  // Executive confidence: how it sounds (pace, fillers, pauses, pitch, rising endings)
  const del = [];
  let wpm = ta && ta.wpm;
  if (!wpm && au && au.estWpm) wpm = au.estWpm;
  if (wpm) { const d = wpm < lo ? lo - wpm : wpm > hi ? wpm - hi : 0; del.push([A.clamp(100 - d * 1.6, 30, 100), 0.3]); }
  if (ta && n >= 10) {
    const perMin = ta.fillers.perMin != null ? ta.fillers.perMin : ta.fillers.per100 * 1.45;
    del.push([A.clamp(100 - Math.max(0, perMin - 1) * 14, 20, 100), 0.35]);
    if (ta.weakEnd) del.push([60, 0.1]);
  }
  if (au && au.ok) {
    const dp = au.pauses.deliberatePerMin;
    del.push([A.clamp(dp < 3 ? 100 - (3 - dp) * 15 : dp > 14 ? 100 - (dp - 14) * 6 : 100, 40, 100), 0.12]);
    const range = au.pitch.rangeSt;
    if (range != null) del.push([range >= 6 ? 100 : range >= 3 ? 60 + (range - 3) * 13 : 40 + range * 7, 0.13]);
    if (au.upspeak.pct != null) del.push([au.upspeak.pct <= 15 ? 100 : A.clamp(100 - (au.upspeak.pct - 15) * 1.6, 40, 100), 0.1]);
  }
  if (del.length && ta && ta.source !== 'typed' || del.length && !ta) { const w = del.reduce((a, [, x]) => a + x, 0); s.confidence = Math.round(del.reduce((a, [v, x]) => a + v * x, 0) / w); }

  if (ta && n >= 10) {
    const h = ta.hsia;
    s.assertive = cl(100 - ta.hedges.per100 * 9 - ta.apologies * 8 - (ta.weakEnd ? 10 : 0) - ta.weakPhrases.length * 6 + Math.min(10, ta.power.total * 3) + (ta.ownership ? 4 : 0));
    let c = 56 + (ta.bluf === true ? 24 : ta.bluf === 'unclear' ? 6 : -12) + Math.min(10, ta.signposts * 5) + (h.structure ? 4 : 0);
    c += ta.avgSentence <= 18 ? 6 : ta.avgSentence <= 24 ? 2 : ta.avgSentence > 30 ? -10 : -4;
    s.clarity = cl(c);
    let co = 100 - Math.max(0, ta.avgSentence - 18) * 2.5 - ta.longSentences * 4 - ta.repeats.length * 5 - (ta.tooMany ? 8 : 0)
      - ((ta.fillers.total + ta.hedges.total) / Math.max(1, n)) * 100 * 1.5;
    if (opts.timeLimit && ta.durationSec && ta.durationSec > opts.timeLimit * 1.15) co -= ((ta.durationSec / opts.timeLimit) - 1) * 40;
    s.concision = cl(co);
    s.framing = cl(48 + (h.implication ? 16 : 0) + Math.min(14, ta.numbers * 5) + Math.min(10, ta.impactWords * 2) + (ta.framingPhrase ? 10 : 0) + (ta.bluf === true ? 4 : 0));
    s.decision = cl(42 + (ta.recommends ? 20 : 0) + (h.action ? 16 : 0) + (ta.changeMind ? 10 : 0) + (ta.tradeoff ? 8 : 0) + (ta.ownership ? 6 : 0) - (ta.bluf === false ? 6 : 0));
  }
  const keys = ['framing', 'clarity', 'concision', 'assertive', 'confidence', 'decision'];
  const vals = keys.map((k) => s[k]).filter((v) => v != null);
  s.overall = vals.length ? Math.round(mean(vals)) : null;

  // Coaching notes, tied to development areas A-E
  if (ta && n >= 10) {
    const h = ta.hsia;
    if (ta.bluf === false) notes.push({ w: 10, area: 'A', dim: 'clarity', text: 'You built up to the point. Start with the conclusion: "My recommendation is…"' });
    if (!ta.recommends && n > 45) notes.push({ w: 8, area: 'C', dim: 'decision', text: 'Analysis without a verdict. State what you recommend and what would change your mind.' });
    if (ta.weakPhrases.length) notes.push({ w: 8, area: 'D', dim: 'assertive', text: `You said "${ta.weakPhrases[0].replace('…', '')}". Swap it for an executive phrase from your arsenal.` });
    if (ta.hedges.total >= 2) notes.push({ w: 7 + Math.min(3, ta.hedges.total / 3), area: 'D', dim: 'assertive', text: `${ta.hedges.total} hedges (${ta.hedges.byType.slice(0, 3).map((x) => `"${x.label}"`).join(', ')}). Speak with measured conviction.` });
    if (ta.tooMany) notes.push({ w: 7, area: 'B', dim: 'concision', text: 'More than three points. Keep the three that change the decision.' });
    if (!h.action && n > 40) notes.push({ w: 7, area: 'E', dim: 'decision', text: 'No explicit next action. Close with the decision or next step, an owner and a date.' });
    if (!h.implication && n > 50) notes.push({ w: 6, area: 'A', dim: 'framing', text: 'No implication. Say why it matters: "The strategic implication is…"' });
    if (!h.structure && n > 60) notes.push({ w: 5, area: 'B', dim: 'clarity', text: 'No structure signposted. Preview it: "There are two considerations here."' });
    if (ta.fillers.total >= 3) notes.push({ w: 6 + Math.min(3, ta.fillers.total / 4), area: 'D', dim: 'confidence', text: `${ta.fillers.total} fillers (${ta.fillers.byType.slice(0, 2).map((x) => `"${x.label}" ×${x.n}`).join(', ')}). Swap each for a silent beat.` });
    if (ta.avgSentence > 24 && ta.punctuated) notes.push({ w: 6, area: 'B', dim: 'concision', text: `Sentences average ${Math.round(ta.avgSentence)} words. Aim for under 20.` });
    if (ta.repeats.length) notes.push({ w: 4, area: 'B', dim: 'concision', text: `Repeated phrase: "${ta.repeats[0].phrase}". Say it once, then stop.` });
    if (ta.numbers === 0 && n > 50) notes.push({ w: 4, area: 'A', dim: 'framing', text: 'No numbers. One specific figure makes the judgment credible.' });
    if (ta.weakEnd) notes.push({ w: 5, area: 'D', dim: 'assertive', text: `You ended on "${ta.weakEnd}". End on the recommendation or the action, then stop.` });
  }
  if (wpm) {
    if (wpm > hi + 5) notes.push({ w: 6 + Math.min(3, (wpm - hi) / 15), area: 'D', dim: 'confidence', text: `${Math.round(wpm)} words a minute is above your ${lo}–${hi} band. Speak deliberately.` });
    else if (wpm < lo - 15) notes.push({ w: 3, area: 'D', dim: 'confidence', text: `${Math.round(wpm)} words a minute is slow. Move through context; slow down for the point.` });
  }
  if (au && au.ok) {
    if (au.upspeak.pct != null && au.upspeak.pct > 25 && au.upspeak.segments >= 4) notes.push({ w: 6, area: 'D', dim: 'confidence', text: `About ${Math.round(au.upspeak.pct)}% of your phrases ended on a rising pitch. Land statements down.` });
    if (au.pitch.rangeSt != null && au.pitch.rangeSt < 4) notes.push({ w: 4, area: 'D', dim: 'confidence', text: `Narrow pitch range (${au.pitch.rangeSt} semitones). Lift for contrast, drop for conclusions.` });
    if (au.pauses.deliberatePerMin < 2 && au.activeSpan > 30) notes.push({ w: 4, area: 'D', dim: 'confidence', text: 'Few deliberate pauses. Pause before and after your headline.' });
  }
  if (opts.timeLimit && ta && ta.durationSec && ta.durationSec > opts.timeLimit * 1.15) notes.push({ w: 6, area: 'B', dim: 'concision', text: `You ran ${Math.round(ta.durationSec - opts.timeLimit)}s over the ${opts.timeLimit}s limit.` });
  notes.sort((a, b) => b.w - a.w);
  if (!notes.length && n >= 20) notes.push({ w: 1, area: 'B', dim: 'concision', text: 'Clean rep. Now say it 20% shorter with the same punch.' });
  s.notes = notes.slice(0, 4).map((x) => ({ area: x.area, dim: x.dim, text: x.text }));
  s.wpm = wpm ? Math.round(wpm) : null;
  return s;
};

/* Map scores saved before the plan dimensions existed */
A.normScores = function (sc) {
  if (!sc || sc.v === 2 || sc.framing != null || sc.assertive != null || sc.decision != null) return sc || {};
  const out = { clarity: sc.clarity, concision: sc.concision, assertive: sc.confidence, confidence: sc.delivery, framing: sc.impact };
  const v = Object.values(out).filter((x) => x != null);
  out.overall = sc.overall != null ? sc.overall : v.length ? Math.round(mean(v)) : null;
  return out;
};

/* ------------------------------------------------------------
   Audio
   ------------------------------------------------------------ */
A.decodeFile = async function (fileOrBlob) {
  const buf = await fileOrBlob.arrayBuffer();
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) throw new Error('This browser can\'t decode audio.');
  const ctx = new AC();
  try {
    const audio = await new Promise((resolve, reject) => {
      const p = ctx.decodeAudioData(buf, resolve, reject);
      if (p && typeof p.then === 'function') p.then(resolve, reject);
    });
    return audio;
  } finally {
    try { const p = ctx.close && ctx.close(); if (p && p.catch) p.catch(() => {}); } catch (e) { /* ignore */ }
  }
};

A.toMono = function (audioBuffer, target = 16000, maxSec = 600) {
  const sr = audioBuffer.sampleRate;
  const ch = audioBuffer.numberOfChannels;
  const len = Math.min(audioBuffer.length, Math.floor(sr * maxSec));
  const ratio = sr / target;
  const outLen = Math.floor(len / ratio);
  const out = new Float32Array(outLen);
  const chans = [];
  for (let i = 0; i < ch; i++) chans.push(audioBuffer.getChannelData(i));
  for (let i = 0; i < outLen; i++) {
    const a = Math.floor(i * ratio), b = Math.min(len, Math.max(a + 1, Math.floor((i + 1) * ratio)));
    let sum = 0;
    for (let j = a; j < b; j++) for (let c = 0; c < ch; c++) sum += chans[c][j];
    out[i] = sum / ((b - a) * ch);
  }
  return { data: out, sr: target, duration: audioBuffer.duration };
};

const tick = () => new Promise((r) => setTimeout(r, 0));

/** Full acoustic analysis on mono 16 kHz samples. */
A.analyzeAudio = async function ({ data, sr, duration }, onProgress) {
  const hop = Math.round(sr * 0.01), win = Math.round(sr * 0.025);
  const nF = Math.max(0, Math.floor((data.length - win) / hop) + 1);
  if (nF < 50) return { ok: false, reason: 'Recording is too short to analyze.' };
  const db = new Float32Array(nF);
  for (let f = 0; f < nF; f++) {
    let s = 0; const o = f * hop;
    for (let j = 0; j < win; j++) { const v = data[o + j]; s += v * v; }
    db[f] = 10 * Math.log10(s / win + 1e-10);
  }
  const sorted = Array.from(db).sort((a, b) => a - b);
  const floor = pct(sorted, 0.1), peak = pct(sorted, 0.97);
  if (peak - floor < 10) return { ok: false, reason: 'Couldn\'t find clear speech in this recording. Try a quieter room or hold the phone closer.' };
  const thr = Math.max(floor + 8, floor + 0.32 * (peak - floor));
  let sp = new Uint8Array(nF);
  for (let f = 0; f < nF; f++) sp[f] = db[f] > thr ? 1 : 0;
  // close gaps < 200 ms (inside words), drop blips < 60 ms
  const fill = (arr, val, maxLen) => {
    let i = 0;
    while (i < nF) {
      if (arr[i] === val) { let j = i; while (j < nF && arr[j] === val) j++; if (i > 0 && j < nF && j - i < maxLen) for (let k = i; k < j; k++) arr[k] = 1 - val; i = j; } else i++;
    }
  };
  fill(sp, 0, 20); fill(sp, 1, 6);
  const segs = [];
  { let i = 0; while (i < nF) { if (sp[i]) { let j = i; while (j < nF && sp[j]) j++; segs.push([i, j]); i = j; } else i++; } }
  if (!segs.length) return { ok: false, reason: 'No speech detected.' };
  const fr = (x) => (x * hop) / sr;
  const activeStart = fr(segs[0][0]), activeEnd = fr(segs[segs.length - 1][1]);
  const activeSpan = Math.max(0.1, activeEnd - activeStart);
  const speakingTime = segs.reduce((s, [a, b]) => s + fr(b - a), 0);
  const gaps = [];
  for (let i = 1; i < segs.length; i++) gaps.push(fr(segs[i][0] - segs[i - 1][1]));
  const realPauses = gaps.filter((g) => g >= 0.3);
  const deliberate = gaps.filter((g) => g >= 0.6 && g < 2.0).length;
  const longGaps = gaps.filter((g) => g >= 2.0).length;
  onProgress && onProgress(0.25);
  await tick();

  // Syllable nuclei from the energy envelope (pace estimate)
  const env = new Float32Array(nF);
  for (let f = 0; f < nF; f++) { let s = 0, c = 0; for (let k = -2; k <= 2; k++) { const i = f + k; if (i >= 0 && i < nF) { s += db[i]; c++; } } env[f] = s / c; }
  let syl = 0, lastPeak = -100;
  for (let f = 3; f < nF - 3; f++) {
    if (!sp[f]) continue;
    if (env[f] >= env[f - 1] && env[f] > env[f + 1]) {
      let mn = env[f];
      for (let k = Math.max(0, f - 9); k <= Math.min(nF - 1, f + 9); k++) mn = Math.min(mn, env[k]);
      if (env[f] - mn >= 2.5 && f - lastPeak >= 10) { syl++; lastPeak = f; }
    }
  }
  const estWpm = A.round((syl / 1.45) / (activeSpan / 60));

  // Pitch: normalized autocorrelation at 8 kHz on voiced frames, 20 ms hop
  const dsr = 8000, step = sr / dsr;
  const dN = Math.floor(data.length / step);
  const d8 = new Float32Array(dN);
  for (let i = 0; i < dN; i++) { const a = Math.floor(i * step); d8[i] = (data[a] + (data[a + 1] || 0)) / 2; }
  const pwin = 320, phop = 160, minLag = 20, maxLag = 114;
  const nP = Math.max(0, Math.floor((dN - pwin - maxLag) / phop));
  const f0 = new Float32Array(nP);
  for (let p = 0; p < nP; p++) {
    if (p % 400 === 0) { onProgress && onProgress(0.25 + 0.65 * (p / Math.max(1, nP))); await tick(); }
    const tSec = (p * phop) / dsr;
    const fi = Math.min(nF - 1, Math.floor((tSec * sr) / hop) + 1);
    if (!sp[fi] || db[fi] < thr + 3) continue;
    const o = p * phop;
    let e0 = 0;
    for (let j = 0; j < pwin; j++) e0 += d8[o + j] * d8[o + j];
    if (e0 < 1e-6) continue;
    let best = 0, bestLag = 0;
    const r = new Float32Array(maxLag + 2);
    for (let lag = minLag; lag <= maxLag + 1; lag++) {
      let c = 0, e1 = 0;
      for (let j = 0; j < pwin; j++) { const b = d8[o + j + lag]; c += d8[o + j] * b; e1 += b * b; }
      const v = c / Math.sqrt(e0 * e1 + 1e-12);
      r[lag] = v;
      if (lag <= maxLag && v > best) { best = v; bestLag = lag; }
    }
    if (best > 0.55 && bestLag > minLag && bestLag < maxLag) {
      const a = r[bestLag - 1], b = r[bestLag], c = r[bestLag + 1];
      const den = a - 2 * b + c;
      const shift = den !== 0 ? 0.5 * (a - c) / den : 0;
      f0[p] = dsr / (bestLag + A.clamp(shift, -1, 1));
    }
  }
  // median-smooth and drop octave jumps
  const voiced = [];
  for (let p = 0; p < nP; p++) if (f0[p] > 0) voiced.push(f0[p]);
  const fMed = median(voiced);
  const st = new Float32Array(nP).fill(NaN);
  for (let p = 2; p < nP - 2; p++) {
    if (!(f0[p] > 0)) continue;
    const w = [f0[p - 2], f0[p - 1], f0[p], f0[p + 1], f0[p + 2]].filter((x) => x > 0);
    const m = median(w);
    if (fMed && (m > fMed * 1.85 || m < fMed / 1.85)) continue;
    st[p] = 12 * Math.log2(m / fMed);
  }
  const stVals = Array.from(st).filter((x) => !isNaN(x));
  const stSorted = [...stVals].sort((a, b) => a - b);
  const rangeSt = stVals.length >= 40 ? A.round(pct(stSorted, 0.9) - pct(stSorted, 0.1), 1) : null;

  // Rising endings and trail-off per phrase (segments separated by >= 350 ms)
  const phrases = [];
  { let cur = null;
    for (let i = 0; i < segs.length; i++) {
      if (!cur) cur = [segs[i][0], segs[i][1]];
      else if (fr(segs[i][0] - cur[1]) < 0.35) cur[1] = segs[i][1];
      else { phrases.push(cur); cur = [segs[i][0], segs[i][1]]; }
    }
    if (cur) phrases.push(cur); }
  let up = 0, judged = 0, trail = 0, trailJudged = 0;
  const phraseDb = [];
  for (const [a, b] of phrases) {
    const dur = fr(b - a);
    const dbs = Array.from(db.slice(a, b));
    phraseDb.push(mean(dbs));
    if (dur >= 0.8) {
      const cut = a + Math.floor((b - a) * 0.75);
      const head = mean(Array.from(db.slice(a, cut))), tail = mean(Array.from(db.slice(cut, b)));
      trailJudged++; if (head - tail > 6) trail++;
    }
    if (dur < 0.7) continue;
    const pa = Math.floor((fr(a) * dsr) / phop), pb = Math.floor((fr(b) * dsr) / phop);
    const pts = [];
    for (let p = pa; p < Math.min(pb, nP); p++) if (!isNaN(st[p])) pts.push([p, st[p]]);
    if (pts.length < 12) continue;
    const tailFrames = Math.round((0.3 * dsr) / phop);
    const tailPts = pts.filter(([p]) => p >= pb - tailFrames).map(([, v]) => v);
    const bodyPts = pts.filter(([p]) => p < pb - tailFrames).map(([, v]) => v);
    if (tailPts.length < 3 || bodyPts.length < 5) continue;
    judged++;
    if (median(tailPts) - median(bodyPts) > 2) up++;
  }
  onProgress && onProgress(1);

  // Waveform summary for drawing
  const bins = 160, per = Math.max(1, Math.floor(data.length / bins)), wave = [];
  for (let b = 0; b < bins; b++) { let m = 0; const o = b * per; for (let j = 0; j < per && o + j < data.length; j += 4) m = Math.max(m, Math.abs(data[o + j])); wave.push(m); }
  const wmax = Math.max(...wave, 1e-6);

  return {
    ok: true,
    duration: A.round(duration || data.length / sr, 1),
    activeSpan: A.round(activeSpan, 1),
    speakingTime: A.round(speakingTime, 1),
    speechRatio: A.round(speakingTime / activeSpan, 2),
    pauses: {
      count: realPauses.length,
      deliberate,
      deliberatePerMin: A.round(deliberate / (activeSpan / 60), 1),
      long: longGaps,
      avg: A.round(mean(realPauses), 2),
      longest: A.round(Math.max(0, ...gaps), 1),
    },
    estWpm: activeSpan > 8 ? estWpm : null,
    sylRate: A.round(syl / Math.max(0.1, speakingTime), 1),
    pitch: { medianHz: fMed ? Math.round(fMed) : null, rangeSt, stdSt: stVals.length ? A.round(std(stVals), 1) : null, monotone: rangeSt != null && rangeSt < 4 },
    upspeak: { segments: judged, rising: up, pct: judged >= 3 ? A.round((up / judged) * 100) : null },
    volume: { phraseVarDb: A.round(std(phraseDb), 1), trailOffPct: trailJudged ? A.round((trail / trailJudged) * 100) : 0 },
    wave: wave.map((v) => A.round(v / wmax, 3)),
  };
};

/** Pull a few still frames from a video file for the visual check. */
A.videoFrames = async function (file, count = 3) {
  const url = URL.createObjectURL(file);
  const v = document.createElement('video');
  v.muted = true; v.playsInline = true; v.setAttribute('playsinline', ''); v.preload = 'auto'; v.src = url;
  const once = (ev, ms = 8000) => new Promise((res, rej) => {
    const t = setTimeout(() => rej(new Error('The video took too long to load.')), ms);
    v.addEventListener(ev, () => { clearTimeout(t); res(); }, { once: true });
    v.addEventListener('error', () => { clearTimeout(t); rej(new Error('This video format can\'t be read here. Try a photo instead.')); }, { once: true });
  });
  try {
    await once('loadeddata');
    try { await v.play(); v.pause(); } catch (e) { /* autoplay blocked is fine */ }
    const dur = v.duration || 1;
    const marks = [0.2, 0.5, 0.8].slice(0, count);
    const frames = [];
    const scale = Math.min(1, 960 / (v.videoWidth || 960));
    const cw = Math.max(1, Math.round((v.videoWidth || 640) * scale)), ch = Math.max(1, Math.round((v.videoHeight || 480) * scale));
    const canvas = document.createElement('canvas'); canvas.width = cw; canvas.height = ch;
    const ctx = canvas.getContext('2d');
    for (const m of marks) {
      v.currentTime = Math.min(dur - 0.05, dur * m);
      await once('seeked');
      ctx.drawImage(v, 0, 0, cw, ch);
      const blob = await new Promise((r) => canvas.toBlob(r, 'image/jpeg', 0.82));
      if (blob) frames.push({ blob, url: URL.createObjectURL(blob) });
    }
    return { frames, duration: dur };
  } finally {
    URL.revokeObjectURL(url);
  }
};

/** Shrink a photo before sending it. */
A.shrinkImage = async function (file, max = 1280) {
  const url = URL.createObjectURL(file);
  try {
    const img = new Image();
    await new Promise((res, rej) => { img.onload = res; img.onerror = () => rej(new Error('That image couldn\'t be opened.')); img.src = url; });
    const sc = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth * sc); c.height = Math.round(img.naturalHeight * sc);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    const blob = await new Promise((r) => c.toBlob(r, 'image/jpeg', 0.85));
    return { blob, url: URL.createObjectURL(blob) };
  } finally { URL.revokeObjectURL(url); }
};

/* ============================================================
   Green Room — storage
   Saved to the artifact's private database when available (owner-only
   rules), mirrored in this browser for fast start, with device-only
   fallback when the database isn't reachable.
   ============================================================ */
const Store = (() => {
  const LS_KEY = 'greenroom.v1';
  const COLS = ['sessions', 'logs', 'preps', 'reviews'];
  const LIMIT = { sessions: 600, logs: 300, preps: 100, reviews: 60 };
  const st = { mode: 'local', status: 'starting', note: '', profile: null, sessions: [], logs: [], preps: [], reviews: [] };
  const subs = new Set();
  let db = null;
  let cloudSeen = { profile: false };
  const emit = (what) => subs.forEach((f) => { try { f(what); } catch (e) { console.error(e); } });

  function defaultProfile() {
    return {
      name: '', role: '', audiences: '', goal: '',
      plan: null, // personal plan (baselines, targets, strengths, tendencies); falls back to C.DEFAULT_PLAN
      objective: 'A', nextAdjustment: '',
      ratings: {}, onboarded: false, lessonsRead: [],
      game: { seenBadges: null, level: null, stage: null },
      settings: { paceLo: 130, paceHi: 160, autoCoach: true, voice: true, thinkTime: 10, customFillers: [], weeklyGoalMin: 60, sound: true },
      createdAt: Date.now(),
    };
  }
  function mergeProfile(p) {
    const d = defaultProfile();
    const out = Object.assign({}, d, p || {});
    out.settings = Object.assign({}, d.settings, (p && p.settings) || {});
    out.game = Object.assign({}, d.game, (p && p.game) || {});
    if (!/^[A-E]$/.test(out.objective || '')) out.objective = 'A';
    if (!Array.isArray(out.lessonsRead)) out.lessonsRead = [];
    if (!out.ratings || typeof out.ratings !== 'object') out.ratings = {};
    return out;
  }

  function loadLocal() {
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (!raw) return;
      const d = JSON.parse(raw);
      if (d.profile) st.profile = mergeProfile(d.profile);
      for (const c of COLS) if (Array.isArray(d[c])) st[c] = d[c];
    } catch (e) { /* storage blocked or corrupt: start clean */ }
  }
  let saveTimer = null;
  function saveLocal() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      try {
        localStorage.setItem(LS_KEY, JSON.stringify({
          profile: st.profile,
          sessions: st.sessions.slice(0, 300), logs: st.logs.slice(0, 200), preps: st.preps.slice(0, 60), reviews: st.reviews.slice(0, 30),
        }));
      } catch (e) {
        try { // quota: keep the newest items only
          localStorage.setItem(LS_KEY, JSON.stringify({ profile: st.profile, sessions: st.sessions.slice(0, 80), logs: st.logs.slice(0, 60), preps: st.preps.slice(0, 20), reviews: st.reviews.slice(0, 10) }));
        } catch (e2) { /* give up quietly */ }
      }
    }, 250);
  }

  const clean = (o) => JSON.parse(JSON.stringify(o, (k, v) => (k === '_local' ? undefined : v)));
  const body = (item) => { const b = clean(item); delete b.id; delete b._local; return b; };
  const newId = () => Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7);
  const sortDesc = (arr) => arr.sort((a, b) => (b.ts || 0) - (a.ts || 0));

  // One write at a time per document; later writes to the same doc coalesce.
  const queues = new Map();
  function enqueue(path, fn) {
    const q = queues.get(path) || { running: false, next: null };
    queues.set(path, q);
    q.next = fn;
    if (q.running) return;
    const run = async () => {
      q.running = true;
      while (q.next) {
        const f = q.next; q.next = null;
        try { await f(); } catch (e) { handleWriteError(e); }
      }
      q.running = false;
    };
    run();
  }

  function handleWriteError(e) {
    const code = e && e.code;
    if (code === 'quota_exceeded') { st.note = 'Your saved space is full. Delete old sessions in Progress → History.'; emit('mode'); return; }
    if (code === 'unavailable' || code === 'resource_exhausted') { st.note = 'Saving is slow right now. Your work is kept on this device and will retry.'; emit('mode'); return; }
    // not permitted / revoked / disabled: keep working on this device
    st.mode = 'local'; st.status = 'device';
    st.note = 'Saving on this device only.';
    emit('mode');
  }

  function cloudWrite(col, item) {
    item._local = true; // kept through snapshots until the database confirms it
    if (st.mode !== 'cloud' || !db) return;
    const path = col + '/' + item.id;
    enqueue(path, async () => {
      await db.collection(col).doc(item.id).set(body(item));
      delete item._local;
    });
  }

  async function init() {
    loadLocal();
    if (!st.profile) st.profile = defaultProfile();
    emit('all');
    let cap = null;
    try { if (window.claude && typeof window.claude.use === 'function') cap = await window.claude.use('db'); } catch (e) { cap = null; }
    if (!cap) { st.mode = 'local'; st.status = 'device'; emit('mode'); return; }
    db = cap; st.mode = 'cloud'; st.status = 'syncing'; emit('mode');
    const timer = setTimeout(() => { if (st.status === 'syncing') { st.note = 'Can\'t reach your saved data yet. Showing what\'s on this device.'; emit('mode'); } }, 10000);
    const settle = () => { clearTimeout(timer); if (st.status === 'syncing') { st.status = 'cloud'; st.note = ''; emit('mode'); } };

    db.doc('app/profile').onSnapshot((snap) => {
      if (snap.exists) {
        st.profile = mergeProfile(snap.data());
        saveLocal(); emit('profile');
      } else if (!snap.metadata.fromCache && !cloudSeen.profile) {
        // First run in the cloud: keep whatever this device already has
        enqueue('app/profile', () => db.doc('app/profile').set(clean(st.profile)));
      }
      if (!snap.metadata.fromCache) { cloudSeen.profile = true; settle(); }
    }, (e) => { clearTimeout(timer); handleWriteError(e); });

    for (const c of COLS) {
      let first = true;
      db.collection(c).orderBy('ts', 'desc').limit(LIMIT[c]).onSnapshot((snap) => {
        const cloud = snap.docs.map((d) => Object.assign({}, d.data(), { id: d.id }));
        const ids = new Set(cloud.map((x) => x.id));
        const localOnly = st[c].filter((x) => x._local && !ids.has(x.id));
        st[c] = sortDesc(cloud.concat(localOnly));
        if (first && !snap.metadata.fromCache) {
          first = false;
          for (const item of localOnly) cloudWrite(c, item); // push work done before the database answered
        }
        if (!snap.metadata.fromCache) settle();
        saveLocal(); emit(c);
      }, (e) => { clearTimeout(timer); handleWriteError(e); });
    }
  }

  function put(col, item) {
    if (!item.id) item.id = newId();
    if (!item.ts) item.ts = Date.now();
    if (item.mult == null && (col === 'sessions' || col === 'logs') && typeof G !== 'undefined') { try { item.mult = G.multNow(); } catch (e) { item.mult = 1; } }
    const arr = st[col];
    const i = arr.findIndex((x) => x.id === item.id);
    if (i >= 0) arr[i] = item; else arr.push(item);
    sortDesc(arr);
    saveLocal(); emit(col);
    cloudWrite(col, item);
    return item;
  }
  function remove(col, id) {
    st[col] = st[col].filter((x) => x.id !== id);
    saveLocal(); emit(col);
    if (st.mode === 'cloud' && db) enqueue(col + '/' + id, () => db.collection(col).doc(id).delete());
  }
  function saveProfile(patch) {
    st.profile = mergeProfile(Object.assign({}, st.profile, patch, { updatedAt: Date.now() }));
    if (patch && patch.settings) A.setCustomFillers(st.profile.settings.customFillers);
    saveLocal(); emit('profile');
    if (st.mode === 'cloud' && db) { const snap = clean(st.profile); enqueue('app/profile', () => db.doc('app/profile').set(snap)); }
  }
  function exportAll() {
    return { app: 'Green Room', version: 1, exportedAt: new Date().toISOString(), profile: clean(st.profile), sessions: st.sessions.map(clean), logs: st.logs.map(clean), preps: st.preps.map(clean), reviews: st.reviews.map(clean) };
  }
  function importAll(d) {
    if (!d || typeof d !== 'object' || (d.app && d.app !== 'Green Room')) throw new Error('That file isn\'t a Green Room backup.');
    let n = 0;
    if (d.profile) saveProfile(d.profile);
    for (const c of COLS) if (Array.isArray(d[c])) for (const item of d[c]) { if (item && item.ts) { put(c, Object.assign({}, item, { id: item.id || newId() })); n++; } }
    return n;
  }
  function resetAll() {
    for (const c of COLS) for (const item of [...st[c]]) remove(c, item.id);
    saveProfile(defaultProfile());
  }

  return {
    get mode() { return st.mode; }, get status() { return st.status; }, get note() { return st.note; },
    get profile() { return st.profile; }, get sessions() { return st.sessions; }, get logs() { return st.logs; },
    get preps() { return st.preps; }, get reviews() { return st.reviews; },
    init, put, remove, saveProfile, exportAll, importAll, resetAll, newId,
    on: (f) => { subs.add(f); return () => subs.delete(f); },
  };
})();

/* ============================================================
   Green Room — AI coach (Claude via the artifact's sample capability)
   Every prompt is built around the person's development plan.
   ============================================================ */
const AI = (() => {
  let fn = null;
  let state = 'starting'; // starting | ready | off
  let imagesOk = false;
  const subs = new Set();
  const emit = () => subs.forEach((f) => { try { f(); } catch (e) { console.error(e); } });
  const PERMANENT = ['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'];

  async function init() {
    try { if (window.claude && typeof window.claude.use === 'function') fn = await window.claude.use('sample'); } catch (e) { fn = null; }
    state = fn ? 'ready' : 'off';
    if (fn) { try { const lim = await fn.limits(); imagesOk = !!(lim && lim.images); } catch (e) { imagesOk = false; } }
    emit();
  }
  function fail(e) { if (e && PERMANENT.includes(e.code)) { state = 'off'; emit(); } throw e; }
  async function json(prompt, opts = {}) {
    if (!fn) throw { code: 'unavailable', message: 'Claude is not available here.' };
    try { return await fn.json(prompt, opts); } catch (e) { return fail(e); }
  }
  async function text(input, opts = {}) {
    if (!fn) throw { code: 'unavailable', message: 'Claude is not available here.' };
    try { return await fn(input, opts); } catch (e) { return fail(e); }
  }
  function errorText(e) {
    const c = e && e.code;
    if (c === 'cancelled') return '';
    if (c === 'not_granted') return 'The coach needs permission to use Claude. You can allow it from this page\'s Permissions menu.';
    if (['sampling_disabled', 'unavailable', 'not_declared', 'capability_disabled', 'capability_removed'].includes(c)) return 'The AI coach isn\'t available in this view. Your scores still work.';
    if (c === 'rate_limited') return 'You\'ve hit a usage limit for now. Try again in a little while.';
    if (c === 'session_expired') return 'Your Claude session expired. Sign in again, then retry.';
    if (c === 'invalid_json') return 'The coach\'s answer came back garbled. Tap retry.';
    if (c === 'refused') return 'The coach couldn\'t respond to that. Try rephrasing.';
    if (c === 'prompt_too_large') return 'That\'s too long for one review. Try a shorter excerpt.';
    if (c === 'image_rejected' || c === 'images_unavailable') return 'That image couldn\'t be used. Try a different photo.';
    return 'The coach didn\'t answer. Check your connection and retry.';
  }

  /* ---------------- The plan, as context ---------------- */
  const f1 = (v) => (v == null ? '?' : Number(v).toFixed(1).replace(/\.0$/, ''));
  function planOf(p) { return Object.assign({}, C.DEFAULT_PLAN, p.plan || {}); }
  function who(p) {
    const pl = planOf(p);
    const dims = C.DIMENSIONS.map((d) => `- ${d.name}: baseline ${f1(pl.baseline[d.id])}, target ${f1(pl.target[d.id])}`).join('\n');
    const areas = C.AREAS.map((a) => {
      const t = (pl.tendencies && pl.tendencies[a.id]) || [];
      return `${a.id}. ${a.title}${a.id === p.objective ? ' (THIS WEEK\'S OBJECTIVE)' : ''}\n   Current tendency: ${t.length ? t.join('; ') : 'not specified'}\n   Desired behavior: ${a.desired.join('; ')}`;
    }).join('\n');
    const str = (pl.strengths || []).map((s) => `- ${s.title}: ${(s.points || []).join('; ')}`).join('\n');
    return `ABOUT THE PERSON YOU COACH
${p.name || 'The client'}${p.role ? ', ' + p.role : ''}. Usual audiences: ${p.audiences || 'senior executives'}.
North Star: ${pl.north}
${pl.goal}
Overall executive presence: baseline ${f1(pl.overall.baseline)}/10, target ${f1(pl.overall.target)}/10.
Dimensions (1-10):
${dims}
${str ? 'Established strengths:\n' + str + '\n' : ''}Development areas:
${areas}
Their communication framework: HEADLINE (central point) → STRUCTURE (two or three supporting arguments) → IMPLICATION (why it matters) → ACTION (what happens next). Rules: three points maximum; two-sentence executive summary; one clear recommendation; one explicit next action.
Executive language they are building: "My recommendation is…", "The fundamental issue is…", "There are two considerations here.", "The strategic implication is…", "I would distinguish between…", "The decision we need to make is…", "I would prioritize…", "The risk I would focus on is…". Language they are dropping: "I think maybe we should consider…", "One thing I was thinking about…", "I'm not sure if this makes sense…".
The path: Stage 1 Strong Analyst → Stage 2 Strategic Business Leader → Stage 3 Executive. The goal is Stage 3.
The standard is not how intelligent they sound. It is whether people leave with greater clarity, confidence in the direction, and an understanding of what needs to happen.`;
  }

  const COACH_VOICE = `You are an elite executive-presence coach who has prepared CEOs for boards, investor days and hostile Q&A. Be direct, specific and warm. Quote their exact words when you point out an issue and always show the executive version. One high-leverage fix beats five small ones. Don't try to change their personality; sharpen how their thinking comes across. No filler, no generic advice, no unearned praise.`;
  const SCALE = `Scores are 1-10 with one decimal, calibrated to their plan: 7.0 is their current baseline (a strong analyst: rigorous, but builds to the point and hedges); 8.5 is their target (sounds like an executive); 9+ is C-suite or board level; 5 or below undermines credibility.`;
  const DIM_IDS = C.DIMENSIONS.map((d) => `"${d.id}"`).join(', ');

  function metricsBlock(m) {
    if (!m) return 'No measurements.';
    const L = [];
    L.push(`Words: ${m.words}${m.durationSec ? `; duration ${Math.round(m.durationSec)}s` : ''}${m.wpm ? `; pace ${m.wpm} wpm` : ''}`);
    L.push(`Fillers: ${m.fillers}${m.fillerTypes && m.fillerTypes.length ? ' (' + m.fillerTypes.map((x) => `${x.label} ×${x.n}`).join(', ') + ')' : ''}`);
    L.push(`Hedges: ${m.hedges}${m.hedgeTypes && m.hedgeTypes.length ? ' (' + m.hedgeTypes.map((x) => `${x.label} ×${x.n}`).join(', ') + ')' : ''}`);
    if (m.hsia) L.push(`Automatic framework check: headline ${m.hsia.headline ? 'yes' : 'no'}, structure ${m.hsia.structure ? 'yes' : 'no'}, implication ${m.hsia.implication ? 'yes' : 'no'}, action ${m.hsia.action ? 'yes' : 'no'}`);
    L.push(`Numbers used: ${m.numbers}; average sentence ${m.avgSentence} words${m.weakEnd ? `; weak ending "${m.weakEnd}"` : ''}`);
    return L.join('\n');
  }
  function audioBlock(a) {
    if (!a || !a.ok) return '';
    return `Acoustic measurements: speaking span ${a.activeSpan}s; estimated pace ${a.estWpm || 'n/a'} wpm; ${a.pauses.deliberate} deliberate pauses (${a.pauses.deliberatePerMin}/min), ${a.pauses.long} long gaps; pitch range ${a.pitch.rangeSt ?? 'n/a'} semitones (under 4 is flat); rising endings on ${a.upspeak.pct ?? 'n/a'}% of phrases; volume trails off on ${a.volume.trailOffPct}% of phrases.`;
  }
  function captureNote(source) {
    if (source === 'dictation') return 'Captured with phone dictation, which deletes most "um"s: filler counts are a floor. Pace is approximate.';
    if (source === 'typed') return 'Typed, not spoken: don\'t judge vocal delivery; set "confidence" from wording only.';
    if (source === 'mic') return 'Captured live with speech recognition; ignore small recognition errors and missing punctuation.';
    if (source === 'upload') return 'Captured from an uploaded recording; the transcript (if any) was pasted by them.';
    return '';
  }
  const HSIA_JSON = `"hsia": {"headline": {"met": true|false, "note": "max 12 words"}, "structure": {...}, "implication": {...}, "action": {...}}`;

  /* ---------------- Rep feedback ---------------- */
  function feedbackPrompt(p, spec, rec) {
    return `${COACH_VOICE}

${who(p)}

THE REP
Exercise: ${spec.title}
Audience: ${spec.audience || 'senior executives'}
Situation: ${spec.situation || '—'}
Task: ${spec.prompt}
Time limit: ${spec.time ? spec.time + ' seconds' : 'none'}
Success criteria:
${(spec.criteria || []).map((c) => '- ' + c).join('\n') || '- Headline, structure, implication, action'}
${rec.attempt > 1 ? `Attempt ${rec.attempt}. Previous attempt scored ${rec.prevScore != null ? f1(rec.prevScore / 10) : 'n/a'}/10. Say briefly what improved.` : ''}

HOW IT WAS CAPTURED
${captureNote(rec.source)}

MEASUREMENTS
${metricsBlock(rec.metrics)}
${audioBlock(rec.audio)}
${rec.hasImages ? 'Also attached: still frames from their video. Include one note on presence (posture, eye line, energy) if it matters.' : ''}

TRANSCRIPT
"""
${String(rec.transcript || '').slice(0, 12000)}
"""

${SCALE}

Reply with only a JSON object in exactly this shape:
{
  "headline": "one-sentence verdict, max 18 words",
  "scores": {"framing": 1-10, "clarity": 1-10, "concision": 1-10, "assertive": 1-10, "confidence": 1-10, "decision": 1-10, "stakeholder": 1-10 or null, "commercial": 1-10 or null},
  ${HSIA_JSON},
  "stage": 1 | 2 | 3,
  "criteria": [{"criterion": "copy each success criterion", "met": "yes" | "partly" | "no"}],
  "strengths": ["max 2 specific strengths, max 20 words each"],
  "fixes": [{"area": "A"|"B"|"C"|"D"|"E", "issue": "2-5 word label", "quote": "their exact words, or empty", "why": "max 20 words", "try": "the exact executive wording to use instead"}],
  "summary2": "their answer as a two-sentence executive summary",
  "rewrite": "the executive version, spoken in their voice, in Headline → Structure → Implication → Action order; same facts (light placeholders like [X] allowed, invent nothing); about 60% of their words",
  "next_rep": "one behavioral instruction for the immediate retry, max 25 words"
}
Rules: "stage" is which stage this answer sounds like (1 Strong Analyst, 2 Strategic Business Leader, 3 Executive). Max 3 fixes, highest impact first, each tagged with the development area it belongs to. Score "stakeholder" and "commercial" only if the rep clearly shows them, otherwise null.`;
  }

  /* ---------------- Sparring ---------------- */
  function sparRules(p, persona, ctx, difficulty, rounds) {
    return `ROLE-PLAY FOR SPEAKING PRACTICE. Stay in character for the whole conversation.

You are ${persona.name}, ${persona.role}. Style: ${persona.style}
You're speaking with ${p.name || 'a senior leader'}${p.role ? ', ' + p.role : ''}.
Scenario: ${ctx}
Difficulty: ${C.DIFFICULTY[difficulty] || C.DIFFICULTY.tough}

Rules:
- Speak as you would out loud in the room: one turn at a time, max 50 words, no stage directions, no lists, no markdown.
- Ask one question or make one move per turn. React to their last answer first in a few words when it's natural.
- If they bury the conclusion, hedge, ramble or present analysis without a recommendation, react the way a real ${persona.role} would: interrupt, ask for the bottom line, ask what they recommend, or press for the number.
- If they lead well (clear headline, a recommendation, a decision with an owner), let it land and move on to the next hard question.
- Build on what they actually said; don't run a script.
- There will be ${rounds} turns from you in total. After their final answer, give a one-sentence in-character reaction and end with the exact token [END].
- Their answers are transcribed speech: ignore small transcription errors.`;
  }
  function sparTurns(rules, convo, isLast) {
    const turns = [{ role: 'user', content: rules + '\n\nBegin now with your opening line and first question.' }];
    for (const t of convo) turns.push({ role: t.role === 'me' ? 'user' : 'assistant', content: t.content || '…' });
    if (isLast) turns[turns.length - 1] = { role: 'user', content: turns[turns.length - 1].content + '\n\n(That was the final answer. React in character in one sentence, then end with [END].)' };

  function debriefPrompt(p, persona, ctx, convo) {

    return `${COACH_VOICE}

${who(p)}

They just finished a role-play with "${persona.name}" (${persona.role}). Scenario: ${ctx}
Answers were spoken and transcribed (or typed); bracketed numbers are measurements of each answer.

CONVERSATION
${transcript.slice(0, 30000)}

${SCALE}

Debrief them. Reply with only a JSON object in exactly this shape:
{
  "headline": "one-sentence verdict, max 18 words",
  "scores": {"framing": 1-10, "clarity": 1-10, "concision": 1-10, "assertive": 1-10, "confidence": 1-10, "decision": 1-10, "stakeholder": 1-10, "commercial": 1-10 or null},
  "stage": 1 | 2 | 3,
  "moments": [{"question": "their question, shortened", "verdict": "strong" | "ok" | "weak", "note": "max 20 words", "better": "for ok/weak: a stronger answer in max 45 words, in their voice, headline first; empty for strong"}],
  "strengths": ["max 2"],
  "patterns": ["max 2 patterns across answers, tied to their development areas"],
  "next_focus": "the one behavior to practice next, max 25 words"
}
One "moments" entry per question asked. "stage" is which stage they sounded like overall.`;
  }

  /* ---------------- Meeting review (Section 6 scorecard) ---------------- */
  function meetingPrompt(p, m, prev) {
    return `${COACH_VOICE}

${who(p)}

Review this real meeting against their Meeting Performance Scorecard.
Meeting type: ${C.mtype(m.type).name}

/* ---------------- Gauge (VU meter, 0-10) ---------------- */
function gauge(score, opts = {}) {
  // score: internal 0-100
  const cx = 120, cy = 116, R = 96, a0 = -58, a1 = 58;
  const ang = (v) => a0 + ((a1 - a0) * A.clamp(v, 0, 100)) / 100;
  const pt = (deg, r) => [cx + r * Math.sin((deg * Math.PI) / 180), cy - r * Math.cos((deg * Math.PI) / 180)];
  const arc = (v0, v1, r) => { const [x0, y0] = pt(ang(v0), r), [x1, y1] = pt(ang(v1), r); return `M${x0.toFixed(1)} ${y0.toFixed(1)} A${r} ${r} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`; };
  let ticks = '';
  for (let v = 0; v <= 100; v += 5) {
    const major = v % 10 === 0;
    const [x0, y0] = pt(ang(v), R - (major ? 11 : 6)), [x1, y1] = pt(ang(v), R);
    ticks += `<line class="tick${major ? ' major' : ''}" x1="${x0.toFixed(1)}" y1="${y0.toFixed(1)}" x2="${x1.toFixed(1)}" y2="${y1.toFixed(1)}" stroke-width="${major ? 1.6 : 1}"/>`;
    if (major && v % 20 === 0) { const [lx, ly] = pt(ang(v), R + 11); ticks += `<text class="lbl" x="${lx.toFixed(1)}" y="${(ly + 3).toFixed(1)}" text-anchor="middle">${v / 10}</text>`; }
  }
  const mark = (v, cls) => { if (v == null) return ''; const [x0, y0] = pt(ang(v), R - 16), [x1, y1] = pt(ang(v), R + 4); return `<line class="${cls}" x1="${x0.toFixed(1)}" y1="${y0.toFixed(1)}" x2="${x1.toFixed(1)}" y2="${y1.toFixed(1)}"/>`; };
  const has = score != null && !isNaN(score);
  const target = has ? ang(score) : a0;
  const start = opts.animate === false ? target : a0;
  const tgt = opts.target != null ? opts.target : 85;
  return `<svg class="gauge ${opts.dark ? 'on-deep' : ''}" viewBox="0 0 240 ${opts.base != null && opts.marks !== false ? 194 : 178}" role="img" aria-label="${esc(opts.label || 'Presence score')}: ${has ? s10(score) : 'no score yet'} out of 10">
    <path class="arc" d="${arc(0, 100, R)}"/>
    <path class="zone-mid" d="${arc(opts.base != null ? opts.base : 70, tgt, R + 2.5)}"/>
    <path class="zone-good" d="${arc(tgt, 100, R + 2.5)}"/>
    ${ticks}
    ${opts.marks !== false ? mark(opts.base, 'mark-base') + mark(tgt, 'mark-target') : ''}
    <g class="needle-g" data-target="${target}" style="transform: rotate(${start}deg); transform-origin: ${cx}px ${cy}px;">
      <line class="needle" x1="${cx}" y1="${cy + 8}" x2="${cx}" y2="${cy - R + 4}"/>
    </g>
    <circle class="pivot" cx="${cx}" cy="${cy}" r="5"/>
    <text class="score${has ? '' : ' empty'}" x="${cx}" y="${cy + (has ? 44 : 36)}" text-anchor="middle">${has ? s10(score) : 'No score yet'}</text>
    <text class="cap" x="${cx}" y="${cy + 59}" text-anchor="middle">${esc((opts.label || 'PRESENCE SCORE').toUpperCase())}</text>
    ${opts.marks !== false && opts.base != null ? `<text class="mark-lbl" x="${cx}" y="${cy + 73}" text-anchor="middle"><tspan class="ml-base">┊ base ${s10(opts.base)}</tspan>   <tspan class="ml-goal">▮ goal ${s10(tgt)}</tspan></text>` : ''}
  </svg>`;
}

/* ---------------- Charts ---------------- */
function lineChart(values, opts = {}) {
  const W = opts.w || 340, H = opts.h || 150, padL = 28, padR = 34, padT = 12, padB = 20;
  const vals = values.map((v) => (v == null ? null : Number(v)));
  const pts = vals.map((v, i) => [i, v]).filter(([, v]) => v != null);
  if (pts.length < 2) return '';
  let min = opts.min != null ? opts.min : Math.min(...pts.map((p) => p[1]));
  let max = opts.max != null ? opts.max : Math.max(...pts.map((p) => p[1]));
  if (opts.band) { min = Math.min(min, opts.band[0] - 10); max = Math.max(max, opts.band[1] + 10); }
  if (max - min < 1) { max += 1; min -= 1; }
  const n = vals.length;
  const x = (i) => padL + ((W - padL - padR) * i) / Math.max(1, n - 1);
  const y = (v) => padT + (H - padT - padB) * (1 - (v - min) / (max - min));
  const ticks = opts.ticks || [min, (min + max) / 2, max].map((t) => Math.round(t));
  let g = '<g class="grid">' + ticks.map((t) => `<line x1="${padL}" x2="${W - padR}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}"/>`).join('') + '</g>';
  g += ticks.map((t) => `<text class="axis" x="${padL - 6}" y="${(y(t) + 3).toFixed(1)}" text-anchor="end">${t}</text>`).join('');
  if (opts.band) g += `<rect class="band" x="${padL}" width="${W - padL - padR}" y="${y(opts.band[1]).toFixed(1)}" height="${(y(opts.band[0]) - y(opts.band[1])).toFixed(1)}"/>`;
  const d = pts.map(([i, v], k) => `${k ? 'L' : 'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');
  if (opts.area !== false) g += `<path class="area" d="${d} L${x(pts[pts.length - 1][0]).toFixed(1)} ${H - padB} L${x(pts[0][0]).toFixed(1)} ${H - padB} Z"/>`;

  if (opts.avg && pts.length >= 4) {
    const k = opts.avg; const ma = [];
    for (let j = 0; j < pts.length; j++) { const w = pts.slice(Math.max(0, j - k + 1), j + 1).map((p) => p[1]); ma.push([pts[j][0], w.reduce((a, b) => a + b, 0) / w.length]); }
    g += `<path class="line avg" d="${ma.map(([i, v], j) => `${j ? 'L' : 'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ')}"/>`;
  }
  if (pts.length <= 40) g += pts.slice(0, -1).map(([i, v]) => `<circle class="dot" cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="2"/>`).join('');
  const [li, lv] = pts[pts.length - 1];
  g += `<circle class="dot end" cx="${x(li).toFixed(1)}" cy="${y(lv).toFixed(1)}" r="4.5"/>`;
  g += `<text class="endlbl" x="${(x(li) + 8).toFixed(1)}" y="${(y(lv) + 4).toFixed(1)}">${esc(opts.fmt ? opts.fmt(lv) : Math.round(lv))}</text>`;
  if (opts.xlabels) g += `<text class="axis" x="${padL}" y="${H - 4}">${esc(opts.xlabels[0])}</text><text class="axis" x="${W - padR}" y="${H - 4}" text-anchor="end">${esc(opts.xlabels[1])}</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label || 'Trend chart')}">${g}</svg>`;
}

function radarChart(now, layers, dims) {
  const W = 340, H = 270, cx = 170, cy = 136, R = 86;
  const n = dims.length;
  const p = (i, r) => { const a = (-90 + (360 / n) * i) * Math.PI / 180; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; };
  let g = '';
  for (const lv of [0.25, 0.5, 0.75, 1]) g += `<polygon class="radar-grid" points="${dims.map((_, i) => p(i, R * lv).map((v) => v.toFixed(1)).join(',')).join(' ')}"/>`;
  dims.forEach((_, i) => { const [x, y] = p(i, R); g += `<line class="radar-grid" x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>`; });
  const poly = (vals, cls) => `<polygon class="${cls}" points="${dims.map((dm, i) => p(i, R * A.clamp((vals[dm.id] || 0) / 100, 0, 1)).map((v) => v.toFixed(1)).join(',')).join(' ')}"/>`;
  for (const [vals, cls] of layers || []) if (vals) g += poly(vals, cls);
  if (now) g += poly(now, 'radar-now');
  dims.forEach((dm, i) => {
    const [x, y] = p(i, R + 18);
    const anchor = Math.abs(x - cx) < 10 ? 'middle' : x > cx ? 'start' : 'end';
    const yy = y < cy - R ? y - 4 : y > cy + R ? y + 6 : y;
    g += `<text class="radar-lbl" x="${x.toFixed(1)}" y="${yy.toFixed(1)}" text-anchor="${anchor}">${esc(dm.short || dm.name)}</text>`;
    g += `<text class="radar-val" x="${x.toFixed(1)}" y="${(yy + 12).toFixed(1)}" text-anchor="${anchor}">${now && now[dm.id] != null ? s10(now[dm.id]) : '—'}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Dimension profile against baseline and target">${g}</svg>`;
}
function waveSvg(wave) {
  if (!wave || !wave.length) return '';
  const W = 320, H = 56, n = wave.length, bw = W / n;
  return `<svg class="wave" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">${wave.map((v, i) => { const h = Math.max(1.5, v * (H - 4)); return `<rect x="${(i * bw).toFixed(2)}" y="${((H - h) / 2).toFixed(2)}" width="${Math.max(0.8, bw - 0.6).toFixed(2)}" height="${h.toFixed(2)}" rx="0.6"/>`; }).join('')}</svg>`;
}

function bars(scores, dims = C.DIMENSIONS, opts = {}) {
  const pl = opts.plan ? G.plan() : null;
  return `<div class="bars">${dims.filter((d) => scores[d.id] != null && !isNaN(scores[d.id])).map((d) => {
    const v = Math.round(scores[d.id]);
    const cls = pl ? (v >= pl.target[d.id] * 10 ? 'good' : v >= pl.baseline[d.id] * 10 ? 'warn' : 'bad') : scoreClass(v);
    const ticks = pl ? `<i class="tk base" style="left:${pl.baseline[d.id] * 10}%"></i><i class="tk goal" style="left:${pl.target[d.id] * 10}%"></i>` : '';
    return `<div class="bar"><span>${esc(opts.short ? (d.short || d.name) : d.name)}</span><span class="track"><span class="fill ${cls}" style="width:${v}%"></span>${ticks}</span><span class="val">${s10(v)}</span></div>`;
  }).join('')}</div>${pl ? '<div class="legend" style="margin-top:6px"><span><i class="tk-l base"></i>Baseline</span><span><i class="tk-l goal"></i>Target</span></div>' : ''}`;
}

function sessionRow(s) {

function journey(st) {
  return `<div class="journey">${C.STAGES.map((sg) => {

    return `<div class="stage ${state}"><div class="stage-top"><span class="stage-num">${sg.id}</span><span class="stage-name">${esc(sg.name)}</span></div>
      <div class="dots">${lv.map((l) => `<i class="${st.level.n >= l.n ? 'on' : ''} ${st.level.n === l.n ? 'cur' : ''}" title="${esc(l.title)} · ${l.xp} XP"></i>`).join('')}</div>
      <p class="small muted">${esc(sg.blurb)}</p>
      ${C.GATES[sg.id] && state === 'next' ? `<p class="small"><b>Gate:</b> ${esc(C.GATES[sg.id].text)}</p>` : ''}</div>`;
  }).join('')}</div>`;
}

/* ============================================================
   Green Room — sheets, recorder and the practice-rep flow
   ============================================================ */
const SHEETS = {};
const cleanups = [];
function addCleanup(fn) { cleanups.push(fn); }
function runCleanups() { while (cleanups.length) { try { cleanups.pop()(); } catch (e) { /* ignore */ } } }

const Sheet = {
  open(type, data = {}) {
    runCleanups();
    S.sheet = Object.assign({ type }, data);
    const el = $('#sheet');
    el.hidden = false;
    document.body.style.overflow = 'hidden';
    this.render();
    el.scrollTop = 0;
  },
  close() {
    runCleanups();
    Rec.cancel();
    try { window.speechSynthesis && speechSynthesis.cancel(); } catch (e) { /* ignore */ }
    S.sheet = null; S.rep = null; S.spar = null; S.drill = null; S.tool = null; S.game = null;
    const el = $('#sheet');
    el.hidden = true; el.innerHTML = '';
    document.body.style.overflow = '';
    renderView();
  },
  render(keepScroll) {
    if (!S.sheet) return;
    const def = SHEETS[S.sheet.type];
    if (!def) return;
    const el = $('#sheet');
    const top = el.scrollTop;
    const out = def.render(S.sheet);

/* Dictation box tracker: timer starts at first words, ends at last words. */
function trackDictation(box, onTick) {
  const st = { t0: 0, last: 0, inserts: 0, chars: 0, pasted: false };
  box.addEventListener('input', (e) => {
    const now = performance.now();
    if (!st.t0 && box.value.trim()) st.t0 = now;
    if (st.t0) st.last = now;
    if (e.inputType === 'insertFromPaste') st.pasted = true;
    if (e.data) { st.inserts++; st.chars += e.data.length; }
    onTick && onTick(st);
  });
  box.addEventListener('paste', () => { st.pasted = true; });
  const iv = setInterval(() => onTick && onTick(st), 500);
  addCleanup(() => clearInterval(iv));
  st.stop = () => clearInterval(iv);
  st.seconds = () => (st.t0 ? (st.last - st.t0) / 1000 + 1.2 : 0);
  st.looksTyped = () => st.pasted || (st.inserts > 8 && st.chars / st.inserts < 2.2);

}

function openHsia(caseId) {
  const k = C.HSIA_CASES.find((x) => x.id === caseId) || C.HSIA_CASES[Math.floor(Math.random() * C.HSIA_CASES.length)];

const HB = {
  headline(t) {
    const w = A.wordList(t).length; let sc = 0, msg = [];
    if (!w) return { sc: 0, msg: 'Your central point, in one sentence.' };
    if (w >= 4 && w <= 25) sc += 10; else msg.push(w > 25 ? `${w} words: cut to 25 or fewer` : 'Too short to carry the point');
    if (/\b(recommend|should|propose|pass|invest|approve|decline|proceed|decision|bottom line|is not|isn't|will|need|prioriti[sz]e|must|extend|exit|partner|build|hire)\b/i.test(t)) sc += 10; else msg.push('State a position or recommendation');
    if (!/^\s*(background|context|so\b|well\b|first\b|before|let me|as you know|I think)/i.test(t)) sc += 5; else msg.push('Don\'t open with set-up');
    return { sc, msg: msg.join(' · ') || 'Clear headline' };
  },
  structure(arr) {
    const pts = arr.map((x) => x.trim()).filter(Boolean);
    if (!pts.length) return { sc: 0, msg: 'Two or three supporting arguments.' };
    let sc = pts.length >= 2 ? 15 : 7; const msg = [];
    if (pts.length < 2) msg.push('Add a second point');
    const long = pts.filter((x) => A.wordList(x).length > 15).length;
    sc += Math.round(10 * (1 - long / pts.length)); if (long) msg.push(`${long} point${long > 1 ? 's' : ''} over 15 words`);
    return { sc, msg: msg.join(' · ') || `${pts.length} tight points` };
  },
  implication(t) {
    const w = A.wordList(t).length; let sc = 0; const msg = [];
    if (!w) return { sc: 0, msg: 'Why does this matter?' };
    sc += 8;
    if (/\b(means|implication|matters|so that|result|risk|value|position|strategic|cost|return|lose|gain|advantage|default|first|ahead|behind)\b/i.test(t)) sc += 10; else msg.push('Say what it means for the organization');
    if (w <= 30) sc += 7; else msg.push('Keep it to one sentence');
    return { sc, msg: msg.join(' · ') || 'Clear implication' };
  },
  action(t) {
    const w = A.wordList(t).length; let sc = 0; const msg = [];
    if (!w) return { sc: 0, msg: 'What should happen next?' };
    sc += 8;
    if (/\b(approve|fund|decide|sign|launch|assign|send|schedule|reconvene|move|proceed|start|stop|hire|authorize|commit|own|agree|extend|exit|pass|counter|bring)\b/i.test(t)) sc += 9; else msg.push('Use an action verb');
    if (/\b(I|we|[A-Z][a-z]+) (will|'ll|owns?|to)\b|\bby\b|\btoday\b|\btomorrow\b|this week|next week|monday|tuesday|wednesday|thursday|friday|\bq[1-4]\b|\d/i.test(t)) sc += 8; else msg.push('Add an owner or a date');

  },
};
function hbScore(f) {

    const voices = speechSynthesis.getVoices();
    const v = voices.find((x) => /en[-_](US|GB)/i.test(x.lang) && /Daniel|Alex|Google UK English Male|Arthur|Aaron/i.test(x.name)) || voices.find((x) => /^en/i.test(x.lang));

  } catch (e) { /* speech not available */ }
}

async function sparAsk() {
  const sp = S.spar;
  if (!sp) return;
  const answered = sp.convo.filter((t) => t.role === 'me').length;
  const isLast = answered >= sp.rounds;
  if (sp.offline) {
    if (isLast) return sparDebrief();
    const bank = C.QBANK[sp.persona.id] || C.QBANK['ic-chair'];
    const q = bank[answered % bank.length];
    sp.convo.push({ role: 'them', content: q }); Sheet.render(); speak(q); return;
  }
  sp.waiting = true; sp.err = ''; Sheet.render();
  const ctl = new AbortController(); addCleanup(() => ctl.abort());
  try {
    const rules = AI.sparRules(Store.profile, sp.persona, sp.ctx, sp.difficulty, sp.rounds);
    const res = await AI.text(AI.sparTurns(rules, sp.convo, isLast), { modelTier: 'quick', cache: false, signal: ctl.signal });
    if (!S.spar) return;
    let txt = String(res.text || '').trim();
    const ended = /\[END\]/.test(txt);
    txt = txt.replace(/\[END\]/g, '').trim();
    sp.waiting = false;
    if (txt) { sp.convo.push({ role: 'them', content: txt }); speak(txt); }
    if (ended || isLast) { Sheet.render(); setTimeout(() => S.spar && sparDebrief(), txt ? 1800 : 0); return; }
    Sheet.render();
  } catch (e) {
    if (!S.spar) return;
    sp.waiting = false;
    if (e && e.code === 'cancelled') return;
    if (AI.state === 'off') { sp.offline = true; sp.err = ''; toast('Switched to the offline question bank.'); return sparAsk(); }
    sp.err = AI.errorText(e); Sheet.render();
  }
}

function runPace() {
  const d = S.drill; d.running = true; Sheet.render(true);
  const spans = $$('#reader span'); const base = 60000 / d.wpm;
  let i = 0, tm = null;
  const step = () => {
    if (!S.drill || !S.drill.running) return;
    if (i > 0) { spans[i - 1].classList.remove('cur'); spans[i - 1].classList.add('done'); }
    if (i >= spans.length) { d.running = false; d.done = true; logDrill('pace', 3); Sheet.render(true); return; }
    spans[i].classList.add('cur');
    const w = spans[i].textContent;
    const extra = /[.!?]$/.test(w) ? 650 : /[,;:]$/.test(w) ? 280 : 0;
    i++;
    tm = setTimeout(step, base + extra);
  };
  step();
  addCleanup(() => clearTimeout(tm));
}

function weekSummaryText() {
  const now = Date.now(), wk = 7 * 86400000;
  const block = (from, to) => {
    const ss = Store.sessions.filter((s) => s.ts >= from && s.ts < to);
    const reps = ss.filter((s) => REP_KINDS.includes(s.kind));
    const sc = reps.map((s) => G.scores(s).overall).filter((x) => x != null);
    const dims = {}; for (const d of C.DIMENSIONS) { const v = reps.map((s) => G.scores(s)[d.id]).filter((x) => x != null); if (v.length) dims[d.id] = Math.round(v.reduce((a, b) => a + b, 0) / v.length); }
    const h = {}; for (const s of reps) for (const x of ((s.metrics || {}).hedgeTypes || [])) h[x.label] = (h[x.label] || 0) + x.n;
    const areas = {}; for (const s of reps) for (const n of (s.notes || [])) if (n.area) areas[n.area] = (areas[n.area] || 0) + 1;
    const hsiaFull = reps.filter((s) => s.hsia && s.hsia.headline && s.hsia.structure && s.hsia.implication && s.hsia.action).length;
    const fixes = reps.flatMap((s) => ((s.coach || {}).fixes || []).map((x) => `${x.area || ''} ${x.issue}`)).filter(Boolean);
    const meetings = Store.logs.filter((l) => l.kind === 'meeting' && l.ts >= from && l.ts < to).map((l) => ({ type: l.type, overall: l.scores && l.scores.overall, adjustment: l.adjustment }));
    return { reps: reps.length, spars: ss.filter((s) => s.kind === 'spar').length, games: ss.filter((s) => s.kind === 'game' || s.kind === 'hsia').length, quests: ss.filter((s) => s.kind === 'quest').length, days: new Set(ss.map((s) => s.date)).size, avg: sc.length ? Math.round(sc.reduce((a, b) => a + b, 0) / sc.length) : null, dims, hedges: h, areaFlags: areas, fullHouseReps: hsiaFull, fixes: fixes.slice(0, 12), meetings };
  };
  const a = block(now - wk, now + 1), b = block(now - 2 * wk, now - wk);
  return { a, b, text: `Current objective: ${Store.profile.objective}\nLAST 7 DAYS: ${JSON.stringify(a)}\nPREVIOUS 7 DAYS: ${JSON.stringify(b)}` };
}

/* ---------------- Export / import ---------------- */
function sessionsCsv() {
  const cols = ['date', 'kind', 'title', 'attempt', 'source', 'durationSec', 'overall'].concat(C.DIMENSIONS.map((d) => d.id), ['headline', 'structure', 'implication', 'action', 'exec_phrases', 'words', 'wpm', 'fillers', 'hedges', 'xp', 'coach_headline']);
  const q = (v) => { const s = v == null ? '' : String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const d10 = (v) => (v == null ? '' : (v / 10).toFixed(1));
  const all = Store.sessions.concat(Store.logs.map((l) => Object.assign({}, l, { kind: 'meeting' })));
  const rows = all.map((s) => { const sc = s.kind === 'meeting' ? Object.assign({ overall: s.scores && s.scores.overall }, (s.scores || {}).dims || {}) : G.scores(s), m = s.metrics || {}, h = s.hsia || {}; return [s.date, s.kind, s.title, s.attempt || '', s.source || '', s.durationSec || '', d10(sc.overall)].concat(C.DIMENSIONS.map((d) => d10(sc[d.id])), [h.headline ? 1 : '', h.structure ? 1 : '', h.implication ? 1 : '', h.action ? 1 : '', (s.execPhrases || []).join(' '), m.words, m.wpm, m.fillers, m.hedges, G.xpOf(s), (s.coach && s.coach.headline) || s.assessment || '']).map(q).join(','); });
  return [cols.join(',')].concat(rows).join('\n');
}
async function exportData(fmt) {
  const data = fmt === 'csv' ? sessionsCsv() : JSON.stringify(Store.exportAll(), null, 2);
  const filename = `green-room-${fmt === 'csv' ? 'sessions' : 'backup'}-${dkey()}.${fmt}`;
  let dl = null;
  try { if (window.claude && window.claude.use) dl = await window.claude.use('downloads'); } catch (e) { dl = null; }
  if (dl) {
    try { await dl.save({ filename, data }); toast('Saved'); return; }
    catch (e) { if (e && e.code === 'declined') return; if (e && e.code === 'rate_limited') { toast('A save is already open. Try again in a moment.'); return; } }
  }
  Sheet.open('export', { data });
}

/* ---------------- Plan & navigation helpers ---------------- */
function openPlanItem(kind, id) {
  if (kind === 'drill') return openDrill(id);
  if (kind === 'scenario') return openRep(scenarioSpec(id));
  if (kind === 'spar') return openSpar(id);
  if (kind === 'teachback') return openRep(teachbackSpec(C.DX.find((x) => x[0] === id)));
  if (kind === 'impromptu') return openRep(impromptuSpec(id));
  if (kind === 'review') { S.tool = null; return Sheet.open('review'); }
  if (kind === 'meeting' || kind === 'log') { S.tool = null; return Sheet.open('meeting'); }
  if (kind === 'game') return openEoa();
  if (kind === 'hsia') return openHsia(id);
  if (kind === 'boss') return openSpar(id, { boss: true });
}
function go(route) {
  if (!ROUTES.includes(route)) route = 'today';
  if (location.hash !== '#' + route) { try { location.hash = route; } catch (e) { /* ignore */ } }
  S.route = route; S.pendingRender = false;
  const ae = document.activeElement; if (ae && ae.blur) ae.blur();
  renderView(); window.scrollTo(0, 0);
}

/* ---------------- Boot ---------------- */
function boot() {
  $('#brandMark').innerHTML = BRAND_SVG;
  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-act]');
    if (!t || t.tagName === 'INPUT') return;
    const fn = ACT[t.dataset.act];
    if (fn) { e.preventDefault(); fn(t, e); }
  });
  document.addEventListener('change', (e) => {
    const t = e.target;
    if (t.dataset.pf || t.dataset.plan || t.dataset.set) S.deferRender = true; // let a tap that caused this blur finish first
    if (t.dataset.actChange && CHANGE[t.dataset.actChange]) return CHANGE[t.dataset.actChange](t);
    if (t.dataset.pf) return Store.saveProfile({ [t.dataset.pf]: t.value.trim() });
    if (t.dataset.plan) {
      const v = A.clamp(Number(t.value) || 0, 1, 10); const pl = G.plan(); const cur = Object.assign({}, Store.profile.plan || {});
      if (t.dataset.plan === 'overall') cur.overall = Object.assign({}, pl.overall, { [t.dataset.dim]: v });
      else cur[t.dataset.plan] = Object.assign({}, pl[t.dataset.plan], { [t.dataset.dim]: v });
      Store.saveProfile({ plan: cur }); toast('Plan saved'); return;
    }
    if (t.dataset.set) {
      const k = t.dataset.set, s = Object.assign({}, Store.profile.settings);
      if (k === 'pace') { const [a, b] = t.value.split('-').map(Number); s.paceLo = a; s.paceHi = b; }
      else if (k === 'autoCoach' || k === 'voice' || k === 'sound') s[k] = t.checked;
      else if (k === 'customFillers') s.customFillers = t.value.split(',').map((x) => x.trim()).filter(Boolean).slice(0, 20);
      else s[k] = Number(t.value);
      Store.saveProfile({ settings: s }); toast('Saved');
    }
  });
  document.addEventListener('input', (e) => {
    const t = e.target;
    if (t.dataset.sc) { const b = $('#scv-' + t.dataset.sc); if (b) b.textContent = t.value; if (S.tool && S.tool.sc) S.tool.sc[t.dataset.sc] = Number(t.value); }
    if (t.dataset.rate) { const b = $('#rv-' + t.dataset.rate); if (b) b.textContent = f1(t.value); }
  });
  document.addEventListener('focusout', () => { setTimeout(() => { const ae = document.activeElement; if (S.pendingRender && !($('#view').contains(ae) && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName))) renderView(); }, 50); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !$('#celebrate').hidden) return Celebrate.next();
    if (e.key === 'Escape' && S.sheet && !Rec.active) Sheet.close();
    if (S.sheet && S.sheet.type === 'eoa' && S.game && S.game.step === 'play' && !S.game.answered && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) eoaAnswer(e.key === 'ArrowRight');
  });
  window.addEventListener('scroll', () => { const tb = $('.topbar'); if (tb) tb.classList.toggle('scrolled', window.scrollY > 4); }, { passive: true });
  window.addEventListener('hashchange', () => { const r = location.hash.slice(1); if (ROUTES.includes(r) && r !== S.route) { S.route = r; renderView(); } });
  const h = location.hash.slice(1); S.route = ROUTES.includes(h) ? h : 'today';
  Store.on((what) => {
    if (what === 'profile' || what === 'all') A.setCustomFillers(Store.profile.settings.customFillers);
    renderView();
    if (what !== 'profile') G.check();
  });
  AI.on(() => { renderView(); if (S.sheet && ['spar', 'prep', 'sharpen', 'visual', 'plan', 'review', 'meeting'].includes(S.sheet.type) && !(S.tool && S.tool.busy) && !(S.spar && S.spar.step !== 'setup')) Sheet.render(true); });
  Store.init();
  AI.init();
  if (window.speechSynthesis) { try { speechSynthesis.getVoices(); } catch (e) { /* ignore */ } }
}
boot();

</script>
