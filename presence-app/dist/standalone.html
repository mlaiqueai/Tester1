<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Green Room</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A personal executive presence and articulation coach: practice reps, AI feedback, sparring and progress tracking.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600;6..96,700&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-column app shell (max 760px) with a sticky top bar, a bottom tab bar on phones
   (top tabs on wide screens), and full-screen sheets for focused practice flows.
   Identity: banker's-lamp green and brass; a VU-meter dial is the signature element. */
:root {
  --bg: #F1F4F1;
  --surface: #FFFFFF;
  --surface-2: #E8EDE9;
  --ink: #14211B;
  --muted: #56645D;
  --line: #D5DED8;
  --deep: #163D2D;
  --deep-2: #1F4D3A;
  --on-deep: #EAF2EC;
  --on-deep-muted: #A9C2B4;
  --brass: #86621F;
  --brass-bright: #C79A3C;
  --brass-soft: #F2E8D3;
  --on-brass: #FFFFFF;
  --good: #2C7A4B;
  --warn: #A85507;
  --bad: #B42318;
  --good-soft: rgba(44, 122, 75, 0.14);
  --warn-soft: rgba(168, 85, 7, 0.15);
  --bad-soft: rgba(180, 35, 24, 0.13);
  --shadow: 0 1px 2px rgba(20, 33, 27, 0.05), 0 6px 20px rgba(20, 33, 27, 0.06);
  --scrim: rgba(12, 22, 17, 0.45);
  --font-display: "Bodoni Moda", "Bodoni 72", Didot, "Big Caslon", Georgia, serif;
  --font-body: "Instrument Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 16px;
  --r-sm: 10px;
  --tabbar-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B120F; --surface: #121C17; --surface-2: #1A2720; --ink: #E5EDE8; --muted: #97A79E; --line: #25352D;
    --deep: #0F2A1F; --deep-2: #163829; --on-deep: #E5EFE8; --on-deep-muted: #8FB09E;
    --brass: #DDB868; --brass-bright: #E9C77A; --brass-soft: #3A3020; --on-brass: #1B1406;
    --good: #5FC28C; --warn: #F0A64A; --bad: #FF8B7B;
    --good-soft: rgba(95, 194, 140, 0.16); --warn-soft: rgba(240, 166, 74, 0.16); --bad-soft: rgba(255, 139, 123, 0.15);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.25); --scrim: rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B120F; --surface: #121C17; --surface-2: #1A2720; --ink: #E5EDE8; --muted: #97A79E; --line: #25352D;
  --deep: #0F2A1F; --deep-2: #163829; --on-deep: #E5EFE8; --on-deep-muted: #8FB09E;
  --brass: #DDB868; --brass-bright: #E9C77A; --brass-soft: #3A3020; --on-brass: #1B1406;
  --good: #5FC28C; --warn: #F0A64A; --bad: #FF8B7B;
  --good-soft: rgba(95, 194, 140, 0.16); --warn-soft: rgba(240, 166, 74, 0.16); --bad-soft: rgba(255, 139, 123, 0.15);
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.25); --scrim: rgba(0, 0, 0, 0.6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--brass); }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Shell ---------- */
.wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid transparent; }
.topbar.scrolled { border-bottom-color: var(--line); }
.topbar .wrap { display: flex; align-items: center; gap: 12px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 9px; font-family: var(--font-display); font-weight: 700; font-size: 21px; letter-spacing: -0.01em; color: var(--ink); background: none; border: 0; padding: 0; }
.brand svg { width: 26px; height: 26px; }
.topbar .spacer { flex: 1; }
.status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); display: inline-block; }
.status-dot.cloud { background: var(--good); }
.status-dot.syncing { background: var(--warn); }
.chip-streak { display: inline-flex; align-items: center; gap: 5px; height: 32px; padding: 0 11px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); font-family: var(--font-mono); font-size: 13px; font-weight: 500; }
.chip-streak svg { width: 15px; height: 15px; color: var(--brass); }
.avatar { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--deep); color: var(--on-deep); font-weight: 600; font-size: 14px; display: grid; place-items: center; }
.tabs-top { display: none; }
main#view { padding-bottom: calc(var(--tabbar-h) + 28px + env(safe-area-inset-bottom, 0px)); }
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
  background: color-mix(in srgb, var(--surface) 94%, transparent);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
}
.tabbar .inner { max-width: 760px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); height: var(--tabbar-h); }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; background: none; border: 0; color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: 0.02em; }
.tab svg { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--ink); }
.tab[aria-current="page"] svg { color: var(--brass); }
@media (min-width: 900px) {
  .tabbar { display: none; }
  .tabs-top { display: flex; gap: 4px; }
  .tabs-top .tab { flex-direction: row; gap: 7px; font-size: 14px; padding: 7px 12px; border-radius: 99px; }
  .tabs-top .tab svg { width: 18px; height: 18px; }
  .tabs-top .tab[aria-current="page"] { background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
  main#view { padding-bottom: 48px; }
}

/* ---------- Type ---------- */
.eyebrow { font-size: 11.5px; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }
.h1 { font-family: var(--font-display); font-weight: 600; font-size: clamp(27px, 7vw, 34px); line-height: 1.12; letter-spacing: -0.01em; }
.h2 { font-family: var(--font-display); font-weight: 600; font-size: 22px; line-height: 1.2; }
.h3 { font-size: 16px; font-weight: 600; line-height: 1.3; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.num { font-variant-numeric: tabular-nums; }
.prose p + p { margin-top: 10px; }
.prose { max-width: 62ch; }

/* ---------- Sections & cards ---------- */
.page { display: flex; flex-direction: column; gap: 22px; padding-top: 6px; }
.section { display: flex; flex-direction: column; gap: 12px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.card.pad-lg { padding: 20px; }
.card.flat { box-shadow: none; }
.card.raised { box-shadow: var(--shadow); }
.stack { display: flex; flex-direction: column; gap: 10px; }
.stack-lg { display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.row.nowrap { flex-wrap: nowrap; }
.row.between { justify-content: space-between; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 420px) { .grid3.collapse { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.divider { height: 1px; background: var(--line); border: 0; margin: 4px 0; }

/* Hero band (Today) */
.hero { background: var(--deep); color: var(--on-deep); border-radius: 22px; padding: 18px 18px 16px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; position: relative; overflow: hidden; }
.hero .greet { font-family: var(--font-display); font-size: 25px; font-weight: 600; line-height: 1.15; }
.hero .sub { color: var(--on-deep-muted); font-size: 13.5px; }
.hero-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 6px; }
.hero-stat { border-top: 1px solid color-mix(in srgb, var(--on-deep) 18%, transparent); padding-top: 8px; }
.hero-stat .v { font-family: var(--font-display); font-size: 24px; font-weight: 600; line-height: 1.1; font-variant-numeric: lining-nums tabular-nums; }
.hero-stat .k { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--on-deep-muted); font-weight: 600; }
.hero .gauge-wrap { display: flex; justify-content: center; margin: 2px auto 0; width: 100%; max-width: 330px; }

/* VU gauge */
.gauge { width: 100%; height: auto; display: block; }
.gauge .face { fill: var(--surface-2); }
.gauge .tick { stroke: var(--muted); }
.gauge .tick.major { stroke: var(--ink); }
.gauge .lbl { fill: var(--muted); font-family: var(--font-mono); font-size: 9px; }
.gauge .arc { fill: none; stroke: var(--line); stroke-width: 2; }
.gauge .zone-good { fill: none; stroke: var(--brass-bright); stroke-width: 5; }
.gauge .zone-mid { fill: none; stroke: var(--muted); stroke-width: 5; opacity: 0.35; }
.gauge .needle { stroke: var(--bad); stroke-width: 2.2; stroke-linecap: round; }
.gauge .pivot { fill: var(--ink); }
.gauge .score { fill: var(--ink); font-family: var(--font-display); font-weight: 700; font-size: 38px; }
.gauge .score.empty { font-family: var(--font-body); font-size: 15px; font-weight: 600; }
.gauge .cap { fill: var(--muted); font-family: var(--font-body); font-size: 9.5px; letter-spacing: 0.14em; font-weight: 600; }
.gauge.on-deep .face { fill: color-mix(in srgb, var(--on-deep) 7%, transparent); }
.gauge.on-deep .tick, .gauge.on-deep .lbl { stroke: var(--on-deep-muted); fill: var(--on-deep-muted); }
.gauge.on-deep .tick.major { stroke: var(--on-deep); }
.gauge.on-deep .lbl { stroke: none; }
.gauge.on-deep .arc { stroke: color-mix(in srgb, var(--on-deep) 25%, transparent); }
.gauge.on-deep .zone-mid { stroke: var(--on-deep-muted); }
.gauge.on-deep .needle { stroke: var(--brass-bright); }
.gauge.on-deep .pivot, .gauge.on-deep .score { fill: var(--on-deep); }
.gauge.on-deep .cap { fill: var(--on-deep-muted); }
.gauge .needle-g { transition: transform 1s cubic-bezier(.2, .9, .25, 1.15); }
@media (prefers-reduced-motion: reduce) { .gauge .needle-g { transition: none; } }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 12px; border: 1px solid transparent; font-weight: 600; font-size: 15px; background: var(--brass); color: var(--on-brass); text-decoration: none; white-space: nowrap; }
.btn svg { width: 18px; height: 18px; }
.btn:disabled { opacity: 0.5; cursor: default; }
.btn.secondary { background: var(--surface); color: var(--ink); border-color: var(--line); }
.btn.ghost { background: transparent; color: var(--ink); border-color: transparent; padding: 0 10px; }
.btn.deep { background: var(--deep); color: var(--on-deep); }
.btn.danger { background: var(--surface); color: var(--bad); border-color: var(--line); }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: 14px; border-radius: 10px; }
.btn.block { width: 100%; }
.btn.on-deep { background: var(--brass-bright); color: #1B1406; }
.icon-btn { width: 40px; height: 40px; display: inline-grid; place-items: center; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); flex: none; }
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn.plain { border-color: transparent; background: transparent; }
.link { background: none; border: 0; padding: 0; color: var(--brass); font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 5px; }
.link svg { width: 15px; height: 15px; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.actions > .btn { flex: 1 1 140px; }

/* Plan items / list rows */
.plan { display: flex; flex-direction: column; gap: 10px; }
.plan-item { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 12px 12px 12px; text-align: left; width: 100%; }
.plan-item .ic { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--surface-2); color: var(--deep); }
.plan-item .ic svg { width: 22px; height: 22px; }
:root[data-theme="dark"] .plan-item .ic { color: var(--brass); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .plan-item .ic { color: var(--brass); } }
.plan-item .t { font-weight: 600; line-height: 1.3; }
.plan-item .d { color: var(--muted); font-size: 13px; line-height: 1.35; margin-top: 2px; }
.plan-item .meta { font-family: var(--font-mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
.plan-item.done .ic { background: var(--good-soft); color: var(--good); }
.plan-item.done .t { color: var(--muted); }
.list { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.list-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 13px 14px; background: none; border: 0; border-top: 1px solid var(--line); text-align: left; width: 100%; color: inherit; }
.list-row:first-child { border-top: 0; }
.list-row .t { font-weight: 600; line-height: 1.3; }
.list-row .d { color: var(--muted); font-size: 13px; line-height: 1.35; margin-top: 1px; }
.list-row .chev { color: var(--muted); width: 18px; height: 18px; }
.list-row.has-ic { grid-template-columns: 36px minmax(0, 1fr) auto; }
.list-row .ic { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--surface-2); color: var(--brass); }
.list-row .ic svg { width: 19px; height: 19px; }

/* Chips & pills */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); font-size: 13.5px; font-weight: 500; color: var(--ink); }
.chip.on { background: var(--deep); color: var(--on-deep); border-color: var(--deep); }
.chip .x { opacity: 0.7; }
button.chip { cursor: pointer; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 99px; font-size: 12px; font-weight: 600; font-family: var(--font-mono); white-space: nowrap; background: var(--surface-2); color: var(--ink); }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.brass { background: var(--brass-soft); color: var(--brass); }

/* Segmented control */
.seg { display: inline-flex; background: var(--surface-2); border-radius: 12px; padding: 3px; gap: 2px; max-width: 100%; overflow-x: auto; }
.seg button { border: 0; background: transparent; padding: 7px 12px; border-radius: 9px; font-size: 13.5px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08); }
.seg.full { display: flex; }
.seg.full button { flex: 1; }

/* Forms */
label.field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
.input, textarea.input, select.input { width: 100%; min-height: 44px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 16px; font-weight: 400; line-height: 1.45; }
textarea.input { resize: vertical; min-height: 110px; }
textarea.input.tall { min-height: 200px; }
.input:focus { outline: 2px solid var(--brass); outline-offset: 0; border-color: transparent; }
.check { display: flex; align-items: center; gap: 10px; font-size: 15px; }
.check input { width: 20px; height: 20px; accent-color: var(--brass); }
.range-row { display: grid; grid-template-columns: minmax(0, 1fr) 120px; align-items: center; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); }
.range-row:first-child { border-top: 0; }
.range-row input[type="range"] { width: 100%; accent-color: var(--brass); }
.dots5 { display: flex; gap: 4px; justify-content: flex-end; }
.dots5 button { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface); padding: 0; }
.dots5 button.on { background: var(--brass); border-color: var(--brass); }

/* Metrics */
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 11px; min-width: 0; }
.kpi .k { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi .v { font-family: var(--font-mono); font-size: 20px; font-weight: 500; font-variant-numeric: tabular-nums; line-height: 1.25; margin-top: 2px; }
.kpi .s { font-size: 11.5px; color: var(--muted); line-height: 1.3; }
.kpi.good .v { color: var(--good); } .kpi.warn .v { color: var(--warn); } .kpi.bad .v { color: var(--bad); }
.bars { display: flex; flex-direction: column; gap: 10px; }
.bar { display: grid; grid-template-columns: 118px minmax(0, 1fr) 34px; align-items: center; gap: 10px; font-size: 13.5px; }
.bar .track { display: block; height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; position: relative; }
.bar .fill { display: block; height: 100%; border-radius: 99px; background: var(--brass); transition: width 0.8s ease; }
.bar .fill.good { background: var(--good); } .bar .fill.warn { background: var(--warn); } .bar .fill.bad { background: var(--bad); }
.bar .val { font-family: var(--font-mono); font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; }
.delta { font-family: var(--font-mono); font-size: 12px; font-weight: 600; }
.delta.up { color: var(--good); } .delta.down { color: var(--bad); }

/* Transcript highlights */
.transcript { font-size: 15.5px; line-height: 1.7; white-space: pre-wrap; overflow-wrap: anywhere; }
mark.hl { color: inherit; border-radius: 4px; padding: 0 2px; }
mark.hl-filler { background: var(--bad-soft); box-shadow: inset 0 -2px 0 var(--bad); }
mark.hl-hedge { background: var(--warn-soft); box-shadow: inset 0 -2px 0 var(--warn); }
mark.hl-power { background: var(--good-soft); box-shadow: inset 0 -2px 0 var(--good); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

/* Coach card */
.coach { border-color: color-mix(in srgb, var(--brass) 45%, var(--line)); }
.coach-head { display: flex; align-items: center; gap: 10px; }
.coach-head .badge { width: 34px; height: 34px; border-radius: 10px; background: var(--brass-soft); color: var(--brass); display: grid; place-items: center; flex: none; }
.coach-head .badge svg { width: 18px; height: 18px; }
.coach .headline { font-family: var(--font-display); font-size: 20px; font-weight: 600; line-height: 1.25; }
.fix { border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 6px; }
.fix .issue { font-weight: 600; }
.quote { font-style: italic; color: var(--muted); border-left: 3px solid var(--bad); padding-left: 10px; overflow-wrap: anywhere; }
.better { border-left: 3px solid var(--good); padding-left: 10px; overflow-wrap: anywhere; }
.criteria { display: flex; flex-direction: column; gap: 6px; }
.crit { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; align-items: start; font-size: 14px; }
.crit svg { width: 18px; height: 18px; margin-top: 2px; }
.crit.yes svg { color: var(--good); } .crit.partly svg { color: var(--warn); } .crit.no svg { color: var(--bad); }
.thinking { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 14px; }
.dotpulse { display: inline-flex; gap: 4px; }
.dotpulse i { width: 6px; height: 6px; border-radius: 50%; background: var(--brass); animation: pulse 1.2s infinite ease-in-out; }
.dotpulse i:nth-child(2) { animation-delay: 0.15s; } .dotpulse i:nth-child(3) { animation-delay: 0.3s; }
@keyframes pulse { 0%, 80%, 100% { opacity: 0.25; transform: scale(0.8); } 40% { opacity: 1; transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { .dotpulse i { animation: none; opacity: 0.7; } }

/* Sheet (full-screen flow) */
.sheet { position: fixed; inset: 0; z-index: 40; background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet-bar { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line); }
.sheet-bar .wrap { display: flex; align-items: center; gap: 10px; padding-block: 8px; }
.sheet-bar .title { flex: 1; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sheet-body { padding-block: 18px 40px; }
@media (min-width: 900px) {
  .sheet { background: var(--scrim); padding: 32px 16px; }
  .sheet-panel { max-width: 760px; margin: 0 auto; background: var(--bg); border-radius: 20px; min-height: calc(100% - 0px); box-shadow: var(--shadow); overflow: clip; }
  .sheet-bar { border-radius: 20px 20px 0 0; }
}

/* Brief */
.brief-meta { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 6px 12px; font-size: 14.5px; }
.brief-meta dt { color: var(--muted); font-weight: 600; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; padding-top: 2px; }
.brief-meta dd { margin: 0; }
.prompt-box { background: var(--deep); color: var(--on-deep); border-radius: var(--r); padding: 16px 18px; font-family: var(--font-display); font-size: 21px; line-height: 1.3; font-weight: 600; }
.prompt-box .eyebrow { color: var(--on-deep-muted); font-family: var(--font-body); display: block; margin-bottom: 6px; }

/* Recorder */
.recorder { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 10px 0; }
.timer { font-family: var(--font-mono); font-size: 44px; font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; line-height: 1; }
.timer.over { color: var(--bad); }
.timer-sub { font-size: 13px; color: var(--muted); }
.rec-btn { width: 84px; height: 84px; border-radius: 50%; border: 4px solid var(--surface); box-shadow: 0 0 0 2px var(--bad), var(--shadow); background: var(--bad); color: #fff; display: grid; place-items: center; }
.rec-btn svg { width: 32px; height: 32px; }
.rec-btn.recording { animation: recpulse 1.6s infinite; border-radius: 26px; }
@keyframes recpulse { 0%, 100% { box-shadow: 0 0 0 2px var(--bad), 0 0 0 0 var(--bad-soft); } 50% { box-shadow: 0 0 0 2px var(--bad), 0 0 0 14px var(--bad-soft); } }
@media (prefers-reduced-motion: reduce) { .rec-btn.recording { animation: none; } }
.level { width: 100%; max-width: 420px; height: 64px; display: block; }
.live-text { width: 100%; min-height: 60px; font-size: 15px; color: var(--muted); }
.timebar { width: 100%; height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.timebar i { display: block; height: 100%; background: var(--brass); width: 0; transition: width 0.25s linear; }
.timebar i.over { background: var(--bad); }
.wave { width: 100%; height: 56px; display: block; }
.wave rect { fill: var(--brass); }
.dropzone { border: 1.5px dashed var(--line); border-radius: var(--r); padding: 20px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; background: var(--surface); }
.dropzone svg { width: 28px; height: 28px; color: var(--brass); }
.progress { width: 100%; height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--brass); width: 0; transition: width 0.2s; }
.note { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; color: var(--muted); background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }
.note svg { width: 18px; height: 18px; flex: none; margin-top: 1px; color: var(--brass); }
.note.warn { background: var(--warn-soft); color: var(--ink); }

/* Chat (spar) */
.chat { display: flex; flex-direction: column; gap: 12px; }
.bubble { max-width: 88%; padding: 11px 14px; border-radius: 16px; line-height: 1.45; overflow-wrap: anywhere; }
.bubble.them { background: var(--deep); color: var(--on-deep); border-bottom-left-radius: 6px; align-self: flex-start; font-size: 16px; }
.bubble.me { background: var(--surface); border: 1px solid var(--line); border-bottom-right-radius: 6px; align-self: flex-end; font-size: 15px; }
.bubble .who { display: block; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; margin-bottom: 3px; opacity: 0.75; }
.bubble .m { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.persona-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 380px) { .persona-grid { grid-template-columns: minmax(0, 1fr); } }
.persona { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 6px; color: inherit; min-width: 0; }
.persona .mono-mark { width: 38px; height: 38px; border-radius: 50%; background: var(--deep); color: var(--brass-bright); font-family: var(--font-display); font-weight: 700; font-size: 17px; display: grid; place-items: center; }
.persona .t { font-weight: 600; line-height: 1.25; }
.persona .d { color: var(--muted); font-size: 12.5px; line-height: 1.35; }
.persona.on { border-color: var(--brass); box-shadow: inset 0 0 0 1px var(--brass); }

/* Charts */
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart .grid line { stroke: var(--line); stroke-width: 1; }
.chart .axis { fill: var(--muted); font-family: var(--font-mono); font-size: 10px; }
.chart .line { fill: none; stroke: var(--brass); stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
.chart .line.avg { stroke: var(--ink); stroke-width: 1.5; stroke-dasharray: 4 4; opacity: 0.55; }
.chart .area { fill: var(--brass); opacity: 0.12; }
.chart .band { fill: var(--good); opacity: 0.1; }
.chart .dot { fill: var(--brass); }
.chart .dot.end { fill: var(--surface); stroke: var(--brass); stroke-width: 2.5; }
.chart .endlbl { fill: var(--ink); font-family: var(--font-mono); font-size: 11px; font-weight: 500; }
.chart .radar-grid { fill: none; stroke: var(--line); }
.chart .radar-now { fill: var(--brass); fill-opacity: 0.22; stroke: var(--brass); stroke-width: 2; }
.chart .radar-then { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 4 3; }
.chart .radar-lbl { fill: var(--ink); font-size: 11px; font-weight: 600; font-family: var(--font-body); }
.chart .radar-val { fill: var(--muted); font-size: 10px; font-family: var(--font-mono); }
.heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, auto); grid-auto-columns: minmax(0, 1fr); gap: 3px; }
.heat i { aspect-ratio: 1; border-radius: 3px; background: var(--surface-2); display: block; max-width: 100%; }
.heat i.l1 { background: color-mix(in srgb, var(--brass) 30%, var(--surface-2)); }
.heat i.l2 { background: color-mix(in srgb, var(--brass) 60%, var(--surface-2)); }
.heat i.l3 { background: var(--brass); }
.heat i.today { outline: 1.5px solid var(--ink); outline-offset: 1px; }
.chart-scroll { overflow-x: auto; }

/* Badges */
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
.badge-tile { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; padding: 12px 6px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); font-size: 12px; line-height: 1.25; }
.badge-tile svg { width: 34px; height: 34px; }
.badge-tile.locked { opacity: 0.45; }
.badge-tile.locked svg { filter: grayscale(1); }
.badge-tile .t { font-weight: 600; }

/* Drills */
.reader { font-family: var(--font-display); font-size: 25px; line-height: 1.5; font-weight: 500; }
.reader span { transition: color 0.12s; color: var(--muted); opacity: 0.55; }
.reader span.done { color: var(--ink); opacity: 1; }
.reader span.cur { color: var(--brass); opacity: 1; }
.breath { width: 220px; height: 220px; margin: 0 auto; position: relative; display: grid; place-items: center; }
.breath .sq { position: absolute; inset: 20px; border: 2px solid var(--line); border-radius: 18px; }
.breath .orb { width: 60px; height: 60px; border-radius: 50%; background: var(--brass); opacity: 0.85; transition: transform 4s linear; }
.breath .lbl { position: absolute; font-family: var(--font-display); font-size: 22px; font-weight: 600; }
.flash { font-family: var(--font-display); font-size: 24px; line-height: 1.3; font-weight: 600; min-height: 3em; }
.big-line { font-family: var(--font-display); font-size: 26px; line-height: 1.35; font-weight: 600; }
.step-dots { display: flex; gap: 6px; justify-content: center; }
.step-dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.step-dots i.on { background: var(--brass); }

/* Empty states, toasts */
.empty { text-align: center; padding: 26px 16px; display: flex; flex-direction: column; align-items: center; gap: 10px; color: var(--muted); }
.empty svg { width: 40px; height: 40px; color: var(--brass); }
.empty .t { color: var(--ink); font-weight: 600; }
.ghost-chart { opacity: 0.35; filter: saturate(0.4); }
.toast { position: fixed; left: 50%; bottom: calc(var(--tabbar-h) + 18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; font-weight: 500; z-index: 60; opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s; max-width: calc(100vw - 32px); text-align: center; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.xp-pop { color: var(--brass); font-family: var(--font-mono); font-weight: 600; }
details.fold { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
details.fold > summary { list-style: none; cursor: pointer; padding: 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; font-weight: 600; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary svg { width: 18px; height: 18px; color: var(--muted); transition: transform 0.2s; }
details.fold[open] > summary svg { transform: rotate(90deg); }
details.fold > .fold-body { padding: 0 14px 14px; }
.tag-row { display: flex; gap: 6px; flex-wrap: wrap; }
.cmp { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
.cmp .from { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--bad); }
.levelbar { height: 8px; border-radius: 99px; background: color-mix(in srgb, var(--on-deep) 18%, transparent); overflow: hidden; }
.levelbar i { display: block; height: 100%; background: var(--brass-bright); }

/* ===================== Plan & game layer ===================== */
.inline-ic { width: 14px; height: 14px; vertical-align: -2px; }
.chip-streak .mult { color: var(--brass); font-weight: 600; }
.gauge .mark-base { stroke: var(--muted); stroke-width: 2; stroke-dasharray: 2 2; }
.gauge .mark-target { stroke: var(--good); stroke-width: 2.4; }
.gauge .mark-lbl { fill: var(--muted); font-family: var(--font-mono); font-size: 9px; }
.gauge .ml-goal { fill: var(--good); }
.gauge.on-deep .ml-goal { fill: var(--brass-bright); }
.gauge.on-deep .mark-base { stroke: var(--on-deep-muted); }
.gauge.on-deep .mark-target { stroke: var(--brass-bright); }
.gauge.on-deep .mark-lbl { fill: var(--on-deep-muted); }
.bar .track .tk { position: absolute; top: -3px; bottom: -3px; width: 2px; margin-left: -1px; border-radius: 1px; }
.bar .track { overflow: visible; }
.bar .track .tk.base { background: var(--muted); opacity: 0.7; }
.bar .track .tk.goal { background: var(--good); }
.legend .tk-l { display: inline-block; width: 3px; height: 11px; border-radius: 1px; margin-right: 5px; vertical-align: -1px; }
.legend .tk-l.base { background: var(--muted); } .legend .tk-l.goal { background: var(--good); }
.chart .radar-target { fill: none; stroke: var(--good); stroke-width: 1.6; }

.stage-chip { justify-self: start; display: inline-flex; align-items: center; gap: 8px; border: 1px solid color-mix(in srgb, var(--on-deep) 22%, transparent); background: color-mix(in srgb, var(--on-deep) 6%, transparent); color: var(--on-deep); border-radius: 99px; padding: 5px 12px 5px 5px; font-size: 13px; font-weight: 600; max-width: 100%; }
.stage-chip .stage-n { background: var(--brass-bright); color: #1B1406; border-radius: 99px; padding: 2px 8px; font-size: 11.5px; letter-spacing: 0.04em; white-space: nowrap; }
.hs-mult { font-family: var(--font-mono); font-size: 13px; color: var(--brass-bright); margin-left: 4px; }
.promo { border-color: color-mix(in srgb, var(--brass) 50%, var(--line)); background: color-mix(in srgb, var(--brass-soft) 45%, var(--surface)); }
.area-badge { width: 40px; height: 40px; flex: none; border-radius: 12px; background: var(--deep); color: var(--brass-bright); font-family: var(--font-display); font-size: 22px; font-weight: 700; display: grid; place-items: center; }
.area-dot { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 6px; background: var(--deep); color: var(--brass-bright); font-size: 11px; font-weight: 700; flex: none; font-family: var(--font-mono); }
.crit .area-dot { margin-top: 1px; }
.pill.area { min-width: 22px; justify-content: center; }
.boss { background: linear-gradient(160deg, color-mix(in srgb, var(--deep) 10%, var(--surface)), var(--surface) 60%); border-color: color-mix(in srgb, var(--deep) 35%, var(--line)); }
.boss-mark { width: 48px; height: 48px; flex: none; border-radius: 50%; background: var(--deep); color: var(--brass-bright); font-family: var(--font-display); font-weight: 700; font-size: 22px; display: grid; place-items: center; box-shadow: 0 0 0 3px var(--brass-soft); }
.tile { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; color: inherit; min-width: 0; }
.tile-ic { width: 36px; height: 36px; border-radius: 10px; background: var(--brass-soft); color: var(--brass); display: grid; place-items: center; margin-bottom: 4px; }
.tile-ic svg { width: 19px; height: 19px; }
.tile .t { font-weight: 600; line-height: 1.25; }
.tile .d { color: var(--muted); font-size: 12.5px; font-family: var(--font-mono); }
.cycle { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.cycle-step { display: flex; flex-direction: column; gap: 3px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; color: inherit; min-width: 0; position: relative; }
.cycle-step .t { font-weight: 600; line-height: 1.25; }
.cycle-step .d { color: var(--muted); font-size: 12px; line-height: 1.3; }
.cycle-step:not(:last-child)::after { content: ""; position: absolute; right: -7px; top: 50%; width: 6px; height: 6px; border-top: 1.5px solid var(--muted); border-right: 1.5px solid var(--muted); transform: translateY(-50%) rotate(45deg); }
@media (max-width: 380px) { .cycle { grid-template-columns: minmax(0, 1fr); } .cycle-step::after { display: none; } }
.journey { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.journey .stage { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.journey .stage.now { border-color: var(--brass); box-shadow: inset 0 0 0 1px var(--brass); }
.journey .stage.next { opacity: 0.75; }
.stage-top { display: flex; align-items: center; gap: 8px; }
.stage-num { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); font-family: var(--font-display); font-weight: 700; flex: none; }
.stage.now .stage-num, .stage.past .stage-num { background: var(--deep); color: var(--brass-bright); }
.stage-name { font-weight: 600; font-size: 13.5px; line-height: 1.2; }
.journey .dots { display: flex; gap: 5px; }
.journey .dots i { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface); }
.journey .dots i.on { background: var(--brass); border-color: var(--brass); }
.journey .dots i.cur { box-shadow: 0 0 0 3px var(--brass-soft); }
@media (max-width: 520px) { .journey { grid-template-columns: minmax(0, 1fr); } }
.overall-row { display: grid; grid-template-columns: 1fr auto 1fr auto 1fr; align-items: end; text-align: center; gap: 6px; }
.overall-row .k { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.overall-row .v { font-family: var(--font-display); font-size: 30px; font-weight: 700; line-height: 1.1; font-variant-numeric: lining-nums; }
.overall-row .v.now { color: var(--brass); font-size: 38px; }
.overall-row .arrow { color: var(--muted); padding-bottom: 8px; }
.gapbar { height: 10px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.gapbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--brass), var(--good)); border-radius: 99px; }
.arsenal-mini { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 5px; }
.arsenal-mini span { aspect-ratio: 1; max-width: 100%; border-radius: 8px; background: var(--surface-2); color: var(--muted); display: grid; place-items: center; }
.arsenal-mini span svg { width: 60%; height: 60%; }
.arsenal-mini span.on { background: var(--deep); color: var(--brass-bright); }
.plan-table { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.plan-table .ph, .plan-table .pr { display: grid; grid-template-columns: minmax(0, 1fr) 74px 74px; gap: 8px; align-items: center; padding: 7px 10px; }
.plan-table .ph { background: var(--surface-2); font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.plan-table .pr { border-top: 1px solid var(--line); font-size: 14px; }
.plan-table .pr.total { font-weight: 700; background: color-mix(in srgb, var(--brass-soft) 40%, var(--surface)); }
.input.sm-num { min-height: 36px; padding: 4px 8px; text-align: center; font-family: var(--font-mono); font-size: 15px; }
.ul { margin: 4px 0 0; padding-left: 18px; }
.ul li + li { margin-top: 2px; }
.objective-pick { text-align: left; color: inherit; width: 100%; }
.objective-pick.on { border-color: var(--brass); box-shadow: inset 0 0 0 1px var(--brass); }
.hsia-card .lights { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.light { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 4px; border-radius: 12px; background: var(--surface-2); }
.light .bulb { width: 22px; height: 22px; border-radius: 50%; background: color-mix(in srgb, var(--muted) 35%, var(--surface)); border: 2px solid var(--line); }
.light.on { background: var(--good-soft); }
.light.on .bulb { background: var(--good); border-color: color-mix(in srgb, var(--good) 60%, white); box-shadow: 0 0 12px var(--good); }
.light .ln { font-size: 12px; font-weight: 600; }
.xp-line { text-align: center; }
.eoa-card { position: relative; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--brass); border-radius: 18px; padding: 22px 20px; font-family: var(--font-display); font-size: 22px; line-height: 1.35; font-weight: 600; min-height: 150px; display: flex; align-items: center; transition: border-color 0.2s, background 0.2s; }
.eoa-card .q { position: absolute; left: 8px; top: 2px; font-size: 44px; color: var(--brass); line-height: 1; }
.eoa-card.ok { border-color: var(--good); background: var(--good-soft); }
.eoa-card.bad { border-color: var(--bad); background: var(--bad-soft); }
.eoa-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.eoa-btn { min-height: 64px; font-size: 17px; }
.big-score { font-family: var(--font-display); font-size: 64px; font-weight: 700; line-height: 1; font-variant-numeric: lining-nums; color: var(--brass); }
.hb-field { display: flex; flex-direction: column; gap: 8px; }
.hb-letter { width: 34px; height: 34px; border-radius: 10px; background: var(--deep); color: var(--brass-bright); font-family: var(--font-display); font-weight: 700; font-size: 18px; display: grid; place-items: center; flex: none; }
.hb-chk { color: var(--warn); }
.hb-chk.ok { color: var(--good); }
.quest.done { opacity: 0.85; border-color: color-mix(in srgb, var(--good) 40%, var(--line)); }
.phrase-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 380px) { .phrase-grid { grid-template-columns: minmax(0, 1fr); } }
.phrase { background: var(--surface); border: 1px dashed var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.phrase.on { border-style: solid; border-color: color-mix(in srgb, var(--brass) 50%, var(--line)); }
.phrase .ph-ic { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; background: var(--surface-2); color: var(--muted); }
.phrase.on .ph-ic { background: var(--deep); color: var(--brass-bright); }
.phrase .ph-ic svg { width: 15px; height: 15px; }

.phrase:not(.on) .ph-say { color: var(--muted); }
#celebrate { position: fixed; inset: 0; z-index: 70; background: var(--scrim); display: grid; place-items: center; padding: 24px max(16px, env(safe-area-inset-left, 0px)); }
#celebrate canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.cel-card { position: relative; background: var(--bg); border-radius: 24px; padding: 26px 22px 20px; width: min(380px, 100%); display: flex; flex-direction: column; align-items: center; gap: 10px; box-shadow: var(--shadow); animation: celpop 0.45s cubic-bezier(.2, .9, .25, 1.25); }
.cel-ring { width: 76px; height: 76px; border-radius: 50%; background: var(--deep); color: var(--brass-bright); display: grid; place-items: center; box-shadow: 0 0 0 6px var(--brass-soft); margin-bottom: 4px; }
.cel-ring svg { width: 36px; height: 36px; }
@keyframes celpop { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .cel-card { animation: none; } }

// The DX Daily log shows lesson E2 on 2026-11-05; episodes advance one lesson a day.
C.dxEstimate = function (date) {
  if (!C.DX.length) return null;
  const anchor = new Date('2026-11-05T12:00:00');
  const idx0 = C.DX.findIndex((x) => x[0] === 'E2');
  const days = Math.round((date - anchor) / 86400000);
  const n = C.DX.length;
  return C.DX[(((idx0 + days) % n) + n) % n];
};

   Green Room — analysis engine
   Text: fillers, hedges, power language, structure, concision.

const A = {};

A.clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
A.round = (v, d = 0) => { const m = Math.pow(10, d); return Math.round(v * m) / m; };
const mean = (a) => (a.length ? a.reduce((s, x) => s + x, 0) / a.length : 0);
const pct = (sorted, p) => { if (!sorted.length) return 0; const i = A.clamp(Math.floor(p * (sorted.length - 1)), 0, sorted.length - 1); return sorted[i]; };
const median = (a) => { if (!a.length) return 0; const s = [...a].sort((x, y) => x - y); return pct(s, 0.5); };
const std = (a) => { if (a.length < 2) return 0; const m = mean(a); return Math.sqrt(mean(a.map((x) => (x - m) * (x - m)))); };

A.normalize = (t) => String(t || '')
  .replace(/[‘’ʼ]/g, "'")
  .replace(/[“”]/g, '"')
  .replace(/…/g, '...')
  .replace(/[ \t]+/g, ' ')
  .trim();

A.wordList = (t) => (t.split(/\s+/).filter((w) => /[A-Za-z0-9]/.test(w)));

// Pattern libraries. Each: [regex source, label]
const FILLERS = [

  ["\\byou know\\b(?!\\s+(?:what|how|that|the|why|who|when|where|if|this|him|her|them|it|about)\\b)", 'you know'],
  ["\\bI mean\\b(?!\\s+(?:it|that|to|what)\\b)", 'I mean'],
  ["(?:,\\s*like\\b(?!\\s+(?:this|that|a|an|the|to)\\b)|\\blike,|\\b(?:was|were|it's|and|but|just|so|be|is)\\s+like\\b(?!\\s+(?:this|that|to|a|an|the|it|him|her|them|me|us|you|we|i|crazy|before|when)\\b))", 'like'],
  ['\\b(?:basically|literally|actually|honestly|obviously|totally|seriously|essentially)\\b', 'basically / actually'],
  ['(?:^|[.!?]\\s+)(?:and\\s+)?(?:so|well|okay|ok|alright|right)\\b(?=[,\\s])', 'so / well'],
  ['\\bright\\?', 'right?'],
  ["\\b(?:and stuff(?: like that)?|or something(?: like that)?|or whatever|and all that|et cetera|and so on and so forth|blah blah)\\b", 'vague tail'],
  ['\\b(?:you see|if you will|at the end of the day)\\b', 'stock phrase'],
];
const HEDGES = [

  ["\\bI feel(?: like)?\\b", 'I feel'],
  ["\\bI guess\\b", 'I guess'],
  ["\\bI suppose\\b", 'I suppose'],
  ["\\b(?:I would say|I'd say)\\b", "I'd say"],
  ['\\bmaybe\\b', 'maybe'],
  ['\\bperhaps\\b', 'perhaps'],
  ['\\bprobably\\b', 'probably'],
  ['\\b(?:possibly|potentially)\\b', 'possibly'],
  ['\\bmight\\b', 'might'],
  ['\\b(?:kind of|kinda)\\b', 'kind of'],
  ['\\b(?:sort of|sorta)\\b', 'sort of'],
  ['\\b(?:a little bit|a little|a bit)\\b(?!\\s+(?:of\\s+)?(?:data|time|more|less))', 'a bit'],
  ['\\bjust\\b', 'just'],
  ['\\bhopefully\\b', 'hopefully'],
  ['\\b(?:try to|trying to|tried to)\\b', 'try to'],
  ["\\b(?:I'm not (?:sure|certain)|not sure)\\b", 'not sure'],
  ['\\b(?:does that|if that|that) makes? sense\\b', 'does that make sense'],
  ['\\b(?:sorry|apologies|I apologize)\\b', 'sorry'],
  ["\\bI (?:could|might) be wrong\\b", 'I could be wrong'],
  ['\\b(?:somewhat|fairly|pretty)\\b(?=\\s+[a-z])', 'pretty / fairly'],
  ['\\b(?:it seems|seems like|it looks like)\\b', 'it seems'],
  ['\\bI was wondering\\b', 'I was wondering'],
  ['\\bquick question\\b', 'quick question'],
  ["\\bI believe\\b", 'I believe'],
  ["\\bone thing I was (?:just )?thinking\\b", 'one thing I was thinking'],
  ["\\bI'm not sure (?:if|whether) (?:this|that) makes sense\\b", "I'm not sure this makes sense"],
  ["\\b(?:I don't want to overstep|let me think out loud)\\b", 'self-undercutting'],

const POWER = [
  ['\\b(?:I|we) recommend\\b|\\bmy recommendation\\b|\\bour recommendation\\b', 'recommend'],
  ['\\b(?:I|we) propose\\b', 'propose'],
  ["\\b(?:I|we)(?:'ve| have)? decided\\b|\\bthe decision is\\b|\\bmy decision\\b", 'decided'],
  ["\\b(?:we will|we'll|I will|I'll)\\b", 'will'],
  ["\\b(?:bottom line|the answer is|the short answer|my view is|my position|here's why|here is why)\\b", 'clear position'],
  ["\\b(?:I'm|I am|we're|we are) confident\\b", 'confident'],
  ['\\b(?:the data shows?|the evidence shows?|the numbers show)\\b', 'evidence'],
  ['\\b(?:because|therefore|which means)\\b', 'because'],
  ["\\b(?:I need|we need|I'm asking|we're asking|the ask is|I am asking|we are asking)\\b", 'ask'],
];
const SIGNPOSTS = /\b(?:first(?:ly)?|second(?:ly)?|third(?:ly)?|finally|lastly|(?:two|three|four) (?:things|reasons|points|risks|options|questions|priorities)|in summary|to summari[sz]e|to sum up|bottom line|net[- ]net|in short)\b/gi;
const IMPACT = /\b(?:revenue|margins?|costs?|savings|returns?|roi|irr|ebitda|payback|valuation|risks?|patients?|outcomes?|growth|market share|decision|approve|approval|budget|value|profit|cash|deadline|timeline|upside|downside|multiple|volume|coverage|reimbursement)\b/gi;
const NUMBERS = /(?:\$\s?\d[\d,.]*\s?(?:k|m|mm|b|bn|million|billion|thousand)?|\b\d[\d,.]*\s?(?:%|percent|x|bps|basis points|million|billion|thousand|k|m|months?|weeks?|days?|years?|quarters?)?(?![\w])|\b(?:one|two|three|four|five|six|seven|eight|nine|ten|twelve|fifteen|twenty|thirty|forty|fifty|sixty|hundred)(?:[- ]\w+)?\s+(?:percent|million|billion|thousand|times|basis points|months|weeks|years)\b)/gi;
const BLUF_POS = /\b(?:recommend|recommendation|propose|should|bottom line|the answer is|short answer|my view|our view|we need|I need|the ask|approve|decline|pass on|invest|in short|our thesis|my thesis|the issue is|here's the|here is the|I'm asking|we're asking|we will|we missed|missed|(?:below|above|behind|ahead of) (?:plan|target|budget|forecast)|we are (?:below|behind|ahead)|is (?:\d|yes|no)|yes\b|no\b)/i;
const BLUF_NEG = /\b(?:background|context|before I|let me (?:start|give|walk|begin)|to give you|as you (?:know|may know)|I wanted to (?:start|give)|so basically|first,? (?:some|a bit of|a little) (?:background|context)|thanks for having me|great question)\b/i;
const IMPLIC = /\b(?:which means|that means|this means|what this means|the (?:strategic )?implications?|matters because|this matters|so what|the impact (?:is|on)|as a result|therefore|the upside is|the downside is|the consequence|so we|that's why)\b/i;
const ACTION = /\b(?:next steps?|I recommend|my recommendation|we should|we need to|the decision (?:we need|in front|for us)|I'm asking|we're asking|I am asking|we are asking|I propose|let's|I will|I'll|we will|we'll|owns?|owner|by (?:monday|tuesday|wednesday|thursday|friday|next week|end of|the \d+|q[1-4])|approve|approval|sign off|reconvene|follow up)\b/i;
const RECOMMEND = /\b(?:I|we) recommend\b|\bmy recommendation\b|\bI propose\b|\bI(?:'d| would) prioriti[sz]e\b|\bmy (?:call|view) is\b|\bI(?:'d| would) (?:pass|invest|proceed|approve|partner|build|wait)\b|\bbottom line\b/i;
const recommends = (t) => {
  if (RECOMMEND.test(t)) return true;
  const re = /\b(\w+)\s+we should\b(?!\s+(?:consider|probably|maybe|think|look|explore))/gi; let m;
  while ((m = re.exec(t))) if (!/^(?:maybe|perhaps|probably|possibly|think)$/i.test(m[1])) return true;
  return /^we should\b(?!\s+(?:consider|probably|maybe|think|look|explore))/i.test(t);
};
const CHANGE_MIND = /\bwhat would change my mind\b|\bchange my (?:mind|view)\b|\bunless\b|\bif and only if\b/i;
const TRADEOFF = /\btrade-?offs?\b|\bversus\b|\bvs\.?\b|\binstead of\b|\bat the cost of\b|\bin exchange for\b|\brather than\b|\bthe cost of\b/i;
const OWNERSHIP = /\bI(?:'ll| will) own\b|\bI own\b|\bowns?\b|\bowner\b|\baccountab/i;
const FRAMING = /\bthe (?:fundamental|core|real|central|strategic) (?:issue|question|problem|point|choice)\b|\bthe question (?:is|in front of us)\b|\bwhat matters (?:here|most)\b|\bstrategic(?:ally)?\b|\bthe decision we need\b/i;
const MANY_POINTS = /\b(?:fourth(?:ly)?|fifth(?:ly)?|sixth|(?:four|five|six|seven|eight) (?:things|reasons|points|considerations|factors|risks|issues))\b/i;
const WEAK_END = /(?:so yeah|\byeah|that's (?:it|all|about it)|I guess|anyway|or something|does that make sense|if that makes sense|I don't know|you know|and stuff)\W*$/i;

function compile(list) { return list.map(([src, label]) => ({ re: new RegExp(src, 'gim'), label })); }
const RX = { fillers: compile(FILLERS), hedges: compile(HEDGES), power: compile(POWER) };

A.setCustomFillers = function (words) {
  const extra = (words || []).map((w) => String(w).trim()).filter(Boolean).slice(0, 20)
    .map((w) => [`\\b${w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\\b`, w.toLowerCase()]);
  RX.fillers = compile(FILLERS.concat(extra));
};

function findAll(text, list, kind) {
  const hits = [];
  for (const { re, label } of list) {
    re.lastIndex = 0;
    let m;
    while ((m = re.exec(text))) {
      let start = m.index, str = m[0];
      // trim leading punctuation/space from sentence-opener matches
      const lead = str.match(/^[.!?\s]+/);
      if (lead) { start += lead[0].length; str = str.slice(lead[0].length); }
      if (str.length) hits.push({ start, end: start + str.length, kind, label, text: str });
      if (m[0].length === 0) re.lastIndex++;
    }
  }
  return hits;
}

function countBy(hits) {
  const map = {};
  for (const h of hits) map[h.label] = (map[h.label] || 0) + 1;
  return Object.entries(map).sort((a, b) => b[1] - a[1]).map(([label, n]) => ({ label, n }));
}

function syllables(word) {
  const w = word.toLowerCase().replace(/[^a-z]/g, '');
  if (!w) return 0;
  if (w.length <= 3) return 1;
  const s = w.replace(/(?:[^laeiouy]es|ed|[^laeiouy]e)$/, '').replace(/^y/, '');
  const m = s.match(/[aeiouy]{1,2}/g);
  return Math.max(1, m ? m.length : 1);
}

A.sentences = function (text) {
  const parts = text.replace(/([.!?]+)(\s+|$)/g, '$1\n').split('\n').map((s) => s.trim()).filter((s) => /[A-Za-z0-9]/.test(s));
  return parts;
};

/**
 * Analyze a transcript.
 * opts: { durationSec, source: 'mic'|'dictation'|'typed'|'upload', timeLimit, paceLo, paceHi }
 */
A.analyzeText = function (raw, opts = {}) {
  const text = A.normalize(raw);
  const words = A.wordList(text);
  const n = words.length;
  const spoken = opts.source && opts.source !== 'typed';
  const durationSec = spoken && opts.durationSec ? opts.durationSec : null;
  const minutes = durationSec ? durationSec / 60 : null;

  const fillerHits = findAll(text, RX.fillers, 'filler');
  const hedgeHits = findAll(text, RX.hedges, 'hedge');
  const powerHits = findAll(text, RX.power, 'power');
