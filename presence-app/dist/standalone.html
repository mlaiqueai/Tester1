/* ---------------- Stats ---------------- */
const REP_KINDS = ['scenario', 'impromptu', 'teachback', 'custom', 'question', 'spar', 'concision'];
function sessionXp(s) {
  if (s.kind === 'spar') return 25 + 3 * ((s.convo || []).filter((t) => t.role === 'me').length);
  if (s.kind === 'drill') return 6;
  if (s.kind === 'visual') return 10;
  const sc = s.scores && s.scores.overall;
  return 10 + (sc ? Math.round(sc / 10) : 0) + (s.coach ? 5 : 0) + (s.attempt > 1 ? 3 : 0);
}
function computeStats() {
  const ss = Store.sessions, logs = Store.logs;
  const days = new Set(ss.map((s) => s.date).concat(logs.map((l) => l.date)));
  let streak = 0;
  const d = new Date();
  if (!days.has(dkey(d))) d.setDate(d.getDate() - 1);
  while (days.has(dkey(d))) { streak++; d.setDate(d.getDate() - 1); }
  let best = 0, run = 0, prev = null;
  for (const k of [...days].sort()) {
    const t = parseKey(k).getTime();
    run = prev != null && Math.round((t - prev) / 86400000) === 1 ? run + 1 : 1;
    best = Math.max(best, run); prev = t;
  }
  const reps = ss.filter((s) => REP_KINDS.includes(s.kind));
  const scored = reps.filter((s) => s.scores && s.scores.overall != null).slice().reverse(); // oldest first
  const now = new Date();
  const monday = new Date(now); monday.setHours(0, 0, 0, 0); monday.setDate(monday.getDate() - ((monday.getDay() + 6) % 7));
  const secs = (s) => s.durationSec || (s.kind === 'drill' ? (s.minutes || 2) * 60 : 0);
  const weekSec = ss.filter((s) => s.ts >= monday.getTime()).reduce((a, s) => a + secs(s), 0);
  const totalSec = ss.reduce((a, s) => a + secs(s), 0);
  const p = Store.profile || {};
  const xp = ss.reduce((a, s) => a + sessionXp(s), 0) + logs.length * 15 + Store.preps.length * 10 + Store.reviews.length * 10 + (p.lessonsRead || []).length * 4;
  let lvl = C.LEVELS[0], next = null;
  for (let i = 0; i < C.LEVELS.length; i++) if (xp >= C.LEVELS[i].xp) { lvl = C.LEVELS[i]; next = C.LEVELS[i + 1] || null; }
  const avgDims = (list) => {
    const out = {};
    for (const dm of C.DIMENSIONS) { const v = list.map((s) => s.scores && s.scores[dm.id]).filter((x) => x != null); out[dm.id] = v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; }
    const o = list.map((s) => s.scores.overall).filter((x) => x != null); out.overall = o.length ? o.reduce((a, b) => a + b, 0) / o.length : null;
    return out;
  };
  const last7 = scored.filter((s) => s.ts >= Date.now() - 7 * 86400000);
  return {
    days, streak, best, reps, scored, weekMin: Math.round(weekSec / 60), totalMin: Math.round(totalSec / 60), xp, level: lvl, next,
    recent: scored.length ? avgDims(scored.slice(-10)) : null,
    first: scored.length >= 12 ? avgDims(scored.slice(0, 10)) : null,
    week: last7.length ? avgDims(last7) : null,
    today: ss.filter((s) => s.date === dkey()),
  };
}
function earnedBadges(st) {
  const ss = Store.sessions, e = new Set();
  const reps = st.reps;
  if (reps.length) e.add('first');
  if (st.best >= 3) e.add('streak3'); if (st.best >= 7) e.add('streak7'); if (st.best >= 30) e.add('streak30');
  if (reps.filter((s) => s.metrics && s.metrics.bluf === true).length >= 5) e.add('bluf5');
  if (reps.some((s) => s.metrics && s.source !== 'typed' && (s.durationSec || 0) >= 60 && s.metrics.fillers === 0 && s.source !== 'dictation')) e.add('clean60');
  if (reps.some((s) => s.metrics && s.metrics.words >= 80 && s.metrics.hedges === 0)) e.add('nohedge');
  const p = Store.profile.settings;
  if (reps.filter((s) => s.metrics && s.metrics.wpm && s.metrics.wpm >= p.paceLo && s.metrics.wpm <= p.paceHi).length >= 5) e.add('pocket5');
  const spars = ss.filter((s) => s.kind === 'spar');
  if (spars.length >= 1) e.add('spar1'); if (spars.length >= 5) e.add('spar5');
  if (reps.some((s) => s.attempt > 1 && s.prevScore != null && s.scores && s.scores.overall - s.prevScore >= 10)) e.add('runback');
  if (reps.some((s) => s.scores && s.scores.overall >= 85)) e.add('score85');
  if (reps.length >= 25) e.add('reps25'); if (reps.length >= 100) e.add('reps100');
  if (Store.logs.length >= 5) e.add('field5');
  if (ss.some((s) => s.kind === 'visual')) e.add('camera');
  if (Store.preps.length >= 3) e.add('prep3');
  return e;
}

/* ---------------- Daily plan ---------------- */
const SKILL_WARMUP = { pauses: 'pause-ladder', fillers: 'pause-ladder', vocal_variety: 'inflection', enunciation: 'enunciation', pace: 'pace', concision: 'concision', hedging: 'swaps', ownership: 'swaps', precision: 'swaps', composure: 'breath', qa: 'breath', conviction: 'inflection' };
function focusOrder() {
  const p = Store.profile;
  const focus = (p.focus && p.focus.length ? p.focus : C.STARTER_FOCUS).slice();
  const st = computeStats();
  return focus.map((id, i) => {
    const r = p.ratings[id] || 3;
    const dim = C.SKILL_DIM[id];
    const recent = st.recent && st.recent[dim] != null ? st.recent[dim] : 70;
    const evPri = p.evaluation && p.evaluation.areas ? (p.evaluation.areas.find((a) => a.skill === id) || {}).priority : null;
    return { id, w: (6 - r) * 10 + (100 - recent) * 0.4 + (evPri ? (4 - evPri) * 6 : 0) - i };
  }).sort((a, b) => b.w - a.w).map((x) => x.id);
}
function dailyPlan(date = new Date()) {
  const seed = daySeed(date);
  const order = focusOrder();
  const target = order[seed % Math.max(1, Math.min(3, order.length))] || 'bluf';
  const warmId = SKILL_WARMUP[order[(seed + 1) % order.length]] || pick(C.WARMUPS, seed).id;
  const warm = C.WARMUPS.find((w) => w.id === warmId) || C.WARMUPS[0];
  let matches = C.SCENARIOS.filter((s) => s.focus.includes(target));
  if (!matches.length) matches = C.SCENARIOS;
  const scen = pick(matches, Math.floor(seed / 3) + seed);
  const dow = date.getDay();
  let stretch;
  if (dow === 2 || dow === 4) { const per = pick(C.PERSONAS.filter((x) => x.focus.some((f) => order.includes(f))).concat(C.PERSONAS), seed); stretch = { kind: 'spar', id: per.id, title: `Spar with ${per.name}`, desc: `${per.role}. Five live questions, then a debrief.`, icon: 'spar', meta: '8 min' }; }
  else if (dow === 3) { const dx = C.dxEstimate(date); stretch = dx ? { kind: 'teachback', id: dx[0], title: `Teach-back: ${dx[2]}`, desc: 'Explain today\'s DX Daily lesson to a non-expert board member in 60 seconds.', icon: 'grad', meta: '3 min' } : null; }
  else if (dow === 0) stretch = { kind: 'review', id: 'week', title: 'Weekly review', desc: 'See your patterns and set next week\'s focus.', icon: 'calendar', meta: '3 min' };
  else if (dow === 6) stretch = { kind: 'log', id: 'log', title: 'Log a real meeting', desc: 'Rate how you showed up this week and capture one lesson.', icon: 'notebook', meta: '3 min' };
  if (!stretch) { const q = pick(C.IMPROMPTU, seed); stretch = { kind: 'impromptu', id: String(C.IMPROMPTU.indexOf(q)), title: 'Impromptu: 60 seconds', desc: q, icon: 'bolt', meta: '2 min' }; }
  const items = [
    { kind: 'drill', id: warm.id, title: warm.name, desc: warm.why, icon: drillIcon(warm.id), meta: `${warm.minutes} min` },
    { kind: 'scenario', id: scen.id, title: scen.title, desc: `Focus: ${(C.skill(target) || {}).name || ''}. ${scen.audience}`, icon: 'mic', meta: `${scen.time}s rep` },
    stretch,
  ];
  const today = Store.sessions.filter((s) => s.date === dkey(date));
  for (const it of items) {
    if (it.kind === 'review') it.done = Store.reviews.some((r) => r.date === dkey(date));
    else if (it.kind === 'log') it.done = Store.logs.some((l) => l.date === dkey(date));
    else if (it.kind === 'spar') it.done = today.some((s) => s.kind === 'spar');
    else it.done = today.some((s) => s.kind === it.kind && String(s.refId) === String(it.id));
  }
  return { items, target, lesson: pick(C.LESSONS.filter((l) => order.slice(0, 3).some((id) => (C.skill(id) || {}).pillar === l.pillar)).concat(C.LESSONS), seed) };
}

/* ============================================================
   Green Room — sheets, recorder and the practice-rep flow

const SHEETS = {};
const cleanups = [];
function addCleanup(fn) { cleanups.push(fn); }
function runCleanups() { while (cleanups.length) { try { cleanups.pop()(); } catch (e) { /* ignore */ } } }

const Sheet = {
  open(type, data = {}) {
    runCleanups();
    S.sheet = Object.assign({ type }, data);
    const el = $('#sheet');
    el.hidden = false;
    document.body.style.overflow = 'hidden';
    this.render();
    el.scrollTop = 0;
  },
  close() {
    runCleanups();
    Rec.cancel();
    try { window.speechSynthesis && speechSynthesis.cancel(); } catch (e) { /* ignore */ }
    S.sheet = null; S.rep = null; S.spar = null; S.drill = null; S.tool = null;
    const el = $('#sheet');
    el.hidden = true; el.innerHTML = '';
    document.body.style.overflow = '';
    renderView();
  },
  render(keepScroll) {
    if (!S.sheet) return;
    const def = SHEETS[S.sheet.type];
    if (!def) return;
    const el = $('#sheet');
    const top = el.scrollTop;
    const out = def.render(S.sheet);
    el.innerHTML = `<div class="sheet-panel"><div class="sheet-bar"><div class="wrap">
      <button class="icon-btn plain" data-act="${out.back ? 'sheet-back' : 'sheet-close'}" aria-label="${out.back ? 'Back' : 'Close'}">${icon(out.back ? 'back' : 'close')}</button>
      <div class="title">${esc(out.title || '')}</div>${out.right || ''}</div></div>
      <div class="sheet-body wrap">${out.body}</div></div>`;
    if (keepScroll) el.scrollTop = top; else el.scrollTop = 0;
    animateGauges(el);
    if (def.mount) def.mount(S.sheet);
  },
};

/* ---------------- Live microphone recorder ---------------- */
const Rec = {
  active: false,
  async start({ onLevel, onText } = {}) {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) throw new Error('nomic');
    this.stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
    const types = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/aac'];
    const mime = types.find((t) => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) || '';
    this.rec = new MediaRecorder(this.stream, mime ? { mimeType: mime } : undefined);
    this.chunks = [];
    this.rec.ondataavailable = (e) => { if (e.data && e.data.size) this.chunks.push(e.data); };
    this.rec.start(500);
    this.an = null;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      if (this.ctx.resume) await this.ctx.resume();
      const src = this.ctx.createMediaStreamSource(this.stream);
      this.an = this.ctx.createAnalyser(); this.an.fftSize = 1024; src.connect(this.an);
    } catch (e) { this.an = null; }
    this.finalText = ''; this.interim = ''; this.sr = null;
    const SRC = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SRC) {
      try {
        const r = new SRC();
        r.continuous = true; r.interimResults = true; r.lang = navigator.language || 'en-US';
        r.onresult = (e) => {
          let interim = '';
          for (let i = e.resultIndex; i < e.results.length; i++) {
            const t = e.results[i][0].transcript;
            if (e.results[i].isFinal) this.finalText += (this.finalText ? ' ' : '') + t.trim(); else interim += t;
          }
          this.interim = interim;
          onText && onText(this.finalText, interim);
        };
        r.onerror = () => {};
        r.onend = () => { if (this.active) { try { r.start(); } catch (e) { /* ignore */ } } };
        r.start(); this.sr = r;
      } catch (e) { this.sr = null; }
    }
    this.active = true; this.t0 = performance.now();
    const buf = this.an ? new Uint8Array(this.an.fftSize) : null;
    const loop = () => {
      if (!this.active) return;
      if (this.an) { this.an.getByteTimeDomainData(buf); let s = 0; for (let i = 0; i < buf.length; i++) { const x = (buf[i] - 128) / 128; s += x * x; } onLevel && onLevel(Math.sqrt(s / buf.length)); }
      this.raf = requestAnimationFrame(loop);
    };
    loop();
    return { recognition: !!this.sr };
  },
  async stop() {
    if (!this.active) return null;
    this.active = false; cancelAnimationFrame(this.raf);
    const durationSec = (performance.now() - this.t0) / 1000;
    try { this.sr && this.sr.stop(); } catch (e) { /* ignore */ }

/* Dictation box tracker: timer starts at first words, ends at last words. */
function trackDictation(box, onTick) {
  const st = { t0: 0, last: 0, inserts: 0, chars: 0, pasted: false };
  box.addEventListener('input', (e) => {
    const now = performance.now();
    if (!st.t0 && box.value.trim()) st.t0 = now;
    if (st.t0) st.last = now;
    if (e.inputType === 'insertFromPaste') st.pasted = true;
    if (e.data) { st.inserts++; st.chars += e.data.length; }
    onTick && onTick(st);
  });
  box.addEventListener('paste', () => { st.pasted = true; });
  const iv = setInterval(() => onTick && onTick(st), 500);
  addCleanup(() => clearInterval(iv));
  st.stop = () => clearInterval(iv);
  st.seconds = () => (st.t0 ? (st.last - st.t0) / 1000 + 1.2 : 0);
  st.looksTyped = () => st.pasted || (st.inserts > 8 && st.chars / st.inserts < 2.2);
  return st;
}

    source, durationSec: durationSec ? Math.round(durationSec) : (au ? Math.round(au.activeSpan) : null),
    transcript: ta ? ta.text.slice(0, 20000) : '',
    metrics: ta ? { words: ta.words, wpm: sc.wpm, fillers: ta.fillers.total, fillersPerMin: ta.fillers.perMin, fillerTypes: ta.fillers.byType.slice(0, 6), hedges: ta.hedges.total, hedgesPer100: ta.hedges.per100, hedgeTypes: ta.hedges.byType.slice(0, 6), bluf: ta.bluf, numbers: ta.numbers, avgSentence: ta.avgSentence, weakEnd: ta.weakEnd, signposts: ta.signposts } : (au ? { words: 0, wpm: sc.wpm } : null),
    audio: au ? { activeSpan: au.activeSpan, estWpm: au.estWpm, pauses: au.pauses, pitch: { rangeSt: au.pitch.rangeSt, medianHz: au.pitch.medianHz }, upspeak: au.upspeak, volume: au.volume, wave: au.wave } : null,
    autoScores: { clarity: sc.clarity, concision: sc.concision, confidence: sc.confidence, delivery: sc.delivery, impact: sc.impact, overall: sc.overall },
    notes: sc.notes, attempt: r.attempt, prevId: r.prev ? r.prev.id : null, prevScore: r.prev && r.prev.scores ? r.prev.scores.overall : null,

function blendScores(auto, coach) {
  const out = {};
  for (const d of C.DIMENSIONS) {
    const a = auto ? auto[d.id] : null, c = coach ? Number(coach[d.id]) : NaN;
    if (coach && coach[d.id] != null && !isNaN(c)) out[d.id] = a != null ? Math.round(d.id === 'delivery' ? 0.5 * a + 0.5 * c : 0.3 * a + 0.7 * c) : Math.round(c);
    else if (a != null) out[d.id] = a;
  }
  const v = C.DIMENSIONS.map((d) => out[d.id]).filter((x) => x != null);
  out.overall = v.length ? Math.round(v.reduce((x, y) => x + y, 0) / v.length) : null;
  return out;
}

let coachCtl = null;
async function runCoach() {
  const r = S.rep;
  if (!r || !r.session || !AI.ready) return;
  r.coachState = 'loading'; Sheet.render(true);
  coachCtl = new AbortController();
  const sess = r.session;
  try {
    const prompt = AI.feedbackPrompt(Store.profile, r.spec, { transcript: sess.transcript, source: sess.source, metrics: Object.assign({ durationSec: sess.durationSec }, sess.metrics || {}), audio: r.au, attempt: r.attempt, prevScore: sess.prevScore, hasImages: !!(r.frames && r.frames.length) });

    if (r.frames && r.frames.length) opts.images = r.frames.map((f) => f.blob);
    const res = await AI.json(prompt, opts);
    if (!res || typeof res !== 'object') throw { code: 'invalid_json' };
    const coach = normalizeCoach(res);
    if (!S.rep || S.rep.session !== sess) return;
    sess.coach = coach;
    sess.scores = blendScores(sess.autoScores, coach.scores);
    r.session = Store.put('sessions', sess);
    r.coachState = 'done';
  } catch (e) {
    if (!S.rep) return;
    r.coachState = e && e.code === 'cancelled' ? 'idle' : 'error';
    r.coachErr = AI.errorText(e);
  }
  coachCtl = null;

}
function normalizeCoach(res) {
  const num = (v) => (v == null || v === '' || isNaN(Number(v)) ? null : A.clamp(Math.round(Number(v)), 0, 100));
  const sc = res.scores || {};
  const arr = (a) => (Array.isArray(a) ? a : []);
  return {
    headline: String(res.headline || ''),
    scores: { clarity: num(sc.clarity), concision: num(sc.concision), confidence: num(sc.confidence), delivery: num(sc.delivery), impact: num(sc.impact), composure: num(sc.composure) },
    criteria: arr(res.criteria).slice(0, 6).map((c) => ({ criterion: String(c.criterion || ''), met: String(c.met || 'no') })),
    strengths: arr(res.strengths).slice(0, 2).map(String),
    fixes: arr(res.fixes).slice(0, 3).map((f) => ({ issue: String(f.issue || ''), quote: String(f.quote || ''), why: String(f.why || ''), try: String(f.try || '') })),
    rewrite: String(res.rewrite || ''),
    next_rep: String(res.next_rep || ''),
    skills: arr(res.skills).filter((s) => C.skill(s.id)).slice(0, 5).map((s) => ({ id: s.id, rating: A.clamp(Number(s.rating) || 3, 1, 5) })),
  };
}

async function sparAsk() {
  const sp = S.spar;
  if (!sp) return;
  const answered = sp.convo.filter((t) => t.role === 'me').length;
  const isLast = answered >= sp.rounds;
  if (sp.offline) {
    if (isLast) return sparDebrief();
    const bank = C.QBANK[sp.persona.id] || C.QBANK['ic-chair'];
    const q = bank[answered % bank.length];
    sp.convo.push({ role: 'them', content: q }); Sheet.render(); speak(q); return;
  }
  sp.waiting = true; sp.err = ''; Sheet.render();
  const ctl = new AbortController(); addCleanup(() => ctl.abort());
  try {
    const rules = AI.sparRules(Store.profile, sp.persona, sp.ctx, sp.difficulty, sp.rounds);
    const res = await AI.text(AI.sparTurns(rules, sp.convo, isLast), { modelTier: 'quick', cache: false, signal: ctl.signal });
    if (!S.spar) return;
    let txt = String(res.text || '').trim();
    const ended = /\[END\]/.test(txt);
    txt = txt.replace(/\[END\]/g, '').trim();
    sp.waiting = false;
    if (txt) { sp.convo.push({ role: 'them', content: txt }); speak(txt); }
    if (ended || isLast) { Sheet.render(); setTimeout(() => S.spar && sparDebrief(), txt ? 1800 : 0); return; }
    Sheet.render();
  } catch (e) {
    if (!S.spar) return;
    sp.waiting = false;
    if (e && e.code === 'cancelled') return;
    if (AI.state === 'off') { sp.offline = true; sp.err = ''; toast('Switched to the offline question bank.'); return sparAsk(); }
    sp.err = AI.errorText(e); Sheet.render();
  }
}

  const typed = sp.dict && sp.dict.looksTyped();
  const secs = typed ? null : Math.round(sp.dict ? sp.dict.seconds() : 0) || null;
  const ta = A.analyzeText(txt, { source: typed ? 'typed' : 'dictation', durationSec: secs });

  let coach = null;

    transcript: all.slice(0, 20000),

  Sheet.render();
}

function runBreath(onDone, rounds = 4) {
  const phases = ['Breathe in', 'Hold', 'Breathe out', 'Hold'];
  let k = 0;
  const step = () => {
    const orb = $('#orb'), lbl = $('#breathLbl'), sub = $('#breathSub');
    if (!orb) return;
    if (k >= rounds * 4) { lbl.textContent = 'Done'; orb.style.transform = 'scale(1)'; onDone && onDone(); return; }
    const ph = k % 4;
    lbl.textContent = phases[ph];
    if (sub) sub.textContent = `Round ${Math.floor(k / 4) + 1} of ${rounds}`;
    orb.style.transform = ph === 0 ? 'scale(2.6)' : ph === 2 ? 'scale(1)' : orb.style.transform;
    k++;
  };
  step();
  const iv = setInterval(step, 4000);
  addCleanup(() => clearInterval(iv));
  return () => clearInterval(iv);
}
function drillSteps(d) {

  const st = steps[d.i];
  if (d.done) return finishBtn(d);
  return `<div class="step-dots">${steps.map((_, i) => `<i class="${i <= d.i ? 'on' : ''}"></i>`).join('')}</div>
    ${d.id === 'pregame' && d.i === 0 ? `<div class="breath"><div class="sq"></div><div class="orb" id="orb"></div><div class="lbl" id="breathLbl">Ready</div></div><p class="muted" style="text-align:center" id="breathSub"></p>` : ''}
    <div class="card stack" style="text-align:center"><div class="big-line">${esc(st.t)}</div><div class="timer" id="stepT" style="font-size:32px">${fmtSec(st.s)}</div></div>

}
function startSteps() {

function runPace() {

/* ---------------- Weekly review ---------------- */
function weekSummaryText() {
  const now = Date.now(), wk = 7 * 86400000;
  const block = (from, to) => {
    const ss = Store.sessions.filter((s) => s.ts >= from && s.ts < to);
    const reps = ss.filter((s) => REP_KINDS.includes(s.kind));
    const sc = reps.map((s) => s.scores && s.scores.overall).filter((x) => x != null);
    const dims = {}; for (const d of C.DIMENSIONS) { const v = reps.map((s) => s.scores && s.scores[d.id]).filter((x) => x != null); if (v.length) dims[d.id] = Math.round(v.reduce((a, b) => a + b, 0) / v.length); }
    const f = {}, h = {}; for (const s of reps) { for (const x of ((s.metrics || {}).fillerTypes || [])) f[x.label] = (f[x.label] || 0) + x.n; for (const x of ((s.metrics || {}).hedgeTypes || [])) h[x.label] = (h[x.label] || 0) + x.n; }
    const fixes = reps.flatMap((s) => ((s.coach || {}).fixes || []).map((x) => x.issue)).filter(Boolean);
    const logs = Store.logs.filter((l) => l.ts >= from && l.ts < to);
    return { reps: reps.length, drills: ss.filter((s) => s.kind === 'drill').length, spars: ss.filter((s) => s.kind === 'spar').length, days: new Set(ss.map((s) => s.date)).size, avg: sc.length ? Math.round(sc.reduce((a, b) => a + b, 0) / sc.length) : null, dims, fillers: f, hedges: h, fixes: fixes.slice(0, 12), logs: logs.map((l) => ({ title: l.title, stakes: l.stakes, r: l.r, change: l.change })) };
  };
  const a = block(now - wk, now + 1), b = block(now - 2 * wk, now - wk);
  return { a, b, text: `LAST 7 DAYS: ${JSON.stringify(a)}\nPREVIOUS 7 DAYS: ${JSON.stringify(b)}` };
}

async function evGo() {

  if (text.length < 40) { t.err = 'Paste a bit more: a paragraph or two at least.'; Sheet.render(true); return; }
  if (!AI.ready) {

    S.tool = null; toast('Saved. Now pick your focus areas.'); Sheet.open('focus'); return;
  }
  t.busy = true; Sheet.render(true);
  try {
    const res = await AI.json(AI.evaluationPrompt(Store.profile, text), { modelTier: 'default' });
    const arr = (a) => (Array.isArray(a) ? a : []);
    const areas = arr(res.areas).filter((a) => C.skill(a.skill)).map((a) => ({ skill: a.skill, priority: A.clamp(Number(a.priority) || 2, 1, 3), evidence: String(a.evidence || ''), target: String(a.target || '') })).sort((a, b) => a.priority - b.priority);
    const ratings = {}; for (const [k, v] of Object.entries(res.ratings || {})) if (C.skill(k)) ratings[k] = A.clamp(Math.round(Number(v) || 3), 1, 5);
    t.res = { summary: String(res.summary || ''), strengths: arr(res.strengths).slice(0, 5).map(String), areas, ratings, behaviors: arr(res.behaviors).slice(0, 3).map(String), plan: arr(res.plan).slice(0, 4).map((w, i) => ({ week: w.week || i + 1, theme: String(w.theme || ''), commitments: arr(w.commitments).slice(0, 4).map(String) })) };
    t.sel = areas.slice(0, 6).map((a) => a.skill);

}

/* ---------------- Export / import ---------------- */
function sessionsCsv() {
  const cols = ['date', 'kind', 'title', 'attempt', 'source', 'durationSec', 'overall', 'clarity', 'concision', 'confidence', 'delivery', 'impact', 'composure', 'words', 'wpm', 'fillers', 'hedges', 'bluf', 'numbers', 'coach_headline'];
  const q = (v) => { const s = v == null ? '' : String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const rows = Store.sessions.map((s) => { const sc = s.scores || {}, m = s.metrics || {}; return [s.date, s.kind, s.title, s.attempt || '', s.source || '', s.durationSec || '', sc.overall, sc.clarity, sc.concision, sc.confidence, sc.delivery, sc.impact, sc.composure, m.words, m.wpm, m.fillers, m.hedges, m.bluf, m.numbers, s.coach && s.coach.headline].map(q).join(','); });
  return [cols.join(',')].concat(rows).join('\n');
}
async function exportData(fmt) {
  const data = fmt === 'csv' ? sessionsCsv() : JSON.stringify(Store.exportAll(), null, 2);
  const filename = `green-room-${fmt === 'csv' ? 'sessions' : 'backup'}-${dkey()}.${fmt}`;
  let dl = null;
  try { if (window.claude && window.claude.use) dl = await window.claude.use('downloads'); } catch (e) { dl = null; }
  if (dl) {
    try { await dl.save({ filename, data }); toast('Saved'); return; }
    catch (e) { if (e && e.code === 'declined') return; if (e && e.code === 'rate_limited') { toast('A save is already open. Try again in a moment.'); return; } }
  }
  Sheet.open('export', { data });
}

/* ---------------- Plan & navigation helpers ---------------- */
function openPlanItem(kind, id) {
  if (kind === 'drill') return openDrill(id);
  if (kind === 'scenario') return openRep(scenarioSpec(id));
  if (kind === 'spar') return openSpar(id);
  if (kind === 'teachback') return openRep(teachbackSpec(C.DX.find((x) => x[0] === id)));
  if (kind === 'impromptu') return openRep(impromptuSpec(id));
  if (kind === 'review') return Sheet.open('review');

}
function go(route) {
  if (!ROUTES.includes(route)) route = 'today';
  if (location.hash !== '#' + route) { try { location.hash = route; } catch (e) { /* ignore */ } }
  S.route = route; S.pendingRender = false;
  const ae = document.activeElement; if (ae && ae.blur) ae.blur();
  renderView(); window.scrollTo(0, 0);
}

/* Keep what the user typed in an editable brief across re-renders */
function keepCustomFields(r) {

}

};
const CHANGE = {
  'up-file': (el) => { const f = el.files && el.files[0]; S.rep.upFile = f || null; const n = $('#upName'); if (n) n.textContent = f ? `${f.name} · ${(f.size / 1048576).toFixed(1)} MB` : 'Choose a recording'; const b = $('#upGo'); if (b) b.disabled = !f; },
  'vis-file': (el) => visFile(el),
  'ev-file': (el) => { const f = el.files && el.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { $('#evText').value = String(rd.result || '').slice(0, 60000); }; rd.readAsText(f); },
  'dx-pick': (el) => { const dx = C.DX.find((x) => x[0] === el.value); if (dx) { S.rep.spec = teachbackSpec(dx); Sheet.render(true); } },
  import: (el) => {
    const f = el.files && el.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => { try { const n = Store.importAll(JSON.parse(String(rd.result))); toast(`Restored ${n} items`); renderView(); } catch (e) { toast(e.message || 'That file couldn\'t be read.'); } };
    rd.readAsText(f);
  },
};

/* ---------------- Boot ---------------- */
function boot() {
  $('#brandMark').innerHTML = BRAND_SVG;
  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-act]');
    if (!t || t.tagName === 'INPUT') return;
    const fn = ACT[t.dataset.act];
    if (fn) { e.preventDefault(); fn(t, e); }
  });
  document.addEventListener('change', (e) => {
    const t = e.target;
    if (t.dataset.actChange && CHANGE[t.dataset.actChange]) return CHANGE[t.dataset.actChange](t);
    if (t.dataset.pf) return Store.saveProfile({ [t.dataset.pf]: t.value.trim() });
    if (t.dataset.set) {
      const k = t.dataset.set, s = Object.assign({}, Store.profile.settings);
      if (k === 'pace') { const [a, b] = t.value.split('-').map(Number); s.paceLo = a; s.paceHi = b; }
      else if (k === 'autoCoach' || k === 'voice') s[k] = t.checked;
      else if (k === 'customFillers') s.customFillers = t.value.split(',').map((x) => x.trim()).filter(Boolean).slice(0, 20);
      else s[k] = Number(t.value);
      Store.saveProfile({ settings: s }); toast('Saved');
    }
  });
  document.addEventListener('focusout', () => { setTimeout(() => { const ae = document.activeElement; if (S.pendingRender && !($('#view').contains(ae) && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName))) renderView(); }, 50); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && S.sheet && !Rec.active) Sheet.close(); });
  window.addEventListener('scroll', () => { const tb = $('.topbar'); if (tb) tb.classList.toggle('scrolled', window.scrollY > 4); }, { passive: true });
  window.addEventListener('hashchange', () => { const r = location.hash.slice(1); if (ROUTES.includes(r) && r !== S.route) { S.route = r; renderView(); } });
  const h = location.hash.slice(1); S.route = ROUTES.includes(h) ? h : 'today';
  Store.on((what) => {
    if (what === 'profile' || what === 'all') A.setCustomFillers(Store.profile.settings.customFillers);
    renderView();
  });
  AI.on(() => { renderView(); if (S.sheet && ['spar', 'prep', 'sharpen', 'visual', 'eval', 'review'].includes(S.sheet.type) && !(S.tool && S.tool.busy) && !(S.spar && S.spar.step !== 'setup')) Sheet.render(true); });
  Store.init();
  AI.init();
  if (window.speechSynthesis) { try { speechSynthesis.getVoices(); } catch (e) { /* ignore */ } }
}
boot();

</script>
</body></html>
