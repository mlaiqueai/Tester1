name: Daily NotebookLM-style Audio Briefing

# Runs every morning and produces a two-host audio overview of your scheduled
# tasks. Trigger it by hand anytime from the Actions tab (Run workflow).
on:
  schedule:
    - cron: "0 12 * * *"   # 12:00 UTC daily — adjust to your timezone
  workflow_dispatch:

permissions:
  contents: read

jobs:
  briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Generate briefing
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TTS_VOICE_A: alloy
          TTS_VOICE_B: shimmer
        run: python scripts/generate_briefing.py

      - name: Upload briefing (audio + text)
        uses: actions/upload-artifact@v4
        with:
          name: daily-briefing
          path: out/
          if-no-files-found: error
