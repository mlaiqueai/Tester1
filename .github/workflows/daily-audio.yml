name: Daily Audio Overviews

# Runs on GitHub's servers — your computer can be OFF.
on:
  schedule:
    # 11:03 UTC = 6:03 AM US-Central during CDT (summer). GitHub cron is UTC-only,
    # has no timezone/DST support, and may lag 5-15 min under load.
    # ⚠️ DST: when Central switches to CST (standard time, early Nov), 11:03 UTC
    #    becomes 5:03 AM local — change this to "3 12 * * *" then to keep it at 6 AM.
    - cron: "3 11 * * *"
  workflow_dispatch: {}   # lets you trigger a manual test run from the Actions tab

jobs:
  audio:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false          # one show failing must not kill the others
      matrix:
        show: [dx-daily, dx-deal-sourcer, dx-public-equities]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Set run date
        run: echo "RUN_DATE=$(date -u +%F)" >> "$GITHUB_ENV"

      - name: Research + write podcast script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: claude-opus-4-8
        run: python scripts/run_show.py "${{ matrix.show }}" "script.txt"

      - name: Generate audio (MP3, edge-tts — free, no API key)
        run: python scripts/generate_audio.py "script.txt" "${{ matrix.show }}-${RUN_DATE}.mp3"

      - name: Install rclone
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Write rclone config
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          # sanity: fail early with a clear message if the token JSON is broken
          rclone config show gdrive >/dev/null || { echo "rclone config is malformed"; exit 1; }

      - name: Upload MP3 to Google Drive (Daily Audio)
        run: |
          rclone copyto "${{ matrix.show }}-${RUN_DATE}.mp3" \
            "gdrive:Daily Audio/${{ matrix.show }}-${RUN_DATE}.mp3" -v

      - name: Save a copy as a build artifact (fallback)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.show }}-${{ env.RUN_DATE }}
          path: ${{ matrix.show }}-*.mp3
          if-no-files-found: ignore
