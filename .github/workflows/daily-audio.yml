name: Daily NotebookLM-style Audio Briefings

# Runs every morning and produces three two-host audio briefings
# (Public Equity, DX Intel, Overview). Trigger it by hand anytime from the
# Actions tab (Run workflow).
on:
  schedule:
    - cron: "0 12 * * *"   # 12:00 UTC daily — adjust to your timezone
  workflow_dispatch:

permissions:
  contents: read

jobs:
  briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Generate briefings
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TTS_VOICE_A: Kore
          TTS_VOICE_B: Puck
        run: python scripts/generate_briefing.py

      - name: Upload briefings (audio + text)
        uses: actions/upload-artifact@v4
        with:
          name: daily-briefings
          path: out/
          if-no-files-found: error
